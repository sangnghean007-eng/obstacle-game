<!doctype html>
<html><head><meta charset="utf-8"><title>The GOATs Clock Out</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const NEY_IMG = null;
// "THE ROLLING KING" — vertical 9:16 satirical cartoon short, based on real reported facts
// about Neymar at the 2018 World Cup. Everything is drawn on Canvas, rendered as a function of t (seconds).
const W = 1080, H = 1920, DURATION = 27.5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = 'Inter, "DejaVu Sans", sans-serif';
const DARK = '#151515';
const GROUND = 1540;

// ---------- utilities ----------
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = k => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
const TAU = Math.PI * 2;

function ell(x, y, rx, ry, fill, stroke = DARK, lw = 4, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function rrect(x, y, w, h, r, fill, stroke = DARK, lw = 4) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function limb(x1, y1, x2, y2, color, w = 8) {
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = DARK; ctx.lineWidth = w + 6; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function txt(s, x, y, size, fill = '#fff', stroke = DARK, align = 'center', weight = 900) {
  ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = Math.max(4, size * 0.2); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function popTxt(s, x, y, size, k, fill = '#fff', stroke = DARK, rot = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc);
  txt(s, 0, 0, size, fill, stroke); ctx.restore();
}
function bubble(x, y, s, tx, ty, k, size = 40) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(tx, ty); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc); ctx.translate(-tx, -ty);
  ctx.font = `800 ${size}px ${F}`;
  const w = ctx.measureText(s).width + 50, h = size + 40;
  ctx.beginPath(); ctx.moveTo(x - 24, y + h / 2 - 4); ctx.lineTo(tx, ty); ctx.lineTo(x + 24, y + h / 2 - 4); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke();
  rrect(x - w / 2, y - h / 2, w, h, 26, '#fff', DARK, 5);
  ctx.beginPath(); ctx.moveTo(x - 19, y + h / 2 - 3); ctx.lineTo(x + 19, y + h / 2 - 3); ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.stroke();
  txt(s, x, y + 1, size, DARK, null, 'center', 800);
  ctx.restore();
}
function burst(x, y, r, s, k, fill = '#ffd60a', size = 70, rot = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc);
  ctx.beginPath();
  for (let i = 0; i < 32; i++) { const a = i / 32 * TAU, rr = i % 2 ? r * 0.7 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.7); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#c1121f'; ctx.stroke();
  txt(s, 0, 2, size, '#c1121f', '#fff');
  ctx.restore();
}
// Shorts-style caption: big bold lines, one word/phrase highlighted
function caption(lines, y, k, size = 66, hl = '#ffd60a') {
  if (k <= 0) return;
  const sc = easeOutBack(clamp(k));
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc);
  lines.forEach((ln, i) => {
    const yy = (i - (lines.length - 1) / 2) * size * 1.18;
    const hot = ln.startsWith('*');
    txt(hot ? ln.slice(1) : ln, 0, yy, size, hot ? hl : '#fff', DARK);
  });
  ctx.restore();
}
// Real-fact card at the top: date chip + headline
function factCard(chip, lines, k, color = '#0b3d91') {
  if (k <= 0) return;
  const y = lerp(-260, 150, easeOut(k));
  ctx.save();
  const h = 70 + lines.length * 58;
  rrect(60, y, 960, h, 26, 'rgba(10,14,30,.88)', color, 6);
  ctx.font = `900 32px ${F}`; const cw = ctx.measureText(chip).width + 44;
  rrect(540 - cw / 2, y - 26, cw, 52, 26, '#ffd60a', DARK, 4);
  txt(chip, 540, y, 32, DARK, null);
  lines.forEach((ln, i) => txt(ln, 540, y + 64 + i * 58, 44, '#fff', null, 'center', 800));
  rrect(820, y + h - 22, 180, 40, 20, '#16a34a', DARK, 3); txt('REAL FACT', 910, y + h - 2, 22, '#fff', null);
  ctx.restore();
}

// ---------- stadium ----------
const crowd = []; {
  const R = rng(21);
  const cols = ['#ffdf00', '#16a34a', '#1e40af', '#ffffff', '#ffdf00', '#d62828', '#16a34a'];
  const skins = ['#f1c27d', '#e0ac69', '#c68642', '#ffdbac', '#8d5524'];
  for (let row = 0; row < 22; row++) {
    const y = 470 + row * 24;
    for (let x = -10; x < W + 10; x += 16 + R() * 5)
      crowd.push({ x: x + (row % 2) * 8, y, c: cols[Math.floor(R() * cols.length)], sk: skins[Math.floor(R() * skins.length)], ph: R() * TAU, r: 6 + row * 0.2 });
  }
}
function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, 470);
  g.addColorStop(0, '#081230'); g.addColorStop(1, '#25447a');
  ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, 800);
  const R = rng(3); ctx.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 70; i++) ctx.fillRect(R() * W, R() * 400, 2, 2);
}
function lights() {
  for (const x of [110, 970]) {
    ctx.fillStyle = '#555'; ctx.fillRect(x - 6, 120, 12, 330);
    rrect(x - 55, 70, 110, 60, 5, '#ddd', DARK, 3);
    const g = ctx.createRadialGradient(x, 100, 5, x, 100, 230);
    g.addColorStop(0, 'rgba(255,255,220,.85)'); g.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 230, -130, 460, 460);
  }
}
function stands(t, cheer = 0.6) {
  ctx.fillStyle = '#2b2f3a'; ctx.fillRect(-300, 440, W + 600, 560);
  for (let r = 0; r < 22; r++) { ctx.fillStyle = r % 2 ? '#323745' : '#2d313d'; ctx.fillRect(-300, 470 + r * 24 - 8, W + 600, 24); }
  for (const p of crowd) {
    const bob = -Math.abs(Math.sin(t * 9 + p.ph)) * 7 * cheer;
    ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r, p.y + bob, p.r * 2, p.r * 2 + 4);
    ctx.beginPath(); ctx.arc(p.x, p.y - 2 + bob, p.r * 0.8, 0, TAU); ctx.fillStyle = p.sk; ctx.fill();
  }
  const banners = [['GOAT', 230, 560, '#ffd60a'], ['THANK YOU LEGENDS', 640, 700, '#ffffff'], ['ONE LAST DANCE?', 320, 860, '#ffd60a']];
  for (const [s, x, y, c] of banners) {
    ctx.save(); ctx.translate(x, y + Math.sin(t * 4 + x) * 4); ctx.rotate(Math.sin(x) * 0.05);
    ctx.font = `900 30px ${F}`; const w = ctx.measureText(s).width + 34;
    rrect(-w / 2, -24, w, 48, 4, c, DARK, 3); txt(s, 0, 0, 30, '#c1121f', null); ctx.restore();
  }
  const ads = ['RETIREMENT PLANS', 'KNEE CREAM', 'GOAT MILK', 'PENSION FC'];
  for (let i = 0; i < 5; i++) {
    const x = -100 + i * 300;
    ctx.fillStyle = i % 2 ? '#0b3d91' : '#c1121f'; ctx.fillRect(x, 995, 300, 50);
    txt(ads[i % ads.length], x + 150, 1020, 24, '#fff', null, 'center', 900);
  }
  ctx.fillStyle = '#111'; ctx.fillRect(-300, 1043, W + 600, 5);
}
function pitch() {
  ctx.fillStyle = '#2f8f3c'; ctx.fillRect(-300, 1048, W + 600, H);
  for (let i = -8; i <= 8; i += 2) {
    const b0 = W / 2 + i * 170, b1 = b0 + 170, k = 0.5;
    ctx.beginPath(); ctx.moveTo(W / 2 + (b0 - W / 2) * k, 1048); ctx.lineTo(W / 2 + (b1 - W / 2) * k, 1048);
    ctx.lineTo(b1 + (b1 - W / 2) * 0.5, H + 300); ctx.lineTo(b0 + (b0 - W / 2) * 0.5, H + 300); ctx.closePath();
    ctx.fillStyle = '#38a346'; ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-300, 1070); ctx.lineTo(W + 300, 1070); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(W / 2, 1420, 360, 120, 0, 0, TAU); ctx.stroke();
}
function stadium(t, cheer) { sky(); lights(); stands(t, cheer); pitch(); }
function dim(a) { ctx.fillStyle = `rgba(5,8,20,${a})`; ctx.fillRect(-300, -300, W + 600, H + 600); }

// ---------- props ----------
function ball(x, y, r, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ell(0, 0, r, r, '#fff', DARK, Math.max(2, r * 0.15));
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, TAU); ctx.clip();
  const pent = (cx, cy, s) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - Math.PI / 2; ctx.lineTo(cx + Math.cos(q) * s, cy + Math.sin(q) * s); } ctx.fillStyle = '#1b1b1b'; ctx.fill(); };
  pent(0, 0, r * 0.36);
  for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - Math.PI / 2; pent(Math.cos(q) * r * 0.95, Math.sin(q) * r * 0.95, r * 0.3); }
  ctx.restore(); ctx.restore();
}
function sparkle(x, y, r, a, c = '#fff59d') { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.beginPath(); for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.3 : r; ctx.lineTo(Math.cos(i / 8 * TAU) * rr, Math.sin(i / 8 * TAU) * rr); } ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.restore(); }
function dust(x, y, t, n = 8, spread = 120) { const R = rng(Math.floor(t * 30) + 5); for (let i = 0; i < n; i++) ell(x + (R() - 0.5) * spread, y - R() * 40, 8 + R() * 14, 6 + R() * 8, 'rgba(160,120,70,.55)', null); }
function butterfly(x, y, t, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const f = Math.abs(Math.sin(t * 18));
  for (const d of [-1, 1]) { ell(d * 22 * f, -10, 24 * f + 3, 20, '#ff7ac6', DARK, 3); ell(d * 16 * f, 14, 16 * f + 2, 13, '#ffb3e0', DARK, 3); }
  ell(0, 0, 5, 20, DARK, null); ctx.restore();
}
function fork(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  rrect(-12, -420, 24, 300, 10, '#cfd4dc', DARK, 4);
  rrect(-55, -130, 110, 40, 12, '#cfd4dc', DARK, 4);
  for (let i = 0; i < 4; i++) rrect(-50 + i * 30, -100, 16, 110, 6, '#cfd4dc', DARK, 4);
  ctx.restore();
}
function noodleBowl(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (let i = -1; i <= 1; i++) { ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 5; ctx.beginPath(); for (let j = 0; j < 12; j++) ctx.lineTo(i * 26 + Math.sin(j * 0.8 + t * 6 + i) * 8, -60 - j * 7); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-70, -30); ctx.quadraticCurveTo(0, 90, 70, -30); ctx.closePath(); ctx.fillStyle = '#e63946'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke();
  ell(0, -30, 70, 16, '#ffe27a', DARK, 4);
  ctx.strokeStyle = '#e8b931'; ctx.lineWidth = 3; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-40 + i * 20, -30, 10, 0, Math.PI); ctx.stroke(); }
  ctx.restore();
}
function boot(x, y, a, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-40, -40); ctx.lineTo(-10, -40); ctx.lineTo(-6, -8); ctx.quadraticCurveTo(50, -6, 52, 12); ctx.lineTo(-44, 14); ctx.closePath();
  ctx.fillStyle = '#ff5a1f'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke();
  for (let i = 0; i < 4; i++) ctx.fillRect(-36 + i * 24, 14, 8, 8);
  ctx.restore();
}
function stopwatch(x, y, r, a, label) {
  rrect(x - 30, y - r - 60, 60, 50, 8, '#cfd4dc', DARK, 5);
  ell(x, y, r + 22, r + 22, '#cfd4dc', DARK, 6);
  ell(x, y, r, r, '#fffdf5', DARK, 5);
  for (let i = 0; i < 60; i++) { const q = i / 60 * TAU; const l = i % 5 ? 12 : 26; ctx.strokeStyle = DARK; ctx.lineWidth = i % 5 ? 3 : 6; ctx.beginPath(); ctx.moveTo(x + Math.sin(q) * (r - 10), y - Math.cos(q) * (r - 10)); ctx.lineTo(x + Math.sin(q) * (r - 10 - l), y - Math.cos(q) * (r - 10 - l)); ctx.stroke(); }
  limb(x, y, x + Math.sin(a) * (r - 40), y - Math.cos(a) * (r - 40), '#c1121f', 6);
  ell(x, y, 12, 12, '#c1121f', DARK, 4);
  rrect(x - 150, y + r * 0.3, 300, 84, 14, '#111', DARK, 4);
  txt(label, x, y + r * 0.3 + 44, 62, '#7CFC7C', null, 'center', 900);
}
function drumstick(x, y, a, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  rrect(30, -10, 70, 20, 10, '#f5f0e1', DARK, 4); ell(105, -12, 13, 13, '#f5f0e1', DARK, 4); ell(105, 12, 13, 13, '#f5f0e1', DARK, 4);
  ell(0, 0, 60, 46, '#c8741c', DARK, 5); ell(-15, -15, 18, 10, 'rgba(255,220,150,.6)', null);
  ctx.restore();
}
function dog(x, y, t, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, 0, 70, 40, '#c68642'); ell(70, -30, 38, 34, '#c68642'); ell(58, -60, 12, 24, '#7a4a1a', DARK, 4, -0.4);
  ell(80, -36, 6, 6, DARK, null); ell(104, -24, 9, 7, DARK, null);
  for (const lx of [-40, -15, 20, 45]) limb(lx, 30, lx + Math.sin(t * 20 + lx) * 10, 60, '#c68642', 10);
  limb(-68, -10, -100, -40 + Math.sin(t * 25) * 15, '#c68642', 8);
  ctx.restore();
}

// ---------- caricature characters ----------
// Neymar Jr. caricature: long face + pointy chin, bleached "spaghetti" hair with shaved sides,
// stubble + thin mustache, diamond stud, neck tattoo, yellow #10 with green trim, blue shorts.
function guy(x, y, base, o = {}) {
  o = Object.assign({}, base, o);
  const s = o.s || 1, R = o.R, bw = o.bw, P = o.p || 0, t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  ctx.translate(0, -80); ctx.rotate(o.rot || 0); ctx.translate(0, 80);
  ctx.lineJoin = 'round';
  const pose = o.pose || 'stand';
  let L = [[-12, 0], [12, 0]];
  if (pose === 'run') L = [[Math.sin(P) * 24, -Math.max(0, Math.cos(P)) * 16], [-Math.sin(P) * 24, -Math.max(0, -Math.cos(P)) * 16]];
  else if (pose === 'kick') L = [[-16, 0], [50, -36]];
  else if (pose === 'splay') L = [[-42, -18 + Math.sin(P) * 12], [42, -18 - Math.sin(P) * 12]];
  else if (pose === 'spread') L = [[-30, 0], [30, 0]];
  else if (pose === 'jump') L = [[-22, -20], [22, -20]];
  const hipY = -48;
  L.forEach(([fx, fy], i) => {
    const hx = i ? 9 : -9;
    limb(hx, hipY, fx, fy - 6, o.pants || o.skin, 9);
    if (!o.pants) limb(lerp(hx, fx, 0.55), lerp(hipY, fy - 6, 0.55), fx, fy - 6, o.sock || '#fff', 10);
    ell(fx + 7, fy - 3, 15, 8, o.pants ? '#3b2416' : (o.bootCol || '#111'), DARK, 3);
  });
  const top = hipY - 60;
  rrect(-bw / 2, top, bw, 64, 16, o.col);
  if (o.stripes) { ctx.save(); ctx.beginPath(); ctx.roundRect(-bw / 2, top, bw, 64, 16); ctx.clip(); ctx.fillStyle = o.stripes; for (let i = -3; i < 4; i++) ctx.fillRect(i * 16 - 4, top, 8, 70); ctx.restore(); rrect(-bw / 2, top, bw, 64, 16, null); }
  if (o.collar) { ctx.beginPath(); ctx.moveTo(-14, top + 1); ctx.lineTo(0, top + 14); ctx.lineTo(14, top + 1); ctx.lineWidth = 6; ctx.strokeStyle = o.collar; ctx.stroke(); }
  if (o.tie) { ctx.beginPath(); ctx.moveTo(-7, top + 2); ctx.lineTo(7, top + 2); ctx.lineTo(4, top + 44); ctx.lineTo(0, top + 52); ctx.lineTo(-4, top + 44); ctx.closePath(); ctx.fillStyle = '#d62828'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = DARK; ctx.stroke(); }
  rrect(-bw / 2 - 1, hipY - 8, bw + 2, 16, 5, o.shorts);
  if (o.num) txt(o.num, 0, top + 34, 22, o.col2, null);
  const shY = top + 10, sw = bw / 2 - 4;
  const hand = (side) => {
    const sx = side * sw, A = o.arms || 'swing';
    switch (A) {
      case 'up': return [side * (R + 22) + Math.sin(t * 14 + side) * 8, top - 40];
      case 'flail': return [sx + Math.cos(P * 1.7 + side * 2) * 46, shY + Math.sin(P * 2.3 + side) * 46];
      case 'hips': return [side * (bw / 2 + 6), top + 44];
      case 'shrug': return [side * (bw / 2 + 34), top - 16];
      case 'clutch': return [12 + side * 6, -26];
      case 'mic': return side > 0 ? [bw / 2 + 24, top - 10] : [-bw / 2 - 6, top + 44];
      case 'point': return side > 0 ? [bw / 2 + 30, top - 70] : [-bw / 2 - 8, top + 44];
      default: return [sx + side * 6 + Math.sin(P) * side * 18, top + 52];
    }
  };
  const drawArm = (side) => {
    const [hx, hy] = hand(side); const sx = side * sw;
    if (o.arms === 'hips' || o.arms === 'shrug') { const ex = side * (bw / 2 + 26), ey = top + 26; limb(sx, shY, ex, ey, o.skin, 8); limb(ex, ey, hx, hy, o.skin, 8); }
    else limb(sx, shY, hx, hy, o.tie ? o.col : o.skin, 8);
    limb(sx, shY, lerp(sx, hx, 0.3), lerp(shY, hy, 0.3), o.col, 12);
    if (o.tattoo && side > 0) { ctx.strokeStyle = 'rgba(30,30,60,.55)'; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(lerp(sx, hx, 0.6 + i * 0.1), lerp(shY, hy, 0.6 + i * 0.1), 3, 0, TAU); ctx.stroke(); } }
    ell(hx, hy, 8, 8, o.skin, DARK, 3);
    if (o.arms === 'mic' && side > 0) { limb(hx, hy, hx + 26, hy - 30, '#333', 6); ell(hx + 32, hy - 38, 14, 14, '#888', DARK, 4); }
  };
  drawArm(-1);
  if (o.photo) {
    const k = R * 2.4 / 585;
    limb(0, top + 4, 0, top - 30, o.skin, 26);
    ctx.save(); ctx.translate(0, top + 14); ctx.scale(k, k); ctx.rotate(o.headTilt || Math.sin(t * 2.3) * 0.03);
    ctx.drawImage(NEY_IMG, -322, -824); photoFace(o, t);
    ctx.restore();
  } else if (o.detailed) {
    const sc = R / 100, hy = top - 150 * sc;
    limb(-8, top + 4, -8, hy + 120 * sc, o.skin, 22 * sc + 6); limb(8, top + 4, 8, hy + 120 * sc, o.skin, 22 * sc + 6);
    if (o.tattoo) { ctx.strokeStyle = 'rgba(30,30,70,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(10, top - 14, 6, 0, TAU); ctx.moveTo(-14, top - 8); ctx.lineTo(-4, top - 18); ctx.stroke(); }
    ctx.save(); ctx.translate(0, hy); ctx.scale(sc, sc); neymarHead(o, t); ctx.restore();
  } else {
    const LF = o.longFace || 1.04;
    const hy = top - R * LF + 10;
    limb(0, top + 2, 0, hy + R * 0.6, o.skin, 16);
    if (o.tattoo) { ctx.fillStyle = 'rgba(30,30,60,.5)'; ctx.font = `900 10px ${F}`; ctx.fillText('✦', -6, top - 6); }
    ell(-R * 0.9, hy + 6, 12, 15, o.skin);
    if (o.earring) { ell(-R * 0.92, hy + 22, 5, 5, '#e8f6ff', DARK, 2); sparkle(-R * 0.92, hy + 22, 9, t * 3, '#fff'); }
    hair(o, R, hy, 'back', t, LF);
    // head (long face with pointy chin for Neymar)
    ctx.beginPath(); ctx.ellipse(0, hy, R, R * LF, 0, 0, TAU);
