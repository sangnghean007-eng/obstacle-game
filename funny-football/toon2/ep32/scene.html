<!doctype html><html><head><meta charset="utf-8"><title>Trust Fall</title><style>html,body{margin:0;background:#000}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../pro.js"></script><script src="../fx.js"></script><script src="../styles.js"></script><script src="../shots.js"></script><script src="../puppet.js"></script>
<script>
// Ep32 "TRUST FALL" v3 — Clásico rivals (Mbappé: Real Madrid, Yamal: Barcelona; facts: ep32/facts.md). Phone-filmed park prank.
// v3 (21 Nov 2026): heroes are AI cut-out puppets (cast/*, puppet.js), not code chibis; light ink look keeps the kit colours;
// timings are unchanged so audio.py still hits every beat (bonks 10.2 s and 15.5 s).
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, eOut = k => 1 - (1 - clamp(k)) ** 3, eIn = k => clamp(k) ** 2;
const eBack = k => { k = clamp(k); const c = 1.7; return 1 + (c + 1) * (k - 1) ** 3 + c * (k - 1) ** 2; };
PUPPET.load(['mbappe', 'yamal']);
const GZ = 1600, FONT = '"Caveat","Comic Sans MS",cursive', INK = '#2a1d12';
// ---- light ink look: hand-drawn boil + paper grain, colours kept (the kits are how people recognise the players)
const paper = (() => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const g = c.getContext('2d'); const d = g.createImageData(540, 960); let r = 7;
  for (let i = 0; i < d.data.length; i += 4) { r = (r * 16807) % 2147483647; const v = 236 + (r % 20); d.data[i] = v; d.data[i + 1] = v - 6; d.data[i + 2] = v - 18; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; })();
const snap = document.createElement('canvas'); snap.width = W; snap.height = H; const sg = snap.getContext('2d');
function post(t) { sg.clearRect(0, 0, W, H); sg.drawImage(cv, 0, 0); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const k = Math.floor(t * 30 / 3); let r = (k * 9301 + 49297) % 233280; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  for (let y = 0; y < H; y += 64) { const dx = (rnd() - 0.5) * 3; ctx.drawImage(snap, 0, y, W, 64, dx, y, W, 64); }
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.55; ctx.drawImage(paper, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; const v = ctx.createRadialGradient(540, 960, 500, 540, 960, 1250); v.addColorStop(0, 'rgba(40,25,10,0)'); v.addColorStop(1, 'rgba(40,25,10,.38)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); ctx.restore(); }
// ---- text: big, hand-lettered, always on a paper card so it reads on a phone in 1 s
function card(s, x, y, size, o = {}) { ctx.save(); ctx.font = `700 ${size}px ${FONT}`; const tw = ctx.measureText(s).width, pw = tw + size * 0.9, ph = size * 1.35;
  ctx.translate(x, y); ctx.rotate(o.rot || 0); const sc = o.pop != null ? eBack(o.pop) : 1; ctx.scale(sc, sc);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.roundRect(-pw / 2 + 8, -ph / 2 + 10, pw, ph, 18); ctx.fill();
  ctx.fillStyle = o.bg || '#fffaf0'; ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(-pw / 2, -ph / 2, pw, ph, 18); ctx.fill(); ctx.stroke();
  if (o.tail) { ctx.beginPath(); ctx.moveTo(o.tail * 40 - 30, ph / 2 - 3); ctx.lineTo(o.tail * 110, ph / 2 + 70); ctx.lineTo(o.tail * 40 + 30, ph / 2 - 3); ctx.fill(); ctx.stroke(); ctx.fillRect(o.tail * 40 - 27, ph / 2 - 8, 54, 8); }
  ctx.fillStyle = o.col || INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 4); ctx.restore(); }
function stamp(s, x, y, size, k, col = '#c0281c') { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.rotate(-0.07); const sc = 1.6 - 0.6 * eOut(k * 2.5); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 4);
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 16; ctx.strokeStyle = '#fffaf0'; ctx.strokeText(s, 0, 0); ctx.fillStyle = col; ctx.fillText(s, 0, 0);
  const tw = ctx.measureText(s).width; ctx.lineWidth = 7; ctx.strokeStyle = col; ctx.strokeRect(-tw / 2 - 30, -size * 0.65, tw + 60, size * 1.3); ctx.restore(); }
// ---- the park + the friends filming it (silhouettes with phones: they never compete with the two faces)
const PARK = {}; // the park never changes: drawn once per blur level into a cache (a full-canvas blur every frame cost ~1 s/frame)
function park(t, blur = 0) { if (!PARK[0]) { const c = document.createElement('canvas'); c.width = W + 1800; c.height = H + 1800; const g = c.getContext('2d'); g.translate(900, 900); parkDraw(g, 0); PARK[0] = c; }
  if (!PARK[blur]) { const f = 1 + blur * 0.7, sm = document.createElement('canvas'); sm.width = Math.round((W + 1800) / f); sm.height = Math.round((H + 1800) / f); // blur = shrink + smooth upscale
    sm.getContext('2d').drawImage(PARK[0], 0, 0, sm.width, sm.height); const c = document.createElement('canvas'); c.width = W + 1800; c.height = H + 1800; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(sm, 0, 0, c.width, c.height); PARK[blur] = c; }
  ctx.drawImage(PARK[blur], -900, -900); }
function parkDraw(ctx) { ctx.save();
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#d9ead0'); g.addColorStop(0.42, '#a9cf95'); g.addColorStop(1, '#6d9a52'); ctx.fillStyle = g; ctx.fillRect(-900, -900, W + 1800, H + 1800);
  for (let i = -2; i < 10; i++) { const x = i * 150 - 30; ctx.fillStyle = i % 2 ? '#6f9452' : '#5d8344'; ctx.beginPath(); ctx.arc(x, 640 + (i % 3) * 34, 180, 0, 7); ctx.fill(); ctx.fillStyle = '#6b4a2a'; ctx.fillRect(x - 15, 720, 30, 300); }
  ctx.fillStyle = '#8a6a44'; for (let x = -400; x < W + 400; x += 38) ctx.fillRect(x, 880, 22, 170); ctx.fillRect(-400, 900, W + 800, 14); ctx.fillRect(-400, 990, W + 800, 14);
  ctx.fillStyle = '#80ad64'; ctx.fillRect(-900, 1040, W + 1800, H + 900); ctx.strokeStyle = 'rgba(50,85,35,.45)'; ctx.lineWidth = 3;
  for (let i = 0; i < 320; i++) { const x = ((i * 97) % (W + 600)) - 300, y = 1060 + (i * 61) % 1100; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 6, y - 16); ctx.stroke(); } ctx.restore(); }
const FR = document.createElement('canvas'); FR.width = W / 6; FR.height = H / 6; const frg = FR.getContext('2d');
function friends(t, laugh, blur = 3) { const main = ctx; frg.setTransform(1 / 6, 0, 0, 1 / 6, 0, 0); frg.clearRect(0, 0, W, H); // drawn at 1/6 size and scaled up = cheap soft blur
  { const ctx = frg; friendsDraw(ctx, t, laugh); }
  main.save(); main.globalAlpha = 0.75; main.filter = 'saturate(.6)'; main.imageSmoothingQuality = 'high'; main.drawImage(FR, 0, 0, W, H); main.restore();
  if (laugh > 0.2) { ctx.save(); ctx.font = `700 58px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = INK; ['HAHA', '😂', 'LOL', 'HAHAHA'].forEach((s, i) => ctx.fillText(s, [90, 235, 850, 1000][i], 880 - Math.abs(Math.sin(t * 9 + i)) * 30)); ctx.restore(); } }
function friendsDraw(ctx, t, laugh) { ctx.save(); // 4 friends: 2 Barça, 2 Madrid — they all film, they all laugh
  [[90, 1180, '#a50044', 1], [235, 1150, '#f4f4f4', 1], [850, 1160, '#f4f4f4', -1], [1000, 1190, '#a50044', -1]].forEach(([x, y, k, f], i) => {
    const j = laugh * Math.abs(Math.sin(t * 13 + i * 1.7)) * 22; y -= j; ctx.fillStyle = '#3a2a1e'; ctx.beginPath(); ctx.arc(x, y - 250, 46, 0, 7); ctx.fill();
    ctx.fillStyle = k; ctx.beginPath(); ctx.roundRect(x - 62, y - 205, 124, 170, 30); ctx.fill(); if (k === '#a50044') { ctx.fillStyle = '#004d98'; ctx.fillRect(x - 20, y - 205, 22, 170); }
    ctx.fillStyle = '#2b2b33'; ctx.fillRect(x - 50, y - 35, 40, 130); ctx.fillRect(x + 10, y - 35, 40, 130);
    ctx.save(); ctx.translate(x + f * 40, y - 255); ctx.rotate(f * 0.15); ctx.fillStyle = '#111'; ctx.fillRect(-26, -44, 52, 88); ctx.fillStyle = `rgba(150,210,255,${0.6 + 0.3 * Math.sin(t * 7 + i)})`; ctx.fillRect(-21, -38, 42, 76); ctx.restore(); });
  ctx.restore(); }
// ---- heroes
const idle = (t, k = 1) => ({ sq: Math.sin(t * 3.2) * 0.008 * k, tilt: Math.sin(t * 1.7) * 0.03 * k });
const MB = (o, t) => PUPPET.draw(ctx, 'mbappe', Object.assign({ h: 900 }, idle(t), o));
const YA = (o, t) => PUPPET.draw(ctx, 'yamal', Object.assign({ h: 800 }, idle(t + 1), o));
const YX = 940, MX = 400; // fall line: Yamal's feet at YX so his face is still in frame when he lands flat
function phoneHUD(t) { ctx.save(); ctx.font = '700 40px Inter, sans-serif'; ctx.fillStyle = '#e02020'; if (Math.floor(t * 2) % 2) { ctx.beginPath(); ctx.arc(110, 258, 15, 0, 7); ctx.fill(); }
  ctx.fillText('REC', 138, 272); ctx.fillStyle = 'rgba(255,255,255,.9)'; const s = Math.floor(t); ctx.fillText(`00:${String(s).padStart(2, '0')}`, 870, 272); ctx.restore(); }
const SEG = [
  // 1 HOOK — Yamal already leaning back, Mbappé's promise in giant letters (frame 0 says what the video is)
  [0, 2.8, 'cu', (z, t) => SHOT.cu(ctx, () => { park(t, 2); friends(t, 0, 5);
      MB({ x: 360, y: GZ, armL: lerp(5, 30, eOut(z / 1.2)), armR: lerp(5, 35, eOut(z / 1.2)), expr: z > 1.6 ? 'laugh' : 'smug' }, t);
      YA({ x: 730, y: GZ, rot: -0.05 - 0.04 * Math.sin(z * 3), armL: 15, armR: 15, expr: z < 1.4 ? 'smug' : 'deadpan' }, t); }, { x: 540, y: 1140, zoom: 1.22 }),
    (z, t) => { card("Don't worry bro,", 540, 262, 76, { pop: 0.7 + z / 0.35, rot: -0.02 }); card("I'll catch you 🤝", 560, 362, 76, { pop: z < 0.4 ? 0.7 : 0.7 + (z - 0.4) / 0.35, rot: 0.02, tail: -1 }); }],
  // 2 the fall — worm's-eye, Yamal tips back like a plank
  [2.8, 5.0, 'low', (z, t) => SHOT.low(ctx, () => { park(t); friends(t, 0, 4); const q = eIn(clamp((z - 0.3) / 1.6));
      MB({ x: MX, y: GZ, armL: 40, armR: lerp(35, 70, q), expr: 'smug' }, t);
      YA({ x: YX, y: GZ, rot: -q * 0.78, armL: 8, armR: 8, legL: 0, legR: 0, expr: q > 0.35 ? 'shock' : 'smug' }, t); }, { x: 660, y: 1300, lift: 200, zoom: 1.25 }),
    (z) => { card('trust fall… 😬', 540, 280, 84, { pop: z / 0.3 }); }],
  // 3 he actually catches him
  [5.0, 7.0, 'wide', (z, t) => SHOT.wide(ctx, () => { park(t); friends(t, 0); const b = Math.sin(clamp(z / 0.4) * Math.PI) * 18;
      MB({ x: MX, y: GZ, armL: 40, armR: 72, expr: 'laugh', sq: -0.02 }, t);
      YA({ x: YX, y: GZ - b, rot: -0.78, armL: 10, armR: 25, expr: 'laugh' }, t); }, { x: 640, y: 1180, zoom: 1.0 }),
    (z) => { stamp('CAUGHT ✅', 540, 380, 120, z - 0.15, '#1f7a3a'); }],
  // 4 the realisation — extreme close-up: Mbappé looks down… Barça stripes
  [7.0, 8.6, 'xcu', (z, t) => { park(t, 8); const look = z > 0.55;
      if (!look) PUPPET.bust(ctx, 'mbappe', 'smug', 540 + Math.sin(t * 2) * 6, 900, 820, { rot: 0.04, kit: '#f7f7f7', stripes: '#111' });
      else { // what he sees: the shirt, huge
        ctx.save(); ctx.translate(540, 1150); ctx.rotate(-0.25); for (let i = -6; i < 7; i++) { ctx.fillStyle = i % 2 ? '#a50044' : '#004d98'; ctx.fillRect(i * 120 - 60, -900, 120, 1800); } ctx.restore();
        PUPPET.bust(ctx, 'mbappe', 'shock', 540, 760 + (1 - eOut((z - 0.55) / 0.2)) * 200, 700, { kit: '#f7f7f7', stripes: '#111' }); } },
    (z) => { if (z > 0.62) card('…wait. BARÇA?', 540, 1370, 96, { pop: (z - 0.62) / 0.25, rot: -0.03 }); }],
  // 5 slow-mo drop + shrug, BONK at 10.2
  [8.6, 11.0, 'slowmo', (z, t) => { const tt = SHOT.slow(z, 0.25, 0.4), q = eIn(clamp((tt - 0.25) / 0.55)), land = 1.6;
      SHOT.cu(ctx, () => { park(t); friends(t, z > land ? 0.7 : 0);
        MB({ x: MX, y: GZ, armL: z < 0.25 ? 40 : lerp(40, 95, eOut((z - 0.25) / 0.4)), armR: z < 0.25 ? 72 : lerp(72, 100, eOut((z - 0.25) / 0.4)), expr: z < land ? 'smug' : 'deadpan', tilt: z > land ? -0.12 : 0 }, t);
        const rot = -0.78 - q * 0.79, drop = z > land ? Math.max(0, 1 - (z - land) * 5) * Math.abs(Math.sin((z - land) * 30)) * 14 : 0;
        if (z < land) for (let g = 3; g >= 1; g--) { ctx.save(); ctx.globalAlpha = 0.12 * g; YA({ x: YX, y: GZ, rot: -0.78 - eIn(clamp((SHOT.slow(z - g * 0.05, 0.25, 0.4) - 0.25) / 0.55)) * 0.79, armL: 30, armR: 30, expr: 'shock', shadow: false }, t); ctx.restore(); }
        YA({ x: YX, y: GZ - drop, rot, armL: 30 + q * 25, armR: 30 + q * 25, legL: 8, legR: 8, expr: 'shock' }, t);
        if (z > land) FX.burst(ctx, 'dust', 700, GZ - 10, t, 8.6 + land, { ground: GZ + 20, n: 14 }); }, { x: 580, y: 1180, zoom: 1.2 });
      if (z < land) SHOT.speedlines(ctx, t, { alpha: 0.25, col: '#fffaf0' }); },
    (z) => { if (z > 1.6) stamp('BONK', 770, 330, 140, z - 1.6); }],
  // 6 over the phone: the friends film Yamal flat on the grass (Yamal's face stays readable: no bird's-eye)
  [11.0, 13.2, 'ots', (z, t) => { SHOT.ots(ctx, () => { park(t); YA({ x: 1080, y: 1500, rot: -1.57, armL: 110, armR: 20, legL: 5, legR: 15, expr: z < 1.1 ? 'shock' : 'angry', tilt: 0, shadow: false }, t);
        for (let k = 0; k < 4; k++) { const a = t * 5 + k * 1.57; ctx.font = '56px serif'; ctx.textAlign = 'center'; ctx.fillText('⭐', 330 + Math.cos(a) * 120, 1270 + Math.sin(a) * 40); } }, { x: 560, y: 1380, zoom: 1.4, side: 1, fg: '#3a2a1e', shirt: '#f4f4f4' });
      phoneHUD(t); },
    (z) => { card('HAHAHAHA 😂', 540, 420, 96, { pop: z / 0.3, rot: 0.03 }); }],
  // 7 callback: Yamal's turn — same words, same drop. 'oops… MADRID'
  [13.2, 16.5, 'dutch', (z, t) => SHOT.dutch(ctx, () => { park(t); friends(t, z > 2.2 ? 0.8 : 0.3); const fall = z > 1.3, q = eIn(clamp((z - 1.3) / 0.95));
      const back = eOut(clamp((z - 1.2) / 0.35)); YA({ x: 300 - back * 40, y: GZ - back * 90, h: 860 - back * 120, armL: fall ? lerp(40, 100, eOut((z - 1.3) / 0.4)) : 40, armR: fall ? lerp(40, 100, eOut((z - 1.3) / 0.4)) : 40, expr: z < 1.3 ? 'smug' : 'laugh' }, t);
      MB({ x: 880, y: GZ, h: 780, rot: -q * 1.48, armL: 10 + q * 60, armR: 10 + q * 60, expr: q > 0 ? 'shock' : 'deadpan' }, t);
      if (q >= 1) FX.burst(ctx, 'dust', 330, GZ - 10, t, 13.2 + 2.25, { ground: GZ + 20, n: 12 }); }, { x: 520, y: 1220, zoom: 1.05, rot: -0.12 }),
    (z) => { card(z < 1.3 ? 'your turn 😇' : 'oops… MADRID 🤷', 480, 300, 88, { pop: (z < 1.3 ? z : z - 1.3) / 0.3, tail: -1 }); if (z > 2.4) stamp('CLÁSICO RIVALS 😂', 620, 455, 84, z - 2.4); }],
];
window.DURATION = 16.5; window.render = function (t) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.clearRect(0, 0, W, H);
  const seg = SEG.find(s => t >= s[0] && t < s[1]) || SEG[SEG.length - 1]; const z = t - seg[0];
  const hs = [[10.2, 22], [15.5, 18]].reduce((m, [a, A]) => Math.max(m, t >= a && t < a + 0.3 ? A * (1 - (t - a) / 0.3) : 0), 0) + Math.sin(t * 3) * 3; // handheld phone feel + hit shake
  ctx.save(); ctx.translate(Math.sin(t * 2.1) * 6 + Math.sin(t * 91) * hs, Math.cos(t * 1.7) * 5 + Math.cos(t * 77) * hs); ctx.rotate(Math.sin(t * 0.9) * 0.006); seg[3](z, t); ctx.restore();
  if (z < 0.16 && t > 0.1) PRO.whip(ctx, cv, z / 0.16, SEG.indexOf(seg) % 2 ? -1 : 1); post(t); ctx.setTransform(1, 0, 0, 1, 0, 0); seg[4](z, t);
  ctx.font = '600 28px Inter'; ctx.fillStyle = 'rgba(42,29,18,.75)'; ctx.textAlign = 'center'; if (t > 15.3) ctx.fillText('Cartoon parody', 540, 232); };
if (!location.search.includes('render')) { const t0 = performance.now(); (window.CAST_READY || Promise.resolve()).then(() => (function loop() { render(((performance.now() - t0) / 1000) % 16.5); requestAnimationFrame(loop); })()); }
