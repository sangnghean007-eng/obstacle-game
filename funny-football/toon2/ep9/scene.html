<script>

const W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
const F = 'Inter, "DejaVu Sans", sans-serif', DARK = '#1a0f08', TAU = Math.PI * 2;
const lerp = (a, b, k) => a + (b - a) * k, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = k => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2), easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const eOB = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
function rr(x, y, w, h, r, fill, stroke, lw = 5) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function txt(s, x, y, size, fill = '#fff', stroke = DARK, align = 'center', weight = 900) { ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; if (stroke) { ctx.lineWidth = Math.max(6, size * 0.22); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); } ctx.fillStyle = fill; ctx.fillText(s, x, y); }
function pop(k, x, y, fn) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); const s = eOB(k); ctx.scale(s, s); fn(); ctx.restore(); }
function camK(keys, u) { let i = 0; while (i < keys.length - 1 && u > keys[i + 1][0]) i++; const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)]; const k = b[0] > a[0] ? easeIO((u - a[0]) / (b[0] - a[0])) : 0; return [1, 2, 3, 4].map(j => lerp(a[j] || 0, b[j] || 0, k)); }
function cam(C, fn, shake = 0, t = 0) { ctx.save(); ctx.translate(W / 2 + Math.sin(t * 91) * shake, H / 2 + Math.cos(t * 77) * shake); ctx.rotate(C[3] || 0); ctx.scale(C[2], C[2]); ctx.translate(-C[0], -C[1]); fn(); ctx.restore(); }
function burst(x, y, r, s, k, size, fill = '#ffd60a', rot = 0) { pop(k, x, y, () => { ctx.rotate(rot); ctx.beginPath(); for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, q = i % 2 ? r * 0.68 : r; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q * 0.75); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = DARK; ctx.stroke(); if (s) txt(s, 0, 2, size, '#c1121f', '#fff'); }); }
function ell(x, y, rx, ry, fill, lw = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = DARK; ctx.stroke(); } }
function puff(x, y, k, n = 8, R0 = 160, col = '235,225,200') { if (k <= 0 || k >= 1) return; for (let i = 0; i < n; i++) { const a = Math.PI + i / (n - 1) * Math.PI, d = R0 * easeOut(k); ell(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.45, 46 * (1 - k * 0.6), 40 * (1 - k * 0.6), `rgba(${col},${0.95 * (1 - k)})`); } }
function stars(x, y, t, r = 120) { for (let i = 0; i < 4; i++) { const a = t * 7 + i * TAU / 4; ctx.save(); ctx.translate(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.3); ctx.rotate(t * 5); ctx.beginPath(); for (let j = 0; j < 10; j++) { const q = j % 2 ? 11 : 28; ctx.lineTo(Math.cos(j / 10 * TAU - 1.57) * q, Math.sin(j / 10 * TAU - 1.57) * q); } ctx.closePath(); ctx.fillStyle = '#ffe14d'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke(); ctx.restore(); } }
function speed(x, y, dir, t, n = 8, len = 300) { const R = rng(Math.floor(t * 30) + 3); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineCap = 'round'; for (let i = 0; i < n; i++) { const yy = y + (R() - 0.5) * 500; ctx.lineWidth = 6 + R() * 6; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x - dir * (len + R() * 200), yy); ctx.stroke(); } }
function badge(n, k, x = W / 2) { pop(k, x, 290, () => { ell(0, 0, 80, 80, '#ffd60a', 8); txt(String(n), 0, 6, 96, DARK, null); }); }
function flash(k) { if (k > 0 && k < 1) { ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - k)})`; ctx.fillRect(0, 0, W, H); } }
const juice = (x, y) => { rr(x - 30, y - 70, 60, 90, 8, '#ff8fab', DARK, 6); rr(x - 30, y - 40, 60, 30, 0, '#fff', null); ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x + 8, y - 70); ctx.lineTo(x + 30, y - 140); ctx.lineTo(x + 70, y - 150); ctx.stroke(); };
function goatJudge(x, y, s, t, o = {}) { // o: chew (0..1), eyes ('normal'|'spin'), gavel angle, burp
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // robe
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(-170, 260); ctx.quadraticCurveTo(-150, 60, 0, 40); ctx.quadraticCurveTo(150, 60, 170, 260); ctx.closePath(); ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = DARK; ctx.stroke(); rr(-30, 50, 60, 60, 10, '#fff', DARK, 4);

  // ears
  for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 120, -90); ctx.rotate(d * (0.5 + Math.sin(t * 3) * 0.08)); ell(d * 40, 0, 70, 28, '#f2ece0', 6); ell(d * 40, 0, 45, 14, '#f4b8b8', 0); ctx.restore(); }
  // head
  ctx.beginPath(); ctx.moveTo(-110, -120); ctx.quadraticCurveTo(-120, -210, 0, -215); ctx.quadraticCurveTo(120, -210, 110, -120); ctx.quadraticCurveTo(100, 10, 60, 50); ctx.quadraticCurveTo(0, 80, -60, 50); ctx.quadraticCurveTo(-100, 10, -110, -120); ctx.closePath(); ctx.fillStyle = '#efe2c8'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.save(); ctx.clip(); ell(0, -150, 70, 55, '#c9a46a'); ctx.restore();
  // judge wig
  for (let i = 0; i < 7; i++) ell(-90 + i * 30, -200 + Math.abs(i - 3) * 6, 26, 24, '#ffffff', 5); for (const d of [-1, 1]) for (let j = 0; j < 3; j++) ell(d * 125, -140 + j * 40, 24, 22, '#ffffff', 5);
  // big curved horns poking up through the wig
  ctx.lineCap = 'round'; for (const [w, col] of [[34, DARK], [22, '#a8875a']]) { ctx.lineWidth = w; ctx.strokeStyle = col; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 45, -195); ctx.bezierCurveTo(d * 70, -330, d * 190, -330, d * 200, -230); ctx.stroke(); } } ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4; for (const d of [-1, 1]) for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(d * (80 + i * 30), -290 + i * 10, 12, 0, Math.PI); ctx.stroke(); }
  // eyes (goat pupils)
  for (const d of [-1, 1]) { ell(d * 48, -95, 30, 26, '#fff7d6', 6); if (o.eyes === 'spin') { ctx.save(); ctx.translate(d * 48, -95); ctx.rotate(t * 12 * d); rr(-16, -5, 32, 10, 5, DARK, null); ctx.restore(); } else { const lx = (o.look || 0) * 8; rr(d * 48 - 13 + lx, -100, 26, 10, 5, DARK, null); } }
  // brows
  ctx.lineWidth = 9; ctx.strokeStyle = DARK; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 25, -135 + (o.angry ? d * 0 + 8 : 0)); ctx.lineTo(d * 75, -140 - (o.angry ? 10 : 0)); ctx.stroke(); }
  // snout + mouth (chewing)
  ell(0, 10, 62, 40, '#f4d6c8', 6); ell(-20, 0, 9, 7, DARK); ell(20, 0, 9, 7, DARK);
  const ch = o.chew ? Math.abs(Math.sin(t * 18)) : 0; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-30, 30 + ch * 6); ctx.quadraticCurveTo(0, 46 + ch * 14, 30, 30 + ch * 6); ctx.stroke();
  // beard
  ctx.beginPath(); ctx.moveTo(-28, 50); ctx.quadraticCurveTo(-10, 120, 0, 165 + Math.sin(t * 4) * 8); ctx.quadraticCurveTo(10, 120, 28, 50); ctx.closePath(); ctx.fillStyle = '#d8c7a3'; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
  // gavel
  if (o.gavel !== undefined) { ctx.save(); ctx.translate(140, 120); ctx.rotate(o.gavel); ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-8, -120, 16, 120); ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.strokeRect(-8, -120, 16, 120); rr(-50, -165, 100, 55, 14, '#6b3f1f', DARK, 6); ctx.restore(); }
  ctx.restore();
}
function fitTxt(s, x, y, size, maxW) { ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width; txt(s, x, y, Math.max(26, Math.min(size, size * maxW / w)), DARK, null); }
function fball(x, y, r, a) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ell(0, 0, r, r, '#fff', 5); ctx.fillStyle = DARK; const pent = (cx, cy, rr2) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - 1.57; ctx.lineTo(cx + Math.cos(q) * rr2, cy + Math.sin(q) * rr2); } ctx.closePath(); ctx.fill(); }; pent(0, 0, r * 0.33); ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - 1.57; pent(Math.cos(q) * r * 0.95, Math.sin(q) * r * 0.95, r * 0.3); } ctx.restore(); ell(-r * 0.35, -r * 0.4, r * 0.18, r * 0.1, 'rgba(255,255,255,.7)'); ctx.restore(); }
const P_CROSS = { bArm: [70, -110], fArm: [-70, 110], bLeg: [-8, -4], fLeg: [8, 4] }, P_SKY = { bArm: [-145, -165], fArm: [125, 150], bLeg: [-10, -6], fLeg: [10, 6] }, P_SIU = { bArm: [-70, -50], fArm: [70, 50], bLeg: [-28, -18], fLeg: [28, 18] };
const P_PRESENT = { bArm: [-20, -10], fArm: [100, 130], bLeg: [-8, -4], fLeg: [8, 4] }, P_STOMP = { bArm: [-40, -10], fArm: [40, 10], bLeg: [-10, -4], fLeg: [40, 60] }, P_FACEPALM = { bArm: [-20, -10], fArm: [160, 120], bLeg: [-8, -4], fLeg: [8, 4] };
function steam2(x, y, t) { for (const d of [-1, 1]) for (let i = 0; i < 4; i++) { const k = (t * 2 + i / 4) % 1; ell(x + d * (40 + k * 90), y - k * 140, 18 + k * 30, 18 + k * 30, `rgba(255,255,255,${0.85 * (1 - k)})`); } }

// ---------- Episode 9: NO RONALDO, NO PROBLEM? (how it started → how it's going). Real results, parody visuals. ----------
const RED = '#c8102e', GRN = '#046a38', YEL = '#ffd400', BLUE = '#1e3a8a';
const KIT_POR = { shirt: RED, sleeve: RED, cuff: GRN, collar: GRN, shorts: GRN, sock: RED, sockShade: '#9b0c23', sockBand: GRN, boot: '#ffffff', num: '#ffd400' };

const clone = (b, o) => Object.assign({}, CH[b], o, { head: Object.assign({}, CH[b].head, o.head || {}) });
CH.ronP = clone('ronaldo', { kit: KIT_POR, num: '7' });

CH.pk = clone('mate2', Object.assign({ kit: KIT_GK, num: '1', head: { hair: 'short', hairCol: '#111' } }, nm('D. COSTA')));

CH.o1 = clone('mate1', Object.assign({ kit: KIT_POR, num: '' }, nm('CANCELO'))); CH.o2 = clone('mate4', Object.assign({ kit: KIT_POR, num: '' }, nm('RAMOS'))); CH.o3 = clone('mate3', Object.assign({ kit: KIT_POR, num: '', head: { hair: 'short', hairCol: '#2a1a10' } }, nm('VITINHA'))); CH.o4 = clone('mate3', Object.assign({ kit: KIT_POR, num: '', head: { hair: 'curls', hairCol: '#2a1a10' } }, nm('FÉLIX')));
CH.coach = clone('mate2', { kit: KIT_SUIT, num: '', name: '', head: { hair: 'short', hairCol: '#cfcfcf' } });
CH.hoj = clone('mate3', Object.assign({ kit: KIT_DEN, num: '', shoulderW: 96, torsoH: 150, leg: 120, head: { hair: 'short', hairCol: '#b98a4a', R: 104 } }, nm('HØJLUND', 96)));
CH.d1 = clone('mate1', Object.assign({ kit: KIT_DEN, num: '', head: { hair: 'bald' } }, nm('HØJBJERG'))); CH.d2 = clone('mate4', Object.assign({ kit: KIT_DEN, num: '', head: { hair: 'spiky', hairCol: '#e0b060' } }, nm('ANDERSEN')));
CH.d3 = clone('mate1', { kit: KIT_DEN, num: '', name: '', head: { hair: 'curls', hairCol: '#c58b3a' } }); CH.dk = clone('mate2', { kit: Object.assign({}, KIT_GK, { shirt: '#111', sleeve: '#111', sock: '#111', sockShade: '#000', num: '#fff' }), num: '', name: '', head: { hair: 'short', hairCol: '#e0b060' } });
const DR = (k, p, e, x, y, s = 1, o = {}) => chibi.draw(ctx, CH[k], p, e, x, y, s, Object.assign({ f: 1 }, o));
const P_KICK = { bArm: [-70, -40], fArm: [70, 40], bLeg: [-12, -6], fLeg: [80, 85] }, P_ARMS = { bArm: [-120, -140], fArm: [120, 140], bLeg: [-14, -8], fLeg: [14, 8] };
const P_HEAD = { bArm: [-20, -10], fArm: [170, 120], bLeg: [-8, -4], fLeg: [8, 4] }, P_HANDS_HEAD = { bArm: [-160, -100], fArm: [160, 100], bLeg: [-8, -4], fLeg: [8, 4] };
const P_DIVE = { bArm: [-150, -170], fArm: [150, 170], bLeg: [-20, -10], fLeg: [20, 10] }, P_SUIT = { bArm: [60, 120], fArm: [60, 160], bLeg: [-8, -4], fLeg: [8, 4] };

// ---- backgrounds ----
const crowdCache = {};
function makeCrowd(cols, seed) { const c = document.createElement('canvas'); c.width = 1400; c.height = 900; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 900); gr.addColorStop(0, '#0b1230'); gr.addColorStop(1, '#22365e'); g.fillStyle = gr; g.fillRect(0, 0, 1400, 900);
  const R = rng(seed); for (let r = 0; r < 24; r++) for (let x = 0; x < 1400; x += 24 + R() * 10) { g.fillStyle = cols[Math.floor(R() * cols.length)]; g.beginPath(); g.arc(x, 300 + r * 24, 10, 0, TAU); g.fill(); }
  for (const x of [200, 1200]) { const gl = g.createRadialGradient(x, 120, 5, x, 120, 380); gl.addColorStop(0, 'rgba(255,255,230,.9)'); gl.addColorStop(1, 'rgba(255,255,230,0)'); g.fillStyle = gl; g.fillRect(x - 380, 0, 760, 600); }
  const b = document.createElement('canvas'); b.width = 1400; b.height = 900; const bg = b.getContext('2d'); bg.filter = 'blur(6px) saturate(80%)'; bg.drawImage(c, 0, 0); return b; }
function stadium(t, cols = [RED, GRN, '#fff', YEL], seed = 7, clap = 0) {
  const key = cols.join() + seed; if (!crowdCache[key]) crowdCache[key] = makeCrowd(cols, seed); const cy = -100 + (clap ? Math.abs(Math.sin(t * 14)) * 6 : 0); ctx.drawImage(crowdCache[key], -160, cy); ctx.drawImage(crowdCache[key], 1240, cy); ctx.drawImage(crowdCache[key], -1560, cy);
  for (let i = -3; i < 9; i++) rr(i * 220, 780, 216, 80, 4, i % 2 ? '#14532d' : '#7f1d1d', null);
  const g = ctx.createLinearGradient(0, 860, 0, 1920); g.addColorStop(0, '#3a9d4a'); g.addColorStop(1, '#2e8a3d'); ctx.fillStyle = g; ctx.fillRect(-600, 860, 2400, 1300);
  for (let i = -4; i < 10; i++) { ctx.fillStyle = 'rgba(255,255,255,.055)'; ctx.beginPath(); ctx.moveTo(i * 200, 860); ctx.lineTo(i * 200 + 100, 860); ctx.lineTo(i * 320 + 160, 2200); ctx.lineTo(i * 320, 2200); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-200, 960); ctx.lineTo(1300, 960); ctx.stroke(); }
function goalL(x, y, ripple = 0) { // goal on the left, opening to the right
  const h = 330, d = 120, b = ripple * 40; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3;
  for (let i = 0; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(x - d, y - h + i * h / 10); ctx.quadraticCurveTo(x - d / 2 - b, y - h + i * h / 10, x, y - h + i * h / 10); ctx.stroke(); }
  for (let i = 0; i <= 5; i++) { ctx.beginPath(); ctx.moveTo(x - i * d / 5 - (i ? b * 0.5 : 0), y - h); ctx.lineTo(x - i * d / 5 - (i ? b * 0.5 : 0), y); ctx.stroke(); }
  ctx.lineWidth = 18; ctx.strokeStyle = DARK; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - h); ctx.lineTo(x - d, y - h + 30); ctx.stroke(); ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.stroke(); }
function room(t, col1 = '#1e3a5f', col2 = '#274b78') { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, col1); g.addColorStop(1, col2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let i = 0; i < 12; i++) ctx.fillRect(i * 100, 0, 6, 1300); const f = ctx.createLinearGradient(0, 1300, 0, H); f.addColorStop(0, '#5b4636'); f.addColorStop(1, '#3d2f24'); ctx.fillStyle = f; ctx.fillRect(0, 1300, W, 620); }
function scoreBoard(pt, dt, k = 1, bump = -1, y = 330, s = 1) { const b = bump >= 0 && bump < 0.4 ? 1 + 0.5 * (1 - bump / 0.4) : 1;
  pop(k, W / 2, y, () => { ctx.scale(s, s); rr(-330, -80, 660, 160, 30, 'rgba(10,14,30,.94)', '#fff', 6); rr(-310, -60, 150, 120, 20, RED, DARK, 4); txt('POR', -235, 2, 50, '#fff', null); rr(160, -60, 150, 120, 20, '#fff', DARK, 4); txt('DEN', 235, 2, 50, RED, null);
    txt(String(pt), -75, 4, 96, '#fff', null); txt('–', 0, 4, 80, '#fff', null); ctx.save(); ctx.translate(75, 4); ctx.scale(b, b); txt(String(dt), 0, 0, 96, '#fff', null); ctx.restore(); }); }
function chipT(s, x, y, k, bg = '#fff', fg = DARK, size = 44) { pop(eOB(k / 0.2), x, y, () => { ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width + 56; rr(-w / 2, -size * 0.8, w, size * 1.6, size * 0.8, bg, DARK, 5); txt(s, 0, 3, size, fg, null); }); }
function slam(text, k, col = '#fff', fg = RED, y = 600, size = 130) { if (k <= 0 || k > 1.4) return; if (k < 0.08) { ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(0, 0, W, H); }
  const out = k > 1.1 ? clamp((k - 1.1) / 0.3) : 0; pop(eOB(k / 0.12) * (1 - out), W / 2, y, () => { ctx.rotate(-0.06); if (k < 0.6) { ctx.save(); ctx.rotate(k * 0.8); ctx.globalAlpha = 1 - k / 0.6; for (let i = 0; i < 16; i++) { ctx.rotate(TAU / 16); ctx.fillStyle = i % 2 ? col : 'rgba(255,212,0,.8)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(380, -32); ctx.lineTo(380, 32); ctx.fill(); } ctx.restore(); ctx.globalAlpha = 1; }
    ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(text).width + 90; rr(-w / 2, -size * 0.8, w, size * 1.6, 44, col, DARK, 9); txt(text, 0, 4, size, fg, '#fff'); }); }
function newspaper(x, y, s, a, k, stamp = 0) { pop(k, x, y, () => { ctx.rotate(a); ctx.scale(s, s); rr(-330, -230, 660, 460, 10, '#f5f1e6', DARK, 8); txt('THE DAILY BALL', 0, -180, 40, DARK, null); ctx.fillStyle = DARK; ctx.fillRect(-300, -150, 600, 6);
  txt('NO RONALDO,', 0, -80, 70, DARK, null); ctx.save(); txt('NO PROBLEM?', 0, 10, 70, DARK, null); ctx.restore();
