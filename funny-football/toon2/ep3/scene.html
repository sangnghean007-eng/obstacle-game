<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../toon2.js"></script>

<script>
// Episode 3: "RETIRED?!" (Messi's back-to-back MLS Golden Boot after leaving the national team). Episode 2 helpers reused. — Juventus vs Barcelona social-media banter (Oct–Dec 2020).
// Real facts; club posts are paraphrased; original characters, kits without crests or sponsors.
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const F = 'Inter, "DejaVu Sans", sans-serif', DARK = '#1a0f08', TAU = Math.PI * 2;
const lerp = (a, b, k) => a + (b - a) * k, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = k => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }

const JUVE = { shirt: '#ffffff', stripes: '#151515', collar: '#151515', shorts: '#f4f4f4', sock: '#ffffff', sockShade: '#d5d5d5', boot: '#ff5a1f', num: '#ffd21f' };
const BARCA = { shirt: '#a50044', stripes: '#0b4f9c', collar: '#ffd21f', shorts: '#0b4f9c', sock: '#a50044', sockShade: '#7a0033', boot: '#ffd21f', num: '#ffd21f' };
const HOODIE = { shirt: '#6b7280', collar: '#4b5563', shorts: '#374151', sock: '#ffffff', sockShade: '#d1d5db', boot: '#ffffff', num: '#6b7280', number: '', abs: false };
const CR = (pose, expr, x, y, s, kit = JUVE) => toon2.draw(ctx, 'ronaldo', pose, expr, x, y, s, kit);
const LM = (pose, expr, x, y, s, kit = BARCA) => toon2.draw(ctx, 'messi', pose, expr, x, y, s, kit);

function rr(x, y, w, h, r, fill, stroke, lw = 5) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function txt(s, x, y, size, fill = '#fff', stroke = DARK, align = 'center', weight = 900) {
  ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = Math.max(5, size * 0.2); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function pop(k, x, y, fn) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); const s = easeOutBack(clamp(k)); ctx.scale(s, s); fn(); ctx.restore(); }
function topT(s, k, y, size, col = '#fff') { pop(k, W / 2 - 40, y, () => txt(s, 0, 0, size, col, col === '#1a0f08' ? '#fff' : DARK)); }
function burst(x, y, r, s, k, size, fill = '#ffd60a', rot = 0) { pop(k, x, y, () => { ctx.rotate(rot); ctx.beginPath(); for (let i = 0; i < 28; i++) { const a = i / 28 * TAU, rr2 = i % 2 ? r * 0.7 : r; ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2 * 0.72); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = '#c1121f'; ctx.stroke(); txt(s, 0, 2, size, '#c1121f', '#fff'); }); }
// social post card (generic, no platform or club logos)
function post(x, y, w, name, col, lines, k, tag = 'club account · paraphrased') {
  pop(k, x + w / 2, y, () => { ctx.translate(-w / 2, 0); const h = 150 + lines.length * 62;
    rr(0, 0, w, h, 28, '#ffffff', DARK, 6);
    ctx.beginPath(); ctx.arc(70, 70, 40, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = DARK; ctx.stroke(); txt(name[0], 70, 72, 40, '#fff', null);
    txt(name, 130, 56, 40, DARK, null, 'left'); txt(tag, 130, 98, 26, '#6b7280', null, 'left', 700);
    lines.forEach((l, i) => txt(l, 40, 170 + i * 62, 46, DARK, null, 'left', 800)); });
}
function ball(x, y, r, a) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = DARK; ctx.stroke(); ctx.beginPath(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - 1.57; ctx.lineTo(Math.cos(q) * r * .38, Math.sin(q) * r * .38); } ctx.fillStyle = DARK; ctx.fill(); ctx.restore(); }

// ---------- backgrounds ----------
const crowd = []; { const R = rng(4); for (let r = 0; r < 18; r++) for (let x = 0; x < W; x += 15 + R() * 6) crowd.push([x, 560 + r * 24, R(), R()]); }
function stadium(t, home) {
  const g = ctx.createLinearGradient(0, 0, 0, 560); g.addColorStop(0, '#0b1230'); g.addColorStop(1, '#27406f'); ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, 700);
  for (const x of [120, 960]) { const gl = ctx.createRadialGradient(x, 160, 5, x, 160, 260); gl.addColorStop(0, 'rgba(255,255,220,.8)'); gl.addColorStop(1, 'rgba(255,255,220,0)'); ctx.fillStyle = gl; ctx.fillRect(x - 260, -100, 520, 520); }
  ctx.fillStyle = '#20263a'; ctx.fillRect(-100, 540, W + 200, 470);
  const cols = home === 'none' ? ['#75aadb', '#ffffff', '#ffd21f'] : home === 'barca' ? ['#a50044', '#0b4f9c', '#ffd21f'] : ['#ffffff', '#151515', '#ffd21f'];
  for (const [x, y, a, b] of crowd) { ctx.fillStyle = cols[Math.floor(a * 3)]; ctx.fillRect(x, y + Math.sin(t * 8 + b * 9) * 3, 11, 14); }
  ctx.fillStyle = 'rgba(8,12,28,.45)'; ctx.fillRect(-100, 540, W + 200, 470);
  if (home !== 'none') { rr(-20, 990, W + 40, 50, 0, home === 'barca' ? '#0b4f9c' : '#151515'); txt(home === 'barca' ? 'BARCELONA · HOME' : 'TURIN · HOME', W / 2, 1015, 28, '#fff', null); }
  ctx.fillStyle = '#2f8f3c'; ctx.fillRect(-100, 1040, W + 200, H); for (let i = 0; i < 8; i++) { ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(i * 160, 1040, 80, H); }
}
function room(t) {
  ctx.fillStyle = '#e9dcc6'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#dccbb0'; for (let i = 0; i < 12; i++) ctx.fillRect(i * 100, 0, 46, 1300); ctx.fillStyle = '#8a6a48'; ctx.fillRect(0, 1300, W, H);
  // TV showing the score
  rr(90, 420, 560, 340, 18, '#111', DARK, 8); rr(110, 440, 520, 300, 8, '#1f6b3a', null);
  txt('JUV 0 - 2 BAR', 370, 560, 60, '#fff', DARK); txt('LIVE', 560, 470, 28, '#ff4d4d', null);
  rr(330, 760, 80, 60, 6, '#333', DARK, 4);
  rr(700, 360, 300, 110, 14, '#fff7cc', DARK, 5); txt('ISOLATING', 850, 415, 44, '#c1121f', null);
}
function campNouSign() { rr(150, 300, 620, 110, 18, '#0b4f9c', DARK, 6); txt('CAMP NOU', 460, 356, 70, '#ffd21f', null); }

// ---------- props ----------
function dictionary(x, y, k, t) {
  pop(k, x, y, () => { ctx.rotate(-0.06);
    rr(-260, -170, 520, 340, 16, '#7a1f1f', DARK, 7); rr(-240, -150, 230, 300, 6, '#fffaf0', DARK, 4); rr(10, -150, 230, 300, 6, '#fffaf0', DARK, 4);
    txt('GOAT', -125, -100, 52, DARK, null); txt('(n.)', -125, -50, 30, '#6b7280', null, 'center', 700);
    ctx.fillStyle = '#c9c4b5'; for (let i = 0; i < 4; i++) ctx.fillRect(-215, -10 + i * 30, 180 - i * 20, 10);
    txt('see: 7', 125, -80, 56, '#c1121f', null); txt('THE RIGHT', 125, 10, 32, DARK, null); txt('EDITION', 125, 50, 32, DARK, null); });
}
function calendar(x, y, label, flip) { rr(x - 190, y - 170, 380, 340, 24, '#fff', DARK, 7); rr(x - 190, y - 170, 380, 90, 24, '#c1121f', DARK, 7); txt(label[0], x, y - 125, 48, '#fff', null); txt(label[1], x, y + 30, 140, DARK, null);
  if (flip > 0) { ctx.save(); ctx.translate(x, y - 80); ctx.scale(1, Math.cos(flip * Math.PI)); rr(-190, 0, 380, 250, 0, '#f3f3f3', DARK, 5); ctx.restore(); } }
function goal(x, y) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.strokeRect(x, y, 280, 210); ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; for (let i = 1; i < 11; i++) { ctx.beginPath(); ctx.moveTo(x + i * 25, y); ctx.lineTo(x + i * 25, y + 210); ctx.stroke(); } for (let j = 1; j < 8; j++) { ctx.beginPath(); ctx.moveTo(x, y + j * 26); ctx.lineTo(x + 280, y + j * 26); ctx.stroke(); } }
function scoreboard(a, b) { rr(150, 250, 700, 150, 22, 'rgba(10,14,30,.94)', '#ffd60a', 6); txt('BAR', 270, 325, 64, '#fff', null); txt(`${a} - ${b}`, 500, 325, 84, '#ffd60a', null); txt('JUV', 730, 325, 64, '#fff', null); }
function crate(x, y, k, t) { pop(k, x, y, () => { rr(-190, -150, 380, 300, 12, '#c08a4a', DARK, 7); ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-190, -150); ctx.lineTo(190, 150); ctx.moveTo(190, -150); ctx.lineTo(-190, 150); ctx.stroke();
  rr(-150, -60, 300, 110, 10, '#fffaf0', DARK, 5); txt('DELIVERED:', 0, -30, 34, DARK, null); txt('1 GOAT (7)', 0, 18, 46, '#c1121f', null);
  // goat poking out of the top
  const b = Math.sin(t * 9) * 6; ctx.beginPath(); ctx.ellipse(40, -200 + b, 70, 55, 0, 0, TAU); ctx.fillStyle = '#f2efe6'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -250 + b); ctx.quadraticCurveTo(0, -320 + b, -40, -300 + b); ctx.moveTo(60, -250 + b); ctx.quadraticCurveTo(70, -330 + b, 30, -320 + b); ctx.stroke();
  ctx.beginPath(); ctx.arc(70, -210 + b, 7, 0, TAU); ctx.fillStyle = DARK; ctx.fill(); txt('7', 20, -190 + b, 44, '#c1121f', null); }); }

// ---------- motion helpers ----------
const headPos = (x, y, s) => [x + 40 * s, y - 960 * s];
function cam(cx, cy, z, fn, shake = 0, t = 0) { ctx.save(); ctx.translate(W / 2 + Math.sin(t * 91) * shake, H / 2 + Math.cos(t * 77) * shake); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function breathe(x, y, t, amt, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(1 - amt * 0.4 * Math.sin(t * 5), 1 + amt * Math.sin(t * 5)); ctx.translate(-x, -y); fn(); ctx.restore(); }
function lean(x, y, a, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.translate(-x, -y); fn(); ctx.restore(); }
function speedLines(t, n = 40, col = 'rgba(255,255,255,.55)') { const R = rng(Math.floor(t * 30) + 2); ctx.strokeStyle = col; for (let i = 0; i < n; i++) { const a = R() * TAU, r0 = 420 + R() * 300; ctx.lineWidth = 3 + R() * 6; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0); ctx.lineTo(W / 2 + Math.cos(a) * (r0 + 500), H / 2 + Math.sin(a) * (r0 + 500)); ctx.stroke(); } }
function confetti(t, t0, n = 90) { if (t < t0) return; const R = rng(11), k = t - t0; const cols = ['#ffd60a', '#ffffff', '#151515', '#ff4d6d']; for (let i = 0; i < n; i++) { const x = R() * W, vy = 300 + R() * 500, y = -50 + vy * k, sw = Math.sin(k * 6 + i) * 30; if (y > H) continue; ctx.save(); ctx.translate(x + sw, y); ctx.rotate(k * 8 + i); ctx.fillStyle = cols[i % 4]; ctx.fillRect(-8, -4, 16, 8); ctx.restore(); } }
function hearts(t, t0) { if (t < t0) return; const R = rng(5); for (let i = 0; i < 14; i++) { const k = ((t - t0) * 0.7 + R()) % 1, x = 760 + (R() - 0.5) * 260 + Math.sin(k * 9 + i) * 30, y = 1500 - k * 900; ctx.globalAlpha = 1 - k; ctx.font = `900 ${50 + R() * 30}px ${F}`; ctx.fillStyle = i % 3 ? '#ff4d6d' : '#ffd60a'; ctx.textAlign = 'center'; ctx.fillText(i % 3 ? '♥' : '★', x, y); ctx.globalAlpha = 1; } }
function sparkles(x, y, t, r = 160) { for (let i = 0; i < 8; i++) { const a = t * 2 + i * TAU / 8, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r * 0.6, s = 10 + 8 * Math.sin(t * 9 + i); ctx.save(); ctx.translate(px, py); ctx.rotate(t * 3); ctx.beginPath(); for (let j = 0; j < 8; j++) { const rr2 = j % 2 ? s * 0.35 : s; ctx.lineTo(Math.cos(j / 8 * TAU) * rr2, Math.sin(j / 8 * TAU) * rr2); } ctx.fillStyle = '#fff59d'; ctx.fill(); ctx.restore(); } }
function phone(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rr(-300, -520, 600, 1040, 70, '#111', DARK, 8); rr(-270, -480, 540, 960, 40, '#f4f6fb', null); rr(-80, -500, 160, 26, 13, '#000', null); fn(); ctx.restore(); }
function keeper(x, y, dive) { ctx.save(); ctx.translate(x, y); ctx.rotate(dive * -1.2); ctx.translate(dive * -60, 0);
  rr(-70, -330, 140, 220, 50, '#3b4252', DARK, 6); rr(-55, -120, 50, 120, 20, '#2a2f3a', DARK, 5); rr(5, -120, 50, 120, 20, '#2a2f3a', DARK, 5);
  ctx.beginPath(); ctx.arc(0, -400, 66, 0, TAU); ctx.fillStyle = '#d9a37a'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke(); rr(-70, -470, 140, 50, 20, '#3b4252', DARK, 5);
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(d * 120, -330 - dive * 40, 34, 30, 0, 0, TAU); ctx.fillStyle = '#ffd21f'; ctx.fill(); ctx.lineWidth = 5; ctx.stroke(); }
  txt('GK', 0, -250, 40, '#fff', null); ctx.restore(); }
function bulgeGoal(x, y, k) { goal(x, y); if (k > 0) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(x + 140, y + 105, 90 * k, 70 * k, 0, 0, TAU); ctx.stroke(); } }
function goatChar(x, y, s, t, flip) { ctx.save(); ctx.translate(x, y); ctx.scale(s * (flip ? -1 : 1), s); const b = Math.abs(Math.sin(t * 14)) * 20;
  for (const lx of [-50, -20, 30, 55]) { ctx.strokeStyle = DARK; ctx.lineWidth = 16; ctx.beginPath(); ctx.moveTo(lx, 10 - b); ctx.lineTo(lx + Math.sin(t * 20 + lx) * 18, 90); ctx.stroke(); }
  ctx.beginPath(); ctx.ellipse(0, -b, 90, 52, 0, 0, TAU); ctx.fillStyle = '#f2efe6'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke(); txt('7', -10, -b, 54, '#c1121f', null);
  ctx.beginPath(); ctx.ellipse(100, -60 - b, 46, 38, 0.3, 0, TAU); ctx.fillStyle = '#f2efe6'; ctx.fill(); ctx.stroke();
  ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(90, -92 - b); ctx.quadraticCurveTo(70, -150 - b, 30, -140 - b); ctx.moveTo(112, -94 - b); ctx.quadraticCurveTo(114, -160 - b, 72, -158 - b); ctx.stroke();
  ctx.beginPath(); ctx.arc(116, -66 - b, 7, 0, TAU); ctx.fillStyle = DARK; ctx.fill(); ctx.restore(); }

// ---------- scenes ----------
// ---------- visual-storytelling props ----------
function goatHead(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); ctx.ellipse(0, 0, 46, 38, 0.2, 0, TAU); ctx.fillStyle = '#f2efe6'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(-10, -30); ctx.quadraticCurveTo(-30, -90, -70, -80); ctx.moveTo(14, -32); ctx.quadraticCurveTo(16, -100, -24, -98); ctx.stroke();
  ctx.beginPath(); ctx.arc(14, -6, 7, 0, TAU); ctx.fillStyle = DARK; ctx.fill(); ctx.beginPath(); ctx.moveTo(-6, 30); ctx.lineTo(4, 70); ctx.lineTo(14, 30); ctx.fillStyle = '#d8d2c2'; ctx.fill(); ctx.restore(); }
function flag(x, y, num, col, col2, k = 1, rot = 0) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  ctx.fillStyle = '#5b4632'; ctx.fillRect(-7, -560, 14, 560); ctx.lineWidth = 4; ctx.strokeStyle = DARK; ctx.strokeRect(-7, -560, 14, 560);
  const w = Math.sin(T2T * 6) * 14; ctx.beginPath(); ctx.moveTo(7, -560); ctx.quadraticCurveTo(140, -590 + w, 300, -560); ctx.lineTo(300, -360); ctx.quadraticCurveTo(140, -390 - w, 7, -360); ctx.closePath();
  ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 6; ctx.stroke(); if (col2) { ctx.save(); ctx.clip(); ctx.fillStyle = col2; for (let i = 0; i < 6; i++) ctx.fillRect(20 + i * 52, -600, 26, 260); ctx.restore(); }
  goatHead(100, -460, 0.9); txt(num, 230, -460, 90, '#ffd21f', DARK); ctx.restore(); }
function crown(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); ctx.moveTo(-90, 0); ctx.lineTo(-90, -60); ctx.lineTo(-45, -20); ctx.lineTo(0, -80); ctx.lineTo(45, -20); ctx.lineTo(90, -60); ctx.lineTo(90, 0); ctx.closePath(); ctx.fillStyle = '#ffd21f'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-60, -40); ctx.quadraticCurveTo(-110, -150, -160, -120); ctx.moveTo(60, -40); ctx.quadraticCurveTo(110, -150, 160, -120); ctx.strokeStyle = '#d8d2c2'; ctx.stroke(); ctx.restore(); }
function plane(x, y, a, s) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s); ctx.beginPath(); ctx.ellipse(0, 0, 150, 34, 0, 0, TAU); ctx.fillStyle = '#e5e7eb'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(-70, 110); ctx.lineTo(10, 110); ctx.lineTo(40, 0); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-130, -10); ctx.lineTo(-160, -80); ctx.lineTo(-110, -20); ctx.fill(); ctx.stroke(); ctx.restore(); }
function thermometer(x, y, a) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); rr(-8, -90, 16, 110, 8, '#fff', DARK, 4); ctx.fillStyle = '#e11d2a'; ctx.fillRect(-4, -40, 8, 55); ctx.beginPath(); ctx.arc(0, 20, 13, 0, TAU); ctx.fill(); ctx.lineWidth = 4; ctx.stroke(); ctx.restore(); }


// ---------- Episode 3 kits & props ----------
const ARG = { shirt: '#ffffff', stripes: '#75aadb', collar: '#1b2a4a', shorts: '#1b1b1b', sock: '#ffffff', sockShade: '#cfd8e3', boot: '#ffd21f', num: '#1b2a4a' };
const PINK = { stripes: null, shirt: '#f7a8c4', collar: '#111111', shorts: '#111111', sock: '#f7a8c4', sockShade: '#d985a3', boot: '#ffd21f', num: '#111111' };
function beach(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 1000); g.addColorStop(0, '#4fc3ff'); g.addColorStop(1, '#c7ecff'); ctx.fillStyle = g; ctx.fillRect(-1500, -800, 4200, 1800);
  ctx.beginPath(); ctx.arc(900, 260, 110, 0, TAU); ctx.fillStyle = '#ffe066'; ctx.fill(); ctx.beginPath(); ctx.arc(900, 260, 150, 0, TAU); ctx.fillStyle = 'rgba(255,224,102,.25)'; ctx.fill();
  for (const [cx, cy, s] of [[200, 330, 1], [640, 200, .8], [1300, 380, 1.1]]) { const x = cx + Math.sin(t * .3) * 30; ctx.fillStyle = '#fff'; for (const [dx, dy, r] of [[0, 0, 50], [50, -20, 60], [100, 0, 50], [50, 20, 50]]) { ctx.beginPath(); ctx.arc(x + dx * s, cy + dy * s, r * s, 0, TAU); ctx.fill(); } }
  for (let i = 0; i < 2; i++) { const x = ((t * 120 + i * 700) % 2400) - 600, y = 450 + i * 90 + Math.sin(t * 3 + i) * 20, f = Math.sin(t * 12 + i) * 18; ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x - 30, y - f); ctx.quadraticCurveTo(x - 14, y - 16, x, y); ctx.quadraticCurveTo(x + 14, y - 16, x + 30, y - f); ctx.stroke(); }
  ctx.fillStyle = '#1f8ad6'; ctx.fillRect(-1500, 980, 4200, 210); ctx.fillStyle = '#3aa6ec'; ctx.fillRect(-1500, 980, 4200, 40);
  for (let i = -12; i < 26; i++) { ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(i * 100 + Math.sin(t * 2 + i) * 20, 1030 + ((i + 12) % 3) * 50, 30, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(-1500, 1190); for (let x = -1500; x <= 2700; x += 60) ctx.lineTo(x, 1180 + Math.sin(x * .02 + t * 2.5) * 10); ctx.lineTo(2700, 1215); ctx.lineTo(-1500, 1215); ctx.fill();
  ctx.fillStyle = '#f3d9a4'; ctx.fillRect(-1500, 1200, 4200, 1800); ctx.fillStyle = 'rgba(200,160,100,.35)'; const R = rng(9); for (let i = 0; i < 160; i++) { ctx.beginPath(); ctx.arc(-1200 + R() * 3600, 1230 + R() * 900, 3 + R() * 4, 0, TAU); ctx.fill(); }
  palm(60, 1260, t);
