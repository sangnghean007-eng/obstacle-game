// the narrator: a cartoon World Cup with eyes, mouth, little legs
function cup(x, y, s, t, o = {}) { ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.f || 1), s); const hop = o.walk ? Math.abs(Math.sin(t * 12)) * 12 : 0; ctx.translate(0, -hop);
