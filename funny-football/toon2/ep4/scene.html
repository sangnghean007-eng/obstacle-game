<!doctype html>
<html><head><meta charset="utf-8"><title>Can't Move Him</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../chibi.js"></script>
<script src="../chibi_cast.js"></script>
<script>
// Episode 4 v3 "IMMOVABLE": one gag, three escalations, a topper, loop. Inspired by Chelsea 3-2 West Ham (Jan 31, 2026). Parody.
const W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
const F = 'Inter, "DejaVu Sans", sans-serif', DARK = '#1a0f08', TAU = Math.PI * 2;
const lerp = (a, b, k) => a + (b - a) * k, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = k => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2), easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const eOB = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
function rr(x, y, w, h, r, fill, stroke, lw = 5) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function txt(s, x, y, size, fill = '#fff', stroke = DARK, align = 'center', weight = 900) { ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; if (stroke) { ctx.lineWidth = Math.max(6, size * 0.22); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); } ctx.fillStyle = fill; ctx.fillText(s, x, y); }
function pop(k, x, y, fn) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); const s = eOB(k); ctx.scale(s, s); fn(); ctx.restore(); }
function camK(keys, u) { let i = 0; while (i < keys.length - 1 && u > keys[i + 1][0]) i++; const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)]; const k = b[0] > a[0] ? easeIO((u - a[0]) / (b[0] - a[0])) : 0; return [1, 2, 3, 4].map(j => lerp(a[j] || 0, b[j] || 0, k)); }
function cam(C, fn, shake = 0, t = 0) { ctx.save(); ctx.translate(W / 2 + Math.sin(t * 91) * shake, H / 2 + Math.cos(t * 77) * shake); ctx.rotate(C[3] || 0); ctx.scale(C[2], C[2]); ctx.translate(-C[0], -C[1]); fn(); ctx.restore(); }
function burst(x, y, r, s, k, size, fill = '#ffd60a', rot = 0) { pop(k, x, y, () => { ctx.rotate(rot); ctx.beginPath(); for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, q = i % 2 ? r * 0.68 : r; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q * 0.75); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = DARK; ctx.stroke(); if (s) txt(s, 0, 2, size, '#c1121f', '#fff'); }); }
function ell(x, y, rx, ry, fill, lw = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = DARK; ctx.stroke(); } }
const TR = (p, e, x, y, s, o = {}) => chibi.draw(ctx, CH.traore, p, e, x, y, s, Object.assign({ f: -1 }, o));
const CU = (p, e, x, y, s, o = {}) => chibi.draw(ctx, CH.cucu, p, e, x, y, s, Object.assign({ f: 1 }, o));

// ---------- world ----------
const GY = 1500, TX = 640, TS = 1.6, CS = 1.38;
let crowdCanvas = null;
function makeCrowd() { const c = document.createElement('canvas'); c.width = 2600; c.height = 900; const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 900); gr.addColorStop(0, '#0e1838'); gr.addColorStop(1, '#2b4677'); g.fillStyle = gr; g.fillRect(0, 0, 2600, 900);
  const R = rng(7), cols = ['#034694', '#ffffff', '#7a263a', '#8fd0f0', '#ffd60a']; for (let r = 0; r < 26; r++) for (let x = 0; x < 2600; x += 26 + R() * 10) { g.fillStyle = cols[Math.floor(R() * cols.length)]; g.beginPath(); g.arc(x, 260 + r * 24, 10, 0, TAU); g.fill(); }
  for (const x of [300, 2200]) { const gl = g.createRadialGradient(x, 120, 5, x, 120, 380); gl.addColorStop(0, 'rgba(255,255,230,.9)'); gl.addColorStop(1, 'rgba(255,255,230,0)'); g.fillStyle = gl; g.fillRect(x - 380, 0, 760, 600); }
  const b = document.createElement('canvas'); b.width = 2600; b.height = 900; const bg = b.getContext('2d'); bg.filter = 'blur(7px) saturate(70%)'; bg.drawImage(c, 0, 0); return b; }
function world(t) {
  if (!crowdCanvas) crowdCanvas = makeCrowd();
  ctx.drawImage(crowdCanvas, -800, -100);
  for (let i = -3; i < 8; i++) rr(i * 300, 780, 296, 90, 4, i % 2 ? '#1e3a8a' : '#7a263a', null);
  const g = ctx.createLinearGradient(0, 870, 0, 2400); g.addColorStop(0, '#3a9d4a'); g.addColorStop(1, '#2e8a3d'); ctx.fillStyle = g; ctx.fillRect(-900, 870, 3000, 1800);
  for (let i = -6; i < 14; i++) { ctx.fillStyle = 'rgba(255,255,255,.055)'; ctx.beginPath(); ctx.moveTo(i * 200, 870); ctx.lineTo(i * 200 + 100, 870); ctx.lineTo(i * 320 + 160, 2600); ctx.lineTo(i * 320, 2600); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-900, 1000); ctx.lineTo(1000, 1000); ctx.lineTo(1250, 2600); ctx.stroke(); ctx.beginPath(); ctx.ellipse(1000, 1000, 90, 50, 0, Math.PI * 0.5, Math.PI); ctx.stroke();
}
function cornerFlag(x, y, t, bend = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(bend); ctx.fillStyle = '#f5f5f5'; ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.beginPath(); ctx.roundRect(-8, -460, 16, 460, 6); ctx.fill(); ctx.stroke();
  const w = Math.sin(t * 7) * 14; ctx.beginPath(); ctx.moveTo(8, -460); ctx.quadraticCurveTo(70, -475 + w, 140, -450); ctx.lineTo(140, -360); ctx.quadraticCurveTo(70, -385 - w, 8, -370); ctx.closePath(); ctx.fillStyle = '#ffd60a'; ctx.fill(); ctx.lineWidth = 6; ctx.stroke(); ctx.restore(); }
function ball(x, y, r = 34, a = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ell(0, 0, r, r, '#fff', 6); ctx.beginPath(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - 1.57; ctx.lineTo(Math.cos(q) * r * .4, Math.sin(q) * r * .4); } ctx.fillStyle = DARK; ctx.fill(); ctx.restore(); }
function shadow(x, w, k = 1) { ctx.fillStyle = `rgba(0,0,0,${0.22 * k})`; ctx.beginPath(); ctx.ellipse(x, GY + 6, w, w * 0.15, 0, 0, TAU); ctx.fill(); }
function puff(x, y, k, n = 8, R0 = 160, col = '235,225,200') { if (k <= 0 || k >= 1) return; for (let i = 0; i < n; i++) { const a = Math.PI + i / (n - 1) * Math.PI, d = R0 * easeOut(k); ell(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.45, 46 * (1 - k * 0.6), 40 * (1 - k * 0.6), `rgba(${col},${0.95 * (1 - k)})`); } }
function stars(x, y, t, r = 120) { for (let i = 0; i < 4; i++) { const a = t * 7 + i * TAU / 4; ctx.save(); ctx.translate(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.3); ctx.rotate(t * 5); ctx.beginPath(); for (let j = 0; j < 10; j++) { const q = j % 2 ? 11 : 28; ctx.lineTo(Math.cos(j / 10 * TAU - 1.57) * q, Math.sin(j / 10 * TAU - 1.57) * q); } ctx.closePath(); ctx.fillStyle = '#ffe14d'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke(); ctx.restore(); } }
function speed(x, y, dir, t, n = 8, len = 300) { const R = rng(Math.floor(t * 30) + 3); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineCap = 'round'; for (let i = 0; i < n; i++) { const yy = y + (R() - 0.5) * 500; ctx.lineWidth = 6 + R() * 6; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x - dir * (len + R() * 200), yy); ctx.stroke(); } }
function badge(n, k, x = W / 2) { pop(k, x, 290, () => { ell(0, 0, 80, 80, '#ffd60a', 8); txt(String(n), 0, 6, 96, DARK, null); }); }
function flash(k) { if (k > 0 && k < 1) { ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - k)})`; ctx.fillRect(0, 0, W, H); } }
const juice = (x, y) => { rr(x - 30, y - 70, 60, 90, 8, '#ff8fab', DARK, 6); rr(x - 30, y - 40, 60, 30, 0, '#fff', null); ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x + 8, y - 70); ctx.lineTo(x + 30, y - 140); ctx.lineTo(x + 70, y - 150); ctx.stroke(); };
const phone = (x, y) => { rr(x - 34, y - 110, 68, 120, 14, '#111', DARK, 6); const g = ctx.createLinearGradient(0, y - 100, 0, y); g.addColorStop(0, '#7fd3ff'); g.addColorStop(1, '#c084fc'); rr(x - 26, y - 100, 52, 100, 8, g, null); };
function bulldozer(x, y, s, crumple, t) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const c = 1 - crumple * 0.45;
  ctx.save(); ctx.translate(260, 0); ctx.scale(c, 1); ctx.translate(-260, 0);
  for (const wx of [-170, 60]) { ell(wx, -50, 70, 70, '#2b2b2b', 7); ell(wx, -50, 28, 28, '#9ca3af', 5); }
  rr(-260, -280, 520, 200, 26, '#ffc300', DARK, 8); rr(-230, -260, 180, 60, 10, 'rgba(255,255,255,.35)', null);
  if (crumple > 0) { ctx.strokeStyle = DARK; ctx.lineWidth = 6; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-200 + i * 80, -280); ctx.lineTo(-170 + i * 80, -180); ctx.lineTo(-200 + i * 80, -90); ctx.stroke(); } }
  ctx.restore();
  rr(260 * c - 40, -330, 90, 320, 14, '#9ca3af', DARK, 8); ctx.fillStyle = '#7a8088'; for (let i = 0; i < 4; i++) ctx.fillRect(260 * c - 30, -300 + i * 80, 70, 10);
  ctx.strokeStyle = DARK; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-120 * c, -280); ctx.lineTo(-120 * c, -470); ctx.stroke(); ctx.fillStyle = '#034694'; ctx.beginPath(); ctx.moveTo(-120 * c, -470); ctx.lineTo(-20 * c, -440 + Math.sin(t * 12) * 10); ctx.lineTo(-120 * c, -410); ctx.fill(); ctx.stroke();
  ctx.restore(); }
const notes = (x, y, t) => { for (let i = 0; i < 3; i++) { const k = (t * 0.9 + i / 3) % 1; ctx.globalAlpha = 1 - k; txt('♪', x + k * 80 + Math.sin(k * 9) * 20, y - k * 220, 60, '#fff', DARK); } ctx.globalAlpha = 1; };

// ---------- v4 HUD + props ----------
const MATES = ['mate1', 'mate2', 'mate3', 'mate4'];
const MT = (k, p, e, x, y, s, o = {}) => chibi.draw(ctx, CH[k], p, e, x, y, s, Object.assign({ f: 1 }, o));
function heart(x, y, r, full, broken, k = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(k, k); ctx.beginPath(); ctx.moveTo(0, r * 0.35); ctx.bezierCurveTo(-r * 1.3, -r * 0.5, -r * 0.45, -r * 1.25, 0, -r * 0.45); ctx.bezierCurveTo(r * 0.45, -r * 1.25, r * 1.3, -r * 0.5, 0, r * 0.35); ctx.closePath(); ctx.fillStyle = full ? '#ff3b5c' : '#4b5563'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke(); if (broken) { ctx.strokeStyle = DARK; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -r * 0.45); ctx.lineTo(-r * 0.15, -r * 0.1); ctx.lineTo(r * 0.12, r * 0.05); ctx.lineTo(0, r * 0.3); ctx.stroke(); } if (full) ell(-r * 0.35, -r * 0.45, r * 0.18, r * 0.12, 'rgba(255,255,255,.6)'); ctx.restore(); }
let LIVES = 5, LOST_AT = -9;
function hud(lives, lostAt, t) { ctx.save(); ctx.translate(60, 150); ctx.scale(1.3, 1.3); ctx.translate(-60, -150); rr(60, 150, 470, 96, 48, 'rgba(10,14,30,.85)', null); txt('CUCURELLA', 175, 199, 26, '#8fb8ff', null); for (let i = 0; i < 5; i++) { const full = i < lives, just = i === lives && t - lostAt < 0.5; heart(290 + i * 50, 205, 26, full || just, !full, just ? 1 + Math.sin((t - lostAt) * 30) * 0.15 : 1); } ctx.restore(); }
function label(s, k, col = '#ffd60a') { pop(k, W / 2, 380, () => { ctx.rotate(-0.04); txt(s, 0, 0, 96, col); }); }
function chip(x, y, s, col) { ctx.font = `900 40px ${F}`; const w = ctx.measureText(s).width + 50; rr(x - w / 2, y - 34, w, 68, 34, col, DARK, 6); txt(s, x, y + 2, 40, '#fff', null); ctx.beginPath(); ctx.moveTo(x - 14, y + 34); ctx.lineTo(x + 14, y + 34); ctx.lineTo(x, y + 56); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); }
const feather = (x, y) => { ctx.save(); ctx.translate(x, y); ctx.rotate(-1.0 + Math.sin((window.T2T || 0) * 25) * 0.3); ctx.beginPath(); ctx.ellipse(0, -110, 40, 120, 0, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -220); ctx.stroke(); for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, -40 - i * 30); ctx.lineTo(i % 2 ? 30 : -30, -60 - i * 30); ctx.lineWidth = 3; ctx.stroke(); } ctx.restore(); };
const signProp = (x, y) => { ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-8, -60, 16, 120); ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.strokeRect(-8, -60, 16, 120); rr(-40, -170, 340, 120, 14, '#fff7cc', DARK, 7); txt('FREE JUICE →', 130, -108, 42, '#c1121f', null); ctx.restore(); };

// ---------- scenes ----------
function base(t, opts = {}) { world(t); cornerFlag(900, GY, t); shadow(TX, 230); }
function trBall() { ball(470, GY - 34); }
function s_hook(u) { // 0: BOING
  const C = camK([[0, 500, 1190, 1.3, -0.03], [0.5, 480, 1200, 1.2, 0.02], [1.8, 480, 1210, 1.18, 0]], u);
  cam(C, () => {
    base(u); const jig = u < 0.3 ? Math.sin(u * 60) * 0.015 * (1 - u / 0.3) : 0;
    TR('shield', u < 0.6 ? 'bored' : 'smug', TX, GY, TS, { sq: jig }); trBall();
    if (u < 0.35) { const y = lerp(GY - 120, GY - 40, easeIO(u / 0.35)); CU('flail', 'shock', 395, y, CS, { sq: -0.42, lean: 0.08 }); }
    else { const k = clamp((u - 0.35) / 0.35), x = lerp(395, 230, easeOut(k)), y = GY + 10 - Math.sin(k * Math.PI) * 120; CU('flail', 'dizzy', x, y, CS, { lean: lerp(0.1, -1.45, easeOut(k)), sq: u > 0.7 && u < 0.85 ? 0.2 : 0 }); if (u > 0.7) { puff(230, GY, (u - 0.7) / 0.45); stars(120, GY - 120, u, 100); } }
    if (u > 0.9) chip(170, 1180, 'CUCURELLA', '#034694');
  }, u < 0.2 || (u > 0.7 && u < 0.8) ? 18 : 0, u);
  if (u < 0.45) burst(330, 900, 150, 'BOING!', 1, 70, '#ffd60a', -0.12);
  pop(1, W / 2, 215, () => txt("CAN'T MOVE HIM 💪", 0, 0, 92, '#ffd60a'));
}
function s_mission(u) { // premise card
  const C = camK([[0, 520, 1200, 1.12, 0], [2.0, 520, 1200, 1.18, 0]], u);
  cam(C, () => { base(u + 1); TR('sip', 'sip', TX, GY, TS, { prop: { hand: 'f', draw: juice } }); trBall();
    const x = lerp(-200, 280, easeOut(clamp(u / 0.6))); CU(u < 0.6 ? (Math.floor(u * 12) % 2 ? 'run1' : 'run2') : 'stand', 'angry', x, GY, CS);
    // dotted arrow to the ball
    if (u > 0.6) { ctx.setLineDash([22, 18]); ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(x + 100, GY - 300); ctx.quadraticCurveTo(420, GY - 420, 465, GY - 90); ctx.stroke(); ctx.setLineDash([]); }
  }, 0, u);
  pop(eOB((u - 0.15) / 0.25), W / 2, 420, () => { ctx.rotate(-0.03); rr(-430, -78, 860, 156, 26, '#ffd60a', DARK, 8); txt('MISSION: STEAL THE BALL ⚽', 0, 3, 54, DARK, null); });
  pop(eOB((u - 0.5) / 0.2), W / 2, 540, () => { rr(-360, -34, 720, 68, 34, 'rgba(10,14,30,.85)', null); txt('Real match: Chelsea 3-2 West Ham, 2026', 0, 2, 32, '#fff', null); });
  if (u > 0.8) hud(5, -9, u);
}
function s_push(u, lives) { // ① push; he sips
  const C = camK([[0, 460, 1200, 1.2, 0], [2.4, 440, 1200, 1.3, 0.02]], u);
  cam(C, () => {
    base(u + 2); TR('sip', 'sip', TX, GY, TS, { prop: { hand: 'f', draw: juice } }); trBall();
    const ph = Math.floor(u * 22) % 2, x = 290 - Math.min(30, u * 20), fail = u > 1.9;
    if (!fail) { CU(chibi.mix('push', ph ? { bArm: [80, 95], fArm: [70, 88], bLeg: [-55, -10], fLeg: [10, 60] } : { bArm: [80, 95], fArm: [70, 88], bLeg: [10, 60], fLeg: [-55, -10] }, 1), 'strain', x, GY, CS, { lean: 0.3 + Math.sin(u * 30) * 0.02 }); puff(x - 100, GY, (u * 3) % 1, 5, 90); }
    else { const k = clamp((u - 1.9) / 0.3); CU('flail', 'shock', x - 120 * k, GY, CS, { lean: -1.2 * easeOut(k) }); puff(x - 120, GY, k); }
  }, u > 1.9 && u < 2.05 ? 10 : 0, u);
  hud(u > 1.9 ? 4 : 5, 1.9, u); label('① PUSH!', u / 0.2);
}
function s_tickle(u) { // ② tickle; he scrolls
  const C = camK([[0, 470, 1180, 1.22, 0], [2.4, 480, 1170, 1.3, -0.02]], u);
  cam(C, () => {
    base(u + 4); TR('phone', 'phone', TX, GY, TS, { prop: { hand: 'f', draw: phone } }); trBall();
    const laugh = u > 1.5; CU(laugh ? 'flail' : { bArm: [-20, -10], fArm: [100, 60], bLeg: [-8, -4], fLeg: [8, 4] }, laugh ? 'happy' : 'grin', 330, GY, CS, { lean: laugh ? -0.4 - (u - 1.5) * 0.8 : 0.1, prop: laugh ? null : { hand: 'f', draw: feather } });
    if (laugh) txt('HAHA', 160, 950, 60, '#fff', DARK);
  }, 0, u);
  hud(u > 1.9 ? 3 : 4, 1.9, u); label('② TICKLE!', u / 0.2);
  if (u > 0.8 && u < 1.6) txt('…', 790, 760, 90, '#fff', DARK);
}
function s_decoy(u) { // ③ decoy sign; he pulls a second juice from his sock
  const C = camK([[0, 470, 1190, 1.2, 0], [2.4, 470, 1190, 1.26, 0.02]], u);
  cam(C, () => {
    base(u + 6);
    const look = u > 0.5 && u < 1.2, juiced = u > 1.2;
    TR(juiced ? 'sip' : 'shield', look ? { lid: 0, mouth: 'o', look: [-1, 0], brow: 0.6 } : juiced ? 'smug' : 'bored', TX, GY, TS, { prop: juiced ? { hand: 'f', draw: juice } : null }); trBall();
    if (u > 1.0 && u < 1.25) { const k = (u - 1.0) / 0.25; juice(lerp(560, 430, k), lerp(GY - 120, 900, k)); }
    CU(u > 1.6 ? 'stand' : { bArm: [-20, -10], fArm: [100, 125], bLeg: [-8, -4], fLeg: [8, 4] }, u > 1.6 ? 'sad' : 'smile', 260, GY, CS, { prop: u > 1.6 ? null : { hand: 'f', draw: signProp } });
    if (u > 1.6) txt('😑', 260, 830, 80, '#fff', null);
  }, 0, u);
  hud(u > 1.9 ? 2 : 3, 1.9, u); label('③ DECOY!', u / 0.2);
}
function s_dozer(u) { // ④ bulldozer
  const hit = 1.0;
  const C = camK([[0, 150, 1180, 0.95, 0], [hit, 280, 1180, 0.98, 0], [1.4, 320, 1180, 1.02, 0.02], [2.6, 360, 1190, 1.08, 0]], u);
  cam(C, () => {
    base(u + 8); TR('shield', u > hit + 0.2 ? 'yawn' : 'bored', TX, GY, TS, { sq: u > hit && u < hit + 0.15 ? 0.02 : 0 }); trBall();
    const x = u < hit ? lerp(-700, 200, easeIO(u / hit)) : 200, cr = u < hit ? 0 : easeOut((u - hit) / 0.2);
    if (u < hit + 0.3) CU('stand', u < hit ? 'angry' : 'shock', x - 200, GY - 400, 1.05, { lean: u < hit ? 0.1 : 0 });
    bulldozer(x - 260, GY, 1.5, cr, u);
    if (u < hit) { speed(x - 700, 1250, 1, u); puff(x - 700, GY, (u * 3) % 1, 6, 140, '120,120,120'); }
    if (u > hit) { for (let i = 0; i < 6; i++) { const k = clamp((u - hit) / 1.2), a = -2.6 + i * 0.35; ell(x - 100 + Math.cos(a) * 600 * k, GY - 250 + Math.sin(a) * 500 * k + 900 * k * k, 18, 18, i % 2 ? '#ffc300' : '#9ca3af', 5); } puff(x - 60, GY - 100, (u - hit) / 0.8, 10, 260, '90,90,90');
      if (u > hit + 0.3) { const k = clamp((u - hit - 0.3) / 0.3); CU('flail', 'dizzy', x - 200, lerp(GY - 400, GY - 420, k), 1.05); stars(x - 200, GY - 420 - 560 * 1.05, u, 90); } }
  }, u > hit && u < hit + 0.3 ? 22 : 0, u);
  if (u > hit && u < hit + 0.6) burst(380, 900, 170, 'CRASH!', (u - hit) / 0.06, 70, '#ffd60a', 0.08);
  if (u > hit) flash((u - hit) / 0.15);
