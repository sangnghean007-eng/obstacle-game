<!doctype html>
<html><head><meta charset="utf-8"><title>Road to 1000</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../chibi.js"></script>
<script src="../chibi_cast.js"></script>
<script>

const W = 1080, H = 1920, ctx = document.getElementById('c').getContext('2d');
const F = 'Inter, "DejaVu Sans", sans-serif', DARK = '#1a0f08', TAU = Math.PI * 2;
const lerp = (a, b, k) => a + (b - a) * k, clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeIO = k => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2), easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const eOB = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
function rr(x, y, w, h, r, fill, stroke, lw = 5) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function txt(s, x, y, size, fill = '#fff', stroke = DARK, align = 'center', weight = 900) { ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; if (stroke) { ctx.lineWidth = Math.max(6, size * 0.22); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); } ctx.fillStyle = fill; ctx.fillText(s, x, y); }
function pop(k, x, y, fn) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); const s = eOB(k); ctx.scale(s, s); fn(); ctx.restore(); }
function camK(keys, u) { let i = 0; while (i < keys.length - 1 && u > keys[i + 1][0]) i++; const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)]; const k = b[0] > a[0] ? easeIO((u - a[0]) / (b[0] - a[0])) : 0; return [1, 2, 3, 4].map(j => lerp(a[j] || 0, b[j] || 0, k)); }
function cam(C, fn, shake = 0, t = 0) { ctx.save(); ctx.translate(W / 2 + Math.sin(t * 91) * shake, H / 2 + Math.cos(t * 77) * shake); ctx.rotate(C[3] || 0); ctx.scale(C[2], C[2]); ctx.translate(-C[0], -C[1]); fn(); ctx.restore(); }
function burst(x, y, r, s, k, size, fill = '#ffd60a', rot = 0) { pop(k, x, y, () => { ctx.rotate(rot); ctx.beginPath(); for (let i = 0; i < 24; i++) { const a = i / 24 * TAU, q = i % 2 ? r * 0.68 : r; ctx.lineTo(Math.cos(a) * q, Math.sin(a) * q * 0.75); } ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = DARK; ctx.stroke(); if (s) txt(s, 0, 2, size, '#c1121f', '#fff'); }); }
function ell(x, y, rx, ry, fill, lw = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = DARK; ctx.stroke(); } }
function puff(x, y, k, n = 8, R0 = 160, col = '235,225,200') { if (k <= 0 || k >= 1) return; for (let i = 0; i < n; i++) { const a = Math.PI + i / (n - 1) * Math.PI, d = R0 * easeOut(k); ell(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.45, 46 * (1 - k * 0.6), 40 * (1 - k * 0.6), `rgba(${col},${0.95 * (1 - k)})`); } }
function stars(x, y, t, r = 120) { for (let i = 0; i < 4; i++) { const a = t * 7 + i * TAU / 4; ctx.save(); ctx.translate(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.3); ctx.rotate(t * 5); ctx.beginPath(); for (let j = 0; j < 10; j++) { const q = j % 2 ? 11 : 28; ctx.lineTo(Math.cos(j / 10 * TAU - 1.57) * q, Math.sin(j / 10 * TAU - 1.57) * q); } ctx.closePath(); ctx.fillStyle = '#ffe14d'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke(); ctx.restore(); } }
function speed(x, y, dir, t, n = 8, len = 300) { const R = rng(Math.floor(t * 30) + 3); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineCap = 'round'; for (let i = 0; i < n; i++) { const yy = y + (R() - 0.5) * 500; ctx.lineWidth = 6 + R() * 6; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x - dir * (len + R() * 200), yy); ctx.stroke(); } }
function badge(n, k, x = W / 2) { pop(k, x, 290, () => { ell(0, 0, 80, 80, '#ffd60a', 8); txt(String(n), 0, 6, 96, DARK, null); }); }
function flash(k) { if (k > 0 && k < 1) { ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - k)})`; ctx.fillRect(0, 0, W, H); } }
const juice = (x, y) => { rr(x - 30, y - 70, 60, 90, 8, '#ff8fab', DARK, 6); rr(x - 30, y - 40, 60, 30, 0, '#fff', null); ctx.strokeStyle = '#ffd60a'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x + 8, y - 70); ctx.lineTo(x + 30, y - 140); ctx.lineTo(x + 70, y - 150); ctx.stroke(); };
function goatJudge(x, y, s, t, o = {}) { // o: chew (0..1), eyes ('normal'|'spin'), gavel angle, burp
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // robe
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.moveTo(-170, 260); ctx.quadraticCurveTo(-150, 60, 0, 40); ctx.quadraticCurveTo(150, 60, 170, 260); ctx.closePath(); ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = DARK; ctx.stroke(); rr(-30, 50, 60, 60, 10, '#fff', DARK, 4);

  // ears
  for (const d of [-1, 1]) { ctx.save(); ctx.translate(d * 120, -90); ctx.rotate(d * (0.5 + Math.sin(t * 3) * 0.08)); ell(d * 40, 0, 70, 28, '#f2ece0', 6); ell(d * 40, 0, 45, 14, '#f4b8b8', 0); ctx.restore(); }
  // head
  ctx.beginPath(); ctx.moveTo(-110, -120); ctx.quadraticCurveTo(-120, -210, 0, -215); ctx.quadraticCurveTo(120, -210, 110, -120); ctx.quadraticCurveTo(100, 10, 60, 50); ctx.quadraticCurveTo(0, 80, -60, 50); ctx.quadraticCurveTo(-100, 10, -110, -120); ctx.closePath(); ctx.fillStyle = '#efe2c8'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.save(); ctx.clip(); ell(0, -150, 70, 55, '#c9a46a'); ctx.restore();
  // judge wig
  for (let i = 0; i < 7; i++) ell(-90 + i * 30, -200 + Math.abs(i - 3) * 6, 26, 24, '#ffffff', 5); for (const d of [-1, 1]) for (let j = 0; j < 3; j++) ell(d * 125, -140 + j * 40, 24, 22, '#ffffff', 5);
  // big curved horns poking up through the wig
  ctx.lineCap = 'round'; for (const [w, col] of [[34, DARK], [22, '#a8875a']]) { ctx.lineWidth = w; ctx.strokeStyle = col; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 45, -195); ctx.bezierCurveTo(d * 70, -330, d * 190, -330, d * 200, -230); ctx.stroke(); } } ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4; for (const d of [-1, 1]) for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(d * (80 + i * 30), -290 + i * 10, 12, 0, Math.PI); ctx.stroke(); }
  // eyes (goat pupils)
  for (const d of [-1, 1]) { ell(d * 48, -95, 30, 26, '#fff7d6', 6); if (o.eyes === 'spin') { ctx.save(); ctx.translate(d * 48, -95); ctx.rotate(t * 12 * d); rr(-16, -5, 32, 10, 5, DARK, null); ctx.restore(); } else { const lx = (o.look || 0) * 8; rr(d * 48 - 13 + lx, -100, 26, 10, 5, DARK, null); } }
  // brows
  ctx.lineWidth = 9; ctx.strokeStyle = DARK; for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 25, -135 + (o.angry ? d * 0 + 8 : 0)); ctx.lineTo(d * 75, -140 - (o.angry ? 10 : 0)); ctx.stroke(); }
  // snout + mouth (chewing)
  ell(0, 10, 62, 40, '#f4d6c8', 6); ell(-20, 0, 9, 7, DARK); ell(20, 0, 9, 7, DARK);
  const ch = o.chew ? Math.abs(Math.sin(t * 18)) : 0; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-30, 30 + ch * 6); ctx.quadraticCurveTo(0, 46 + ch * 14, 30, 30 + ch * 6); ctx.stroke();
  // beard
  ctx.beginPath(); ctx.moveTo(-28, 50); ctx.quadraticCurveTo(-10, 120, 0, 165 + Math.sin(t * 4) * 8); ctx.quadraticCurveTo(10, 120, 28, 50); ctx.closePath(); ctx.fillStyle = '#d8c7a3'; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
  // gavel
  if (o.gavel !== undefined) { ctx.save(); ctx.translate(140, 120); ctx.rotate(o.gavel); ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-8, -120, 16, 120); ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.strokeRect(-8, -120, 16, 120); rr(-50, -165, 100, 55, 14, '#6b3f1f', DARK, 6); ctx.restore(); }
  ctx.restore();
}
function fitTxt(s, x, y, size, maxW) { ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width; txt(s, x, y, Math.max(26, Math.min(size, size * maxW / w)), DARK, null); }
function fball(x, y, r, a) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ell(0, 0, r, r, '#fff', 5); ctx.fillStyle = DARK; const pent = (cx, cy, rr2) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - 1.57; ctx.lineTo(cx + Math.cos(q) * rr2, cy + Math.sin(q) * rr2); } ctx.closePath(); ctx.fill(); }; pent(0, 0, r * 0.33); ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - 1.57; pent(Math.cos(q) * r * 0.95, Math.sin(q) * r * 0.95, r * 0.3); } ctx.restore(); ell(-r * 0.35, -r * 0.4, r * 0.18, r * 0.1, 'rgba(255,255,255,.7)'); ctx.restore(); }
function confettiCol(k, col) { if (k <= 0 || k > 2.4) return; const R = rng(21); for (let i = 0; i < 80; i++) { const x = R() * 1300 - 110, y = -60 + (380 + R() * 520) * k, sw = Math.sin(k * 7 + i) * 30; ctx.save(); ctx.translate(x + sw, y); ctx.rotate(k * 9 + i); ctx.fillStyle = i % 3 ? col : '#fff'; ctx.fillRect(-10, -5, 20, 10); ctx.restore(); } }
const P_CROSS = { bArm: [70, -110], fArm: [-70, 110], bLeg: [-8, -4], fLeg: [8, 4] }, P_SKY = { bArm: [-145, -165], fArm: [125, 150], bLeg: [-10, -6], fLeg: [10, 6] }, P_SIU = { bArm: [-70, -50], fArm: [70, 50], bLeg: [-28, -18], fLeg: [28, 18] };
const P_PRESENT = { bArm: [-20, -10], fArm: [100, 130], bLeg: [-8, -4], fLeg: [8, 4] }, P_STOMP = { bArm: [-40, -10], fArm: [40, 10], bLeg: [-10, -4], fLeg: [40, 60] }, P_FACEPALM = { bArm: [-20, -10], fArm: [160, 120], bLeg: [-8, -4], fLeg: [8, 4] };
function steam2(x, y, t) { for (const d of [-1, 1]) for (let i = 0; i < 4; i++) { const k = (t * 2 + i / 4) % 1; ell(x + d * (40 + k * 90), y - k * 140, 18 + k * 30, 18 + k * 30, `rgba(255,255,255,${0.85 * (1 - k)})`); } }

// ---------- Episode 8: ROAD TO 1000 (Ronaldo, 985 career goals as of Nov 12 2026). Format: mountain-expedition mini-movie. Parody. ----------
const YEL = '#ffd400', BLUE = '#1e3a8a', RS = 1.0;
const RON = (p, e, x, y, s = RS, o = {}) => chibi.draw(ctx, CH.ronaldo, p, e, x, y, s, Object.assign({ f: 1 }, o));
const P_KICKBACK = { bArm: [60, 30], fArm: [-60, -30], bLeg: [-8, -4], fLeg: [-55, -95] };
const P_KICK = { bArm: [-70, -40], fArm: [70, 40], bLeg: [-12, -6], fLeg: [80, 85] };
const P_TUCK = { bArm: [-120, -160], fArm: [120, 160], bLeg: [70, -40], fLeg: [80, -30] };
const P_CLIMB1 = { bArm: [170, 175], fArm: [150, 120], bLeg: [-20, -10], fLeg: [40, -40] };
const P_CLIMB2 = { bArm: [150, 120], fArm: [170, 175], bLeg: [40, -40], fLeg: [-20, -10] };
const P_FIST = { bArm: [-20, -10], fArm: [160, 175], bLeg: [-10, -6], fLeg: [10, 6] };

// ---- sky (screen space) + wall (world space) ----
let skyC = null;
function makeSky() { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#2a5fb8'); gr.addColorStop(0.55, '#7cc0f0'); gr.addColorStop(1, '#ffd9a0'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const peaks = (y0, col, R) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, H); let x = -50; g.lineTo(x, y0); while (x < W + 100) { x += 120 + R() * 160; g.lineTo(x, y0 - 120 - R() * 380); x += 120 + R() * 160; g.lineTo(x, y0 - R() * 60); } g.lineTo(W + 100, H); g.fill(); };
  peaks(1500, '#9db8d8', rng(3)); peaks(1700, '#7f9cc4', rng(9));
  return c; }
function sky(t, par = 0) { if (!skyC) skyC = makeSky(); const oy = (((par * 0.15) % 400) + 400) % 400; ctx.drawImage(skyC, 0, oy); ctx.drawImage(skyC, 0, oy - H);
  const R = rng(11); for (let i = 0; i < 7; i++) { const x = ((R() * 1400 + t * (20 + i * 6)) % 1500) - 200, y = ((R() * 1700 + par * 0.4) % 2100) - 100; cloud(x, y, 0.7 + R() * 0.8); } }
function cloud(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = 'rgba(255,255,255,.88)'; for (const [dx, dy, r] of [[0, 0, 60], [55, -25, 70], [115, 0, 55], [55, 15, 60]]) { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); } ctx.restore(); }
function wall(y0, y1) { // big rock face in world space
  const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#8a7f76'); g.addColorStop(1, '#6e625a'); ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(60, y1); for (let y = y1; y > y0; y -= 160) ctx.lineTo(40 + Math.sin(y * 0.013) * 40, y); ctx.lineTo(1040, y0); for (let y = y0; y < y1; y += 160) ctx.lineTo(1040 + Math.cos(y * 0.011) * 40, y); ctx.closePath(); ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.strokeStyle = 'rgba(30,20,10,.35)'; ctx.lineWidth = 6; const R = rng(5); for (let y = y0 + 80; y < y1; y += 140) { const x = 120 + R() * 820; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 30, y + 50); ctx.lineTo(x + 10, y + 100); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,.08)'; for (let y = y0; y < y1; y += 300) ctx.fillRect(80, y, 900, 30); }
function ledge(x, y, n, wdt = 460, signSide = -1) { // rock platform + snow + numbered sign
  ctx.beginPath(); ctx.moveTo(x - wdt / 2, y); ctx.lineTo(x + wdt / 2, y); ctx.lineTo(x + wdt / 2 - 40, y + 70); ctx.lineTo(x + 60, y + 140); ctx.lineTo(x - 80, y + 110); ctx.lineTo(x - wdt / 2 + 30, y + 80); ctx.closePath(); ctx.fillStyle = '#5a4e46'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - wdt / 2 - 6, y + 2); ctx.quadraticCurveTo(x, y - 26, x + wdt / 2 + 6, y + 2); ctx.lineTo(x + wdt / 2 - 20, y + 24); ctx.quadraticCurveTo(x, y + 6, x - wdt / 2 + 20, y + 24); ctx.closePath(); ctx.fillStyle = '#f4f8ff'; ctx.fill(); ctx.lineWidth = 5; ctx.stroke();
  if (n != null) { const sx = x + signSide * (wdt / 2 - 50); ctx.fillStyle = '#8b5a2b'; ctx.fillRect(sx - 8, y - 150, 16, 150); ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.strokeRect(sx - 8, y - 150, 16, 150); rr(sx - 95, y - 250, 190, 110, 16, '#fff7cc', DARK, 7); txt(String(n), sx, y - 193, 72, '#c1121f', null); }
}
function net(x, y, f, ripple = 0) { // small goal standing on a ledge, opening facing -f
  ctx.save(); ctx.translate(x, y); ctx.scale(f, 1); const w = 230, h = 170, bulge = ripple * 40;
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; for (let i = 0; i <= 8; i++) { ctx.beginPath(); ctx.moveTo(-w / 2 + i * w / 8, -h); ctx.quadraticCurveTo(-w / 2 + i * w / 8 + bulge, -h / 2, -w / 2 + i * w / 8, 0); ctx.stroke(); } for (let j = 0; j <= 5; j++) { ctx.beginPath(); ctx.moveTo(-w / 2, -h + j * h / 5); ctx.quadraticCurveTo(bulge, -h + j * h / 5 + bulge * 0.3, w / 2, -h + j * h / 5); ctx.stroke(); }
  ctx.lineWidth = 16; ctx.strokeStyle = DARK; ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -h); ctx.lineTo(w / 2, -h); ctx.lineTo(w / 2, 0); ctx.stroke(); ctx.lineWidth = 9; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore(); }
function goat(x, y, s, t, o = {}) { ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); goatJudge(0, -260 * s, s, t, o); ctx.restore(); } // y = feet
function summitFlag(x, y, t, bite = 0) { ctx.fillStyle = '#ddd'; ctx.fillRect(x - 7, y - 380, 14, 380); ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.strokeRect(x - 7, y - 380, 14, 380);
  ctx.save(); ctx.beginPath(); const w = Math.sin(t * 6) * 16; ctx.moveTo(x + 7, y - 380); ctx.quadraticCurveTo(x + 150, y - 400 + w, x + 300, y - 375); ctx.lineTo(x + 300, y - 230); ctx.quadraticCurveTo(x + 150, y - 255 - w, x + 7, y - 235); ctx.closePath(); ctx.fillStyle = YEL; ctx.fill(); ctx.lineWidth = 7; ctx.stroke(); ctx.clip(); txt('1000', x + 155, y - 305, 92, BLUE, '#fff');
  if (bite > 0) { ctx.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.arc(x + 312 - bite * 22 - i * 6, y - 392 + i * 26, 26, 0, TAU); ctx.fill(); } ctx.globalCompositeOperation = 'source-over'; }
  ctx.restore(); }
function nameTag(x, y, k = 1) { pop(k, x, y, () => { rr(-190, -46, 380, 92, 46, YEL, DARK, 6); txt('RONALDO', 0, 3, 56, BLUE, null); }); }
function hiddenGoat(x, y, s = 44) { ctx.globalAlpha = 0.55; txt('🐐', x, y, s, '#fff', null); ctx.globalAlpha = 1; }
function stopwatch(x, y, s, frac) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); rr(-26, -175, 52, 40, 8, '#9ca3af', DARK, 6); ell(0, 0, 150, 150, '#f8fafc', 9); ell(0, 0, 122, 122, '#fff', 0);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 118, -Math.PI / 2, -Math.PI / 2 + frac * TAU); ctx.closePath(); ctx.fillStyle = 'rgba(239,68,68,.35)'; ctx.fill();
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.beginPath(); ctx.moveTo(Math.sin(a) * 100, -Math.cos(a) * 100); ctx.lineTo(Math.sin(a) * 118, -Math.cos(a) * 118); ctx.stroke(); }
  const a = frac * TAU; ctx.lineWidth = 10; ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(a) * 105, -Math.cos(a) * 105); ctx.stroke(); ell(0, 0, 14, 14, DARK); txt('15 MIN', 0, 60, 34, DARK, null); ctx.restore(); }

// ---- HUD: career counter + hat-trick chip ----
function hud(val, bumpK = -1, hat = -1, watch = 0) {
  const b = bumpK >= 0 && bumpK < 0.4 ? 1 + 0.45 * (1 - bumpK / 0.4) : 1;
  pop(1, W / 2, 200, () => { rr(-280, -62, 560, 124, 62, 'rgba(10,14,30,.9)', YEL, 6); txt('CAREER GOALS', -105, 2, 34, YEL, null); ctx.save(); ctx.translate(165, 4); ctx.scale(b, b); txt(String(val), 0, 0, 78, '#fff', null); ctx.restore(); });
  if (hat >= 0) pop(1, W / 2, 330, () => { rr(-230, -44, 460, 88, 44, 'rgba(255,255,255,.94)', DARK, 5); txt('⏱', -175, 2, 46, DARK, null); for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < hat ? 1 : 0.22; fball(-80 + i * 90, 0, 30, watch * 6 + i); ctx.globalAlpha = 1; } txt('HAT', 175, 3, 36, '#c1121f', null); });
}
function slam(text, k, col = YEL, y = 560, size = 110) { if (k <= 0 || k > 1.5) return; if (k < 0.1) { ctx.fillStyle = 'rgba(255,212,0,.18)'; ctx.fillRect(0, 0, W, H); }
  const out = k > 1.2 ? clamp((k - 1.2) / 0.3) : 0; pop(eOB(k / 0.12) * (1 - out), W / 2, y, () => { ctx.rotate(-0.06); if (k < 0.6) { ctx.save(); ctx.rotate(k * 0.8); ctx.globalAlpha = 1 - k / 0.6; for (let i = 0; i < 16; i++) { ctx.rotate(TAU / 16); ctx.fillStyle = i % 2 ? col : 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(380, -32); ctx.lineTo(380, 32); ctx.fill(); } ctx.restore(); ctx.globalAlpha = 1; }
    ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(text).width + 90; rr(-w / 2, -size * 0.8, w, size * 1.6, 44, col, DARK, 9); txt(text, 0, 4, size, BLUE, '#fff'); }); }
function caption(s, k, y = 1380, size = 64) { pop(eOB(k / 0.2), W / 2, y, () => { ctx.font = `900 ${size}px ${F}`; const w = ctx.measureText(s).width + 70; rr(-w / 2, -size * 0.75, w, size * 1.5, 30, 'rgba(10,14,30,.85)', null); txt(s, 0, 3, size, '#fff', null); }); }

// ---- the wall for the hat-trick: ledges 982 → 985 ----
const L = [[330, 1650, 982], [750, 1080, 983], [330, 510, 984], [750, -60, 985]];
