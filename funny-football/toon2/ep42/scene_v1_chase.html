// ---------------- Ep42 THE CHASE (owner 24 Nov): Mbappé chases Dembélé, who rides on the back of the PSG president's motorbike

const LUNGE = [12.8, 13.8, 14.8], ROAD = 1520;

const UPH = { bArm: [-145, -135], fArm: [145, 135], bLeg: [80, 0], fLeg: [90, 0] }, DRIVE = { bArm: [70, 40], fArm: [60, 30], bLeg: [80, 0], fLeg: [90, 0] }, ROD = { bArm: [-60, -20], fArm: [140, 90], bLeg: [80, 0], fLeg: [90, 0] };

function bike(t, bx, bob, far = 0) { const y = ROAD - 40 + bob, sc = far ? 0.55 : 1; ctx.save(); ctx.translate(bx, y); ctx.scale(sc, sc); ctx.translate(-bx, -y);

  ctx.strokeStyle = '#222'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(bx + 180, y - 120); ctx.lineTo(bx + 220, y - 230); ctx.lineTo(bx + 170, y - 250); ctx.stroke(); ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.ellipse(bx + 230, y - 110, 26, 20, 0, 0, 7); ctx.fill();

  // the trophies
  if (!rod) { const w = Math.sin(t * 6) * 0.12; ucl(bx - 320, y - 640 + Math.sin(t * 6) * 14, 0.58, '2025', -0.25 + w); ucl(bx + 100, y - 680 - Math.sin(t * 6) * 14, 0.58, '2026', 0.25 - w); }

function smoke(t, bx) { const v = t >= T.vroom && t < T.D; for (let i = 0; i < 12; i++) { const k = ((t * (v ? 1.6 : 0.8) + i / 12) % 1), big = v ? 1 : 0.35; ctx.fillStyle = v ? `rgba(40,40,45,${0.7 * (1 - k)})` : `rgba(200,200,210,${0.5 * (1 - k)})`; ctx.beginPath(); ctx.arc(bx - 310 - k * 520, ROAD - 40 - k * 120 + Math.sin(i * 3) * 30, (30 + k * 120) * big, 0, 7); ctx.fill(); } }

    ctx.beginPath(); ctx.moveTo(x - 330, 720); ctx.lineTo(x - 20, 720); ctx.lineTo(x - 20, 860); ctx.lineTo(x - 330, 860); ctx.lineTo(x - 380, 790); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + 20, 720); ctx.lineTo(x + 330, 720); ctx.lineTo(x + 380, 790); ctx.lineTo(x + 330, 860); ctx.lineTo(x + 20, 860); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font = `400 64px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('MADRID', x - 185, 792); ctx.fillText('PARIS', x + 185, 792);
    ctx.font = `400 44px ${FONT}`; ctx.fillStyle = '#ffd23f'; ctx.fillText('🏆 0', x - 185, 900); ctx.fillText('🏆🏆', x + 185, 900); ctx.restore(); }

  else if (t < T.C) { mx = 160 + Math.sin(t * 2) * 20; mEx = 'shock'; }

  else if (t < T.F) { mx = 280; mEx = LUNGE.some(a => t >= a && t < a + 0.4) ? 'angry' : 'shock'; lean = LUNGE.some(a => t >= a && t < a + 0.4) ? 0.5 : 0.25; }
  else if (t < T.G) { const k = clamp((t - T.F) / 0.6); mx = lerp(330, 420, k); mPose = t > T.stop ? { bArm: [-14, -6], fArm: [14, 6], bLeg: [-8, -4], fLeg: [8, 4] } : RUNP(t); lean = t > T.stop ? -0.1 : 0.25; hop = t > T.stop ? 0 : hop; mEx = t < T.stop + 0.4 ? 'shock' : t < T.stop + 1.6 ? 'shock' : 'cry'; }
