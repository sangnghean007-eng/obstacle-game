const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d'); const STYLE = STYLES.comic; const FONT = '"Bangers","Impact",Inter,sans-serif';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, eOut = k => 1 - (1 - clamp(k)) ** 3, eBack = k => EASE.back(clamp(k));
const kit = (shirt, trim, shorts, sock, num) => ({ shirt, sleeve: shirt, cuff: trim, collar: trim, shorts, sock, sockShade: sock, sockBand: trim, boot: '#111', num });

    else { const me = false; ctx.font = `600 58px Inter, sans-serif`; const w = Math.max(380, Math.max(...it.lines.map(l => ctx.measureText(l).width)) + 80); const x0 = 150; ctx.translate(x0, it.y); ctx.scale(sc, sc);
      ctx.fillStyle = DK[it.who] || '#555'; ctx.beginPath(); ctx.arc(-70, it.h - 40, 42, 0, 7); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#111'; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.font = `900 34px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(it.who.split(' ').map(s => s[0]).join(''), -70, it.h - 38);

// ---------------- sequence ----------------
const SEG = [[0, 3.5, 'chat'], [3.5, 7.5, g37], [7.5, 9.2, 'chat'], [9.2, 11.2, bus], [11.2, 15, g83], [15, 16.5, 'chat'], [16.5, 19, varScene], [19, 20.5, eyes], [20.5, 24.5, pen], [24.5, 30, 'chat'], [30, 32, finale]];
