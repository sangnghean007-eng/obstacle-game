// ---------------- world: a floating staircase of goal blocks, 7 steps per flight, switchbacks up into the sky
const N0 = 930, TOP = 986, SUM = 1000, FL = 7;
function step(n) { const i = n - N0, leg = Math.floor(i / FL), j = i % FL; return { x: leg % 2 ? FL - 1 - j : j, y: -leg, z: i }; }

const STONE = ['#8f8172', '#9b8b77', '#857868', '#a09080'];

  ctx.fillStyle = g; ctx.fillRect(-4000, -6000, 8000, 9000);
  for (const c of CLOUDS) { ctx.save(); ctx.translate(c.x + (window.__T || 0) * (20 + c.d * 40), c.y); ctx.scale(c.s, c.s); ctx.globalAlpha = 0.85; for (let k = 0; k < 5; k++) { ctx.fillStyle = k % 2 ? '#ffffff' : '#eef6ff'; ctx.fillRect(-160 + k * 60, -30 - (k % 3) * 22, 110, 60 + (k % 3) * 22); } ctx.restore(); } }

let PULL = 0, WOB = 0, BLOCK986 = 1;   // OCT 23 block pulled out (cubes), wobble of the flights above it, 986 placed (0..1)
const OCT = 962;
function stairs(t, from = N0, to = SUM - 1) {
  const list = []; for (let n = from; n <= to; n++) list.push(n);

    if (n > TOP && n < SUM) { VOX.cube(ctx, x, y, z, '#ffffff', { ghost: 'rgba(255,255,255,.75)', label: n === 987 ? '987?' : null, labelSize: 22, labelCol: '#fff' }); continue; }
    if (n === TOP) { if (BLOCK986 <= 0) continue; const dz = (1 - eOut(BLOCK986)) * 2.2; VOX.cube(ctx, x, y, z + dz, '#f2c230', { glow: '#ffe066', label: '986', labelSize: 30, labelCol: '#fffaf0', labelEdge: '#7a4b00' }); continue; }

  // the summit: a 3x3 gold plateau with the 1000 sign, and Ep8's goat still holding the flag
  const s = step(SUM); for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) VOX.cube(ctx, s.x + a, s.y + b, s.z, '#e0b13a', { label: a === 1 && b === 1 ? '1000' : null, labelSize: 26 });
}
function goat(t, x, y, sc = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); const b = Math.sin(t * 6) * 3;
  VOX.box(ctx, -40, -60 + b, 80, 42, '#f3efe6', { d: 18 }); for (const lx of [-34, -14, 12, 26]) VOX.box(ctx, lx, -20, 10, 20, '#d9d3c4', { d: 4, tex: false });
  VOX.box(ctx, 34, -92 + b, 36, 36, '#f3efe6', { d: 12, tex: false }); ctx.fillStyle = INK; ctx.fillRect(56, -82 + b, 6, 6); ctx.fillStyle = '#c8b28a'; ctx.fillRect(40, -104 + b, 8, 14); ctx.fillRect(58, -104 + b, 8, 14);
  ctx.fillStyle = '#f3efe6'; ctx.fillRect(60, -62 + b, 12, 10);   // beard
  ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-30, -50 + b); ctx.lineTo(-30, -190); ctx.stroke();
  const wv = Math.sin(t * 5) * 8; ctx.fillStyle = '#c0281c'; ctx.beginPath(); ctx.moveTo(-30, -190); ctx.lineTo(70, -180 + wv); ctx.lineTo(56, -150 + wv); ctx.lineTo(-30, -140); ctx.closePath(); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
  ctx.font = `400 20px ${PIX}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('1000', 14, -158 + wv * 0.5); ctx.restore(); }   // the corner is chewed (hidden detail)
// ---------------- the laughing goalpost on step 988 ("goal 987")

// ---------------- the stats robot

  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(0, -92); ctx.stroke(); const pw = Math.abs(Math.cos(t * 30)) * 60 + 8; ctx.fillStyle = '#c9d2da'; ctx.fillRect(-pw / 2, -98, pw, 8); ctx.strokeRect(-pw / 2, -98, pw, 8);
  VOX.box(ctx, -55, -70, 110, 90, '#9aa6b2', { d: 22, seed: 4 }); ctx.fillStyle = '#10261a'; ctx.fillRect(-42, -58, 84, 50); ctx.strokeRect(-42, -58, 84, 50);
  ctx.fillStyle = '#5cff8a'; ctx.font = `400 13px ${PIX}`; ctx.textAlign = 'center'; ctx.fillText(o.screen || '985.5', 0, -36); ctx.fillRect(-22, -24, 8, 6); ctx.fillRect(14, -24, 8, 6);

  const a = o.arm ?? 0.4; ctx.save(); ctx.translate(55, -20); ctx.rotate(-a); VOX.box(ctx, 0, -6, 60 + (o.reach || 0), 12, '#7d8894', { d: 5, tex: false }); ctx.translate(o.reach || 0, 0);   // arm reaches right, to the block

  else { ctx.fillStyle = '#7d8894'; ctx.fillRect(60, -18, 16, 36); ctx.strokeRect(60, -18, 16, 36); ctx.fillRect(60, -18, 30, 10); ctx.strokeRect(60, -18, 30, 10); ctx.fillRect(60, 8, 30, 10); ctx.strokeRect(60, 8, 30, 10); }
  ctx.restore(); ctx.restore(); }
// ---------------- Al Ahli ground (split panel)
const AKIT = { shirt: '#0f7a3a', trim: '#ffffff', shorts: '#ffffff', sock: '#0f7a3a', boot: '#111', skin: '#b5835a', num: '', name: '' };
function blockHead(skin, hair) { return (g, hx, hy) => { const c = S; VOX.box(g, hx - c * 0.45, hy - c * 0.9, c * 0.9, c * 0.9, skin, { d: c * 0.3, tex: false }); g.fillStyle = hair; g.fillRect(hx - c * 0.45, hy - c * 0.9, c * 0.9, c * 0.22);
  g.fillStyle = '#fff'; g.fillRect(hx - c * 0.28, hy - c * 0.55, c * 0.18, c * 0.14); g.fillRect(hx + c * 0.1, hy - c * 0.55, c * 0.18, c * 0.14); g.fillStyle = INK; g.fillRect(hx - c * 0.22, hy - c * 0.53, c * 0.08, c * 0.1); g.fillRect(hx + c * 0.16, hy - c * 0.53, c * 0.08, c * 0.1);
  g.fillStyle = '#5a2a1a'; g.fillRect(hx - c * 0.2, hy - c * 0.3, c * 0.4, c * 0.08); }; }
function ground(t) { // its own little world, centred on (540, 1150)
  const ox = VOX.ox, oy = VOX.oy; VOX.ox = 540; VOX.oy = 1000;
  const g = ctx.createLinearGradient(0, 300, 0, 1700); g.addColorStop(0, '#7cc6f2'); g.addColorStop(1, '#fde7b0'); ctx.fillStyle = g; ctx.fillRect(-1500, -800, 4000, 4000);
  for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) VOX.cube(ctx, i, j, 0, (i + j) % 2 ? '#4caf50' : '#43a047', { tex: true });
  // scoreboard towers: Al Nassr 1 (yellow), Al Ahli 1-2-3 (green; the 3rd is Ronaldo's own penalty ball)
  VOX.cube(ctx, -1, -2, 1, '#f7d117', { label: '1', labelSize: 40, labelCol: '#1f3c88', labelEdge: '#fff' });
  const st = [12.2, 12.75, 13.3]; for (let k = 0; k < 3; k++) { const kk = eOut((t - st[k]) / 0.3); if (kk <= 0) continue; const dz = (1 - kk) * 3;
    if (k < 2) VOX.cube(ctx, 1, -1, 1 + k + dz, '#0f7a3a', { label: String(k + 1), labelSize: 40 }); else ball(...VOX.p(1.5, -0.5, 3 + dz), 0.95, t); }
  // three players: the stackers, then a celebration jump

    VOX.figure(ctx, { x: p[0], y: p[1] - cel * (k % 2 ? 1 : 0.7), c: S * 0.95, kit: AKIT, armL: act ? 2.6 : 0.3 + Math.sin(t * 5 + k) * 0.15, armR: act ? 2.6 : (cel ? 2.8 : 0.3), legL: Math.sin(t * 8 + k) * 0.1, lean: l, headFn: blockHead(AKIT.skin, '#1a1410') }); });

// ---------------- the ball (a little checked block)
function ball(x, y, sc = 1, t = 0, spin = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(spin); const r = 20 * sc; VOX.box(ctx, -r, -r, 2 * r, 2 * r, '#ffffff', { d: r * 0.5, tex: false, lw: 3 });
  ctx.fillStyle = INK; ctx.fillRect(-r * 0.3, -r * 0.3, r * 0.6, r * 0.6); ctx.fillRect(-r, -r, r * 0.4, r * 0.4); ctx.fillRect(r * 0.6, r * 0.6, r * 0.4, r * 0.4); ctx.restore(); }
// dust puffs (blocky)
function dust(x, y, k, n = 8) { if (k <= 0 || k >= 1) return; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI - Math.PI, r = 30 + k * 90; ctx.fillStyle = `rgba(240,230,210,${1 - k})`; const s = 18 * (1 - k * 0.5); ctx.fillRect(x + Math.cos(a) * r - s / 2, y + Math.sin(a) * r * 0.5 - s / 2, s, s); } }

// ---------------- story time-line (seconds)
const T = { slam: 0.95, hop: 1.2, siu: 2.25, wideA: 3.4, low: 7.0, kick: 8.55, post: 8.85, split: 11.4, xcu: 15.0, pull: 16.5, dutch: 18.6, land: 19.25, back: 20.5, cuEnd: 22.2, END: 27.0 };
function ballDown(t) { // after the post: over his head, then down the flights one step every 0.12 s
  const a = stand(988), r = stand(TOP); if (t < T.post + 0.35) { const k = (t - T.post) / 0.35; return [lerp(a[0] - 40, r[0] - 70, k), lerp(a[1] - 60, r[1] - 190, k) - Math.sin(k * Math.PI) * 60, k * 9]; }
  const s = (t - T.post - 0.35) / 0.12, n = TOP - 1 - Math.floor(s), f = s % 1; if (n < N0) return null; const p0 = stand(n + 1), p1 = stand(n);
  return [lerp(p0[0], p1[0], f), lerp(p0[1], p1[1], f) - Math.sin(f * Math.PI) * 50 - 18, s * 2.5]; }
const pullAt = t => t < T.pull ? 0 : t < T.dutch ? eIO((t - T.pull) / 1.3) * 1.25 : t < T.back - 0.9 ? 1.25 + Math.sin(t * 22) * 0.06 : t < T.back ? 1.25 * (1 - eIO((t - T.back + 0.9) / 0.9)) : 0;

  WOB = t > T.pull + 0.6 && t < T.back + 0.6 ? Math.sin(t * 17) * 0.02 * clamp((t - T.pull - 0.6) / 0.4) * clamp((T.back + 0.6 - t) / 0.4) : 0;
  PULL = pullAt(t);

  stairs(t, N0, OCT); const pv = stand(OCT); ctx.save(); ctx.translate(pv[0], pv[1]); ctx.rotate(WOB); ctx.translate(-pv[0], -pv[1]); stairs(t, OCT + 1, SUM - 1);
  const s = step(SUM), g = P(s.x + 0.5, s.y + 0.5, s.z + 1); goat(t, g[0] - 20, g[1], 0.9);

  if (t < T.hop) { rx = prev[0]; ry = prev[1]; if (t < T.slam) Object.assign(o, { armL: 2.9, armR: 2.9, hold: goldBlockHeld('986'), expr: 'laugh' }); else Object.assign(o, { armL: 1.2, armR: 1.2, expr: 'laugh', sq: 0.08 * clamp(1 - (t - T.slam) / 0.2) }); }
  else if (t < T.hop + 0.45) { const k = (t - T.hop) / 0.45; rx = lerp(prev[0], top[0], k); ry = lerp(prev[1], top[1], k) - Math.sin(k * Math.PI) * 70; Object.assign(o, { armL: 1.6, armR: 1.6, legL: 0.4, legR: -0.4 }); }
  else if (t < T.siu) Object.assign(o, { armL: 1.9 + Math.sin(t * 14) * 0.2, armR: 1.9 + Math.sin(t * 14 + 1) * 0.2, expr: 'laugh' });       // flex
  else if (t < T.siu + 0.95) { const k = (t - T.siu) / 0.95; ry -= Math.sin(clamp(k / 0.8) * Math.PI) * 120; Object.assign(o, { lean: Math.sin(k * Math.PI * 2) * 0.25, armL: k < 0.8 ? 2.4 : 0.9, armR: k < 0.8 ? 2.4 : 0.9, legL: 0.35, legR: -0.35, expr: 'laugh', sq: k > 0.8 ? 0.1 : 0 }); }
  else if (t < T.siu + 2.0) Object.assign(o, { expr: 'laugh', armL: 0.95 + Math.sin(t * 9) * 0.05, armR: 0.95 + Math.sin(t * 9 + 1) * 0.05, legL: 0.35, legR: -0.35, sq: t < T.siu + 1.1 ? 0.08 : 0 });   // the SIUUU pose while the shout lasts
  else if (t < T.low) Object.assign(o, { expr: 'smug', armR: t > 4.6 ? 2.7 : 0.4 + (t - T.siu - 2.0) * 3, armL: 0.2 });                 // points up at the summit
  else if (t < T.kick) { const k = clamp((t - 7.4) / 0.6), run = clamp((t - 8.0) / 0.55); rx -= 46 * k - 46 * run; ry += 26 * k - 26 * run; Object.assign(o, { expr: 'angry', armL: 0.5 + run * 0.6, armR: 0.3, legL: run ? Math.sin(t * 30) * 0.5 : 0, legR: run ? -Math.sin(t * 30) * 0.5 : 0, lean: -run * 0.1 }); }
  else if (t < T.post + 0.05) Object.assign(o, { expr: 'angry', legR: -1.2, armL: 1.2, armR: 0.8, lean: 0.12 });
  else if (t < T.post + 0.4) Object.assign(o, { expr: 'shock', sq: 0.18, armL: 2.3, armR: 2.3 });            // ducks: the ball flies back over his head
  else if (t < T.cuEnd && !(t > T.dutch)) Object.assign(o, { expr: t < T.post + 1.2 ? 'shock' : 'cry', armL: 0.15, armR: 0.15, lean: Math.sin(t * 2) * 0.04, tilt: 0.12 });
