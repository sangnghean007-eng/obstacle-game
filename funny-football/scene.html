<!doctype html>
<html><head><meta charset="utf-8"><title>Bóng đá ăn vạ</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
// Hoạt hình biếm họa bóng đá: "Siêu Kinh Điển Ăn Vạ" — vẽ thuần Canvas, render theo thời gian t (giây).
const W = 1280, H = 720, DURATION = 34;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = 'Inter, "DejaVu Sans", sans-serif';
const DARK = '#151515';

// ---------- tiện ích ----------
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = k => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
const TAU = Math.PI * 2;

function ell(x, y, rx, ry, fill, stroke = DARK, lw = 4, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function rrect(x, y, w, h, r, fill, stroke = DARK, lw = 4) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function limb(x1, y1, x2, y2, color, w = 8) {
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = DARK; ctx.lineWidth = w + 6; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function txt(s, x, y, size, fill = '#fff', stroke = DARK, align = 'center', weight = 900) {
  ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = Math.max(3, size * 0.2); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function popTxt(s, x, y, size, k, fill, stroke = DARK, rot = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc);
  txt(s, 0, 0, size, fill, stroke); ctx.restore();
}
function bubble(x, y, s, tx, ty, k, size = 26) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(tx, ty); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc); ctx.translate(-tx, -ty);
  ctx.font = `800 ${size}px ${F}`;
  const w = ctx.measureText(s).width + 36, h = size + 28;
  ctx.beginPath(); ctx.moveTo(x - 18, y + h / 2 - 4); ctx.lineTo(tx, ty); ctx.lineTo(x + 18, y + h / 2 - 4); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = DARK; ctx.stroke();
  rrect(x - w / 2, y - h / 2, w, h, 18, '#fff');
  ctx.beginPath(); ctx.moveTo(x - 14, y + h / 2 - 2); ctx.lineTo(x + 14, y + h / 2 - 2); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.stroke();
  txt(s, x, y + 1, size, DARK, null, 'center', 800);
  ctx.restore();
}
function burst(x, y, r, s, k, fill = '#ffd60a', size = 48, rot = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc);
  ctx.beginPath();
  for (let i = 0; i < 32; i++) { const a = i / 32 * TAU, rr = i % 2 ? r * 0.68 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.75); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#c1121f'; ctx.stroke();
  txt(s, 0, 2, size, '#c1121f', '#fff');
  ctx.restore();
}
function lower(s, k, color = '#c1121f') {
  if (k <= 0) return;
  const x = lerp(-900, 0, easeOut(k));
  ctx.save(); ctx.translate(x, 0);
  ctx.font = `800 30px ${F}`; const w = ctx.measureText(s).width + 90;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, 628); ctx.lineTo(w + 30, 628); ctx.lineTo(w, 684); ctx.lineTo(0, 684); ctx.fill();
  ctx.fillStyle = '#ffd60a'; ctx.fillRect(0, 684, w - 20, 8);
  txt(s, 50, 657, 30, '#fff', null, 'left', 800);
  ctx.restore();
}
function scoreBug(clock, k = 1) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(k);
  rrect(24, 22, 500, 48, 10, 'rgba(10,10,20,.85)', null);
  rrect(24, 22, 150, 48, [10, 0, 0, 10], '#1d4ed8', null);
  txt('BỤNG BIA', 99, 46, 22, '#fff', null, 'center', 800);
  txt('0 - 0', 224, 46, 26, '#fff', null, 'center', 900);
  rrect(274, 22, 150, 48, 0, '#d62828', null);
  txt('ĂN VẠ', 349, 46, 22, '#fff', null, 'center', 800);
  txt(clock, 474, 46, 22, '#ffd60a', null, 'center', 800);
  ell(548, 46, 7, 7, '#ff2d2d', null); txt('LIVE', 586, 46, 18, '#fff', DARK, 'center', 900);
  ctx.restore();
}

// ---------- bối cảnh sân vận động ----------
const crowd = []; {
  const R = rng(11);
  const cols = ['#d62828', '#1d4ed8', '#ffd60a', '#ffffff', '#f97316', '#d62828', '#1d4ed8'];
  const skins = ['#f1c27d', '#e0ac69', '#c68642', '#ffdbac', '#8d5524'];
  for (let row = 0; row < 9; row++) {
    const y = 150 + row * 21;
    for (let x = -10; x < W + 10; x += 15 + R() * 5)
      crowd.push({ x: x + (row % 2) * 7, y, c: cols[Math.floor(R() * cols.length)], sk: skins[Math.floor(R() * skins.length)], ph: R() * TAU, r: 6 + row * 0.3, z: R() < 0.06 });
  }
}
function sky(day = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, 360);
  g.addColorStop(0, `rgb(${lerp(8, 90, day)},${lerp(18, 170, day)},${lerp(48, 240, day)})`);
  g.addColorStop(1, `rgb(${lerp(40, 180, day)},${lerp(70, 220, day)},${lerp(130, 255, day)})`);
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, 600);
  if (day < 0.5) { const R = rng(3); ctx.fillStyle = `rgba(255,255,255,${0.7 - day})`; for (let i = 0; i < 60; i++) ctx.fillRect(R() * W, R() * 120, 2, 2); }
}
function stands(t, o = {}) {
  const cheer = o.cheer ?? 0.5, sleep = o.sleep || 0;
  ctx.fillStyle = '#2b2f3a'; ctx.fillRect(-200, 120, W + 400, 225);
  ctx.fillStyle = '#3a3f4d'; ctx.fillRect(-200, 120, W + 400, 14);
  for (let r = 0; r < 9; r++) { ctx.fillStyle = r % 2 ? '#323745' : '#2d313d'; ctx.fillRect(-200, 146 + r * 21, W + 400, 21); }
  for (const p of crowd) {
    const bob = sleep ? 0 : -Math.abs(Math.sin(t * 9 + p.ph)) * 7 * cheer;
    const tilt = sleep ? 4 : 0;
    ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r, p.y + bob, p.r * 2, p.r * 2 + 4);
    ctx.beginPath(); ctx.arc(p.x + tilt, p.y - 2 + bob + tilt * .5, p.r * 0.8, 0, TAU); ctx.fillStyle = p.sk; ctx.fill();
    if (!sleep && cheer > 0.7 && Math.sin(t * 9 + p.ph) > 0.3) { ctx.fillStyle = p.sk; ctx.fillRect(p.x - p.r - 2, p.y - 12 + bob, 3, 10); ctx.fillRect(p.x + p.r - 1, p.y - 12 + bob, 3, 10); }
    if (sleep && p.z) txt('z', p.x + 10 + Math.sin(t * 3 + p.ph) * 4, p.y - 18 - ((t * 20 + p.ph * 10) % 20), 14, '#fff', DARK);
  }
  // băng rôn trên khán đài
  const banners = [['VAR ƠI TỈNH DẬY!', 200, 190, '#ffd60a'], ['NGÃ ĐẸP LẮM!', 640, 175, '#ffffff'], ['TRẢ TIỀN VÉ!', 1060, 200, '#ffd60a']];
  for (const [s, x, y, c] of banners) {
    ctx.save(); ctx.translate(x, y + (sleep ? 0 : Math.sin(t * 4 + x) * 3)); ctx.rotate(Math.sin(x) * 0.05);
    ctx.font = `900 20px ${F}`; const w = ctx.measureText(s).width + 26;
    rrect(-w / 2, -16, w, 32, 3, c, DARK, 3); txt(s, 0, 0, 20, '#c1121f', null); ctx.restore();
  }
  // biển quảng cáo
  const ads = ['BIA BỤNG PHỆ', 'MÌ ĂN LIỀN VẠ', 'VAR CHẬM - XIN CHỜ', 'BẢO HIỂM NGÃ', 'DẦU GIÓ CẦU THỦ'];
  for (let i = 0; i < 7; i++) {
    const x = -60 + i * 220;
    ctx.fillStyle = i % 2 ? '#0b3d91' : '#c1121f'; ctx.fillRect(x, 334, 220, 36);
    txt(ads[i % ads.length], x + 110, 352, 17, '#fff', null, 'center', 900);
  }
  ctx.fillStyle = '#111'; ctx.fillRect(-200, 368, W + 400, 4);
}
function pitch() {
  ctx.fillStyle = '#2f8f3c'; ctx.fillRect(-200, 372, W + 400, H);
  for (let i = -10; i <= 10; i += 2) {
    const b0 = W / 2 + i * 150, b1 = b0 + 150, k = 0.55;
    ctx.beginPath(); ctx.moveTo(W / 2 + (b0 - W / 2) * k, 372); ctx.lineTo(W / 2 + (b1 - W / 2) * k, 372);
    ctx.lineTo(b1 + (b1 - W / 2) * 0.3, H + 60); ctx.lineTo(b0 + (b0 - W / 2) * 0.3, H + 60); ctx.closePath();
    ctx.fillStyle = '#38a346'; ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-200, 384); ctx.lineTo(W + 200, 384); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W / 2, 384); ctx.lineTo(W / 2, H + 50); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(W / 2, 520, 230, 70, 0, 0, TAU); ctx.stroke();
}
function lights(t) {
  for (const x of [70, 1210]) {
    ctx.fillStyle = '#555'; ctx.fillRect(x - 5, 20, 10, 110);
    rrect(x - 40, 0, 80, 40, 4, '#ddd', DARK, 3);
    const g = ctx.createRadialGradient(x, 20, 5, x, 20, 160);
    g.addColorStop(0, 'rgba(255,255,220,.85)'); g.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 160, -140, 320, 320);
  }
}
function stadium(t, o = {}) { sky(o.day || 0); lights(t); stands(t, o); pitch(); }

// ---------- quả bóng ----------
function ball(x, y, r, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ell(0, 0, r, r, '#fff', DARK, Math.max(2, r * 0.15));
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, TAU); ctx.clip();
  const pent = (cx, cy, s) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - Math.PI / 2; ctx.lineTo(cx + Math.cos(q) * s, cy + Math.sin(q) * s); } ctx.fillStyle = '#1b1b1b'; ctx.fill(); };
  pent(0, 0, r * 0.36);
  for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - Math.PI / 2; pent(Math.cos(q) * r * 0.95, Math.sin(q) * r * 0.95, r * 0.3); }
  ctx.restore(); ctx.restore();
}

// ---------- nhân vật biếm họa ----------
const STRIKER = { col: '#d62828', col2: '#fff', num: '99', hair: 'spikes', R: 62, bw: 38, skin: '#f3c99a', shorts: '#fff' };
const DEFENDER = { col: '#1d4ed8', col2: '#ffd60a', num: '4', hair: 'flat', R: 50, bw: 82, belly: true, unibrow: true, stache: true, skin: '#d99a6c', shorts: '#fff' };
const REF = { col: '#1b1b1b', col2: '#ffd60a', num: '', hair: 'bald', R: 56, bw: 52, stache: true, skin: '#f1c27d', shorts: '#1b1b1b', ref: true };
const GK = { col: '#16a34a', col2: '#111', num: '1', hair: 'mop', R: 50, bw: 56, glove: true, skin: '#c68642', shorts: '#111' };
const COACH = { col: '#2b2b33', col2: '#fff', num: '', hair: 'combover', R: 58, bw: 64, belly: true, tie: true, skin: '#f0c8a0', shorts: '#2b2b33', pants: '#2b2b33' };

function guy(x, y, base, o = {}) {
  o = Object.assign({}, base, o);
  const s = o.s || 1, R = o.R, bw = o.bw, P = o.p || 0, t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  ctx.translate(0, -80); ctx.rotate(o.rot || 0); ctx.translate(0, 80);
  ctx.lineJoin = 'round';
  const pose = o.pose || 'stand';
  let L = [[-12, 0], [12, 0]];
  if (pose === 'run') L = [[Math.sin(P) * 24, -Math.max(0, Math.cos(P)) * 16], [-Math.sin(P) * 24, -Math.max(0, -Math.cos(P)) * 16]];
  else if (pose === 'kick') L = [[-16, 0], [50, -36]];
  else if (pose === 'splay') L = [[-42, -18 + Math.sin(P) * 12], [42, -18 - Math.sin(P) * 12]];
  else if (pose === 'spread') L = [[-30, 0], [30, 0]];
  const hipY = -48;
  // chân
  L.forEach(([fx, fy], i) => {
    const hx = i ? 9 : -9;
    const leg = o.pants || o.skin;
    limb(hx, hipY, fx, fy - 6, leg, 9);
    if (!o.pants) limb(lerp(hx, fx, 0.55), lerp(hipY, fy - 6, 0.55), fx, fy - 6, o.ref ? '#1b1b1b' : o.col2 === '#ffd60a' ? '#1d4ed8' : o.col, 10);
    ell(fx + 7, fy - 3, 15, 8, o.pants ? '#3b2416' : '#111', DARK, 3);
  });
  // thân
  const top = hipY - 60;
  rrect(-bw / 2, top, bw, 64, 16, o.col);
  if (o.ref) { ctx.save(); ctx.beginPath(); ctx.roundRect(-bw / 2, top, bw, 64, 16); ctx.clip(); ctx.fillStyle = '#ffd60a'; for (let i = -3; i < 4; i++) ctx.fillRect(i * 16, top, 7, 70); ctx.restore(); rrect(-bw / 2, top, bw, 64, 16, null); }
  if (o.belly) ell(bw * 0.28, top + 40, bw * 0.42, 27, o.col);
  if (o.tie) { ctx.beginPath(); ctx.moveTo(-8, top + 2); ctx.lineTo(8, top + 2); ctx.lineTo(4, top + 46); ctx.lineTo(0, top + 54); ctx.lineTo(-4, top + 46); ctx.closePath(); ctx.fillStyle = '#d62828'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = DARK; ctx.stroke(); }
  rrect(-bw / 2 - 1, hipY - 8, bw + 2, 16, 5, o.shorts);
  if (o.num) txt(o.num, o.belly ? -6 : 0, top + 28, 22, o.col2, DARK);
  // tay
  const shY = top + 10, sw = bw / 2 - 4;
  const hand = (side) => {
    const sx = side * sw, A = o.arms || 'swing';
    switch (A) {
      case 'up': return [side * (R + 22) + Math.sin(t * 14 + side) * 8, top - 40];
      case 'flail': return [sx + Math.cos(P * 1.7 + side * 2) * 46, shY + Math.sin(P * 2.3 + side) * 46];
      case 'hips': return [side * (bw / 2 + 6), top + 44];
      case 'shrug': return [side * (bw / 2 + 34), top - 16];
      case 'hair': return [side * 26 + Math.sin(t * 20) * 4, top - R * 1.6];
      case 'back': return [side * (bw / 2 - 10), top + 46];
      case 'clutch': return [12 + side * 6, -26];
      case 'face': return side > 0 ? [R * 0.3, top - R * 0.9] : [-bw / 2 - 8, top + 46];
      case 'finger': return side > 0 ? [bw / 2 + 22 + 36 * (o.reach ?? 1), top + 6] : [-bw / 2 - 6, top + 44];
      case 'point': return side > 0 ? [bw / 2 + 30, top - 70] : [-bw / 2 - 8, top + 44];
      default: return [sx + side * 6 + Math.sin(P) * side * 18, top + 52];
    }
  };
  const drawArm = (side) => {
    const [hx, hy] = hand(side); const sx = side * sw;
    if (o.arms === 'hips' || o.arms === 'shrug') { const ex = side * (bw / 2 + 26), ey = top + 26; limb(sx, shY, ex, ey, o.skin, 8); limb(ex, ey, hx, hy, o.skin, 8); }
    else limb(sx, shY, hx, hy, o.tie ? o.col : o.skin, 8);
    limb(sx, shY, lerp(sx, hx, 0.3), lerp(shY, hy, 0.3), o.col, 12);
    if (o.glove) ell(hx, hy, 17, 17, '#f5f5f5', DARK, 4);
    else ell(hx, hy, 8, 8, o.skin, DARK, 3);
    if (o.arms === 'finger' && side > 0) limb(hx, hy, hx + 16, hy - 2, o.skin, 4);
  };
  drawArm(-1);
  // đầu
  const hy = top - R + 6;
  limb(0, top + 2, 0, hy + R * 0.6, o.skin, 14);
  ell(-R * 0.92, hy + 6, 12, 15, o.skin);
  hair(o, R, hy, 'back', t);
  ell(0, hy, R, R * 1.04, o.skin);
  hair(o, R, hy, 'front', t);
  face(o, R, hy, t);
  drawArm(1);
  ctx.restore();
}
function hair(o, R, hy, layer, t) {
  if (o.hair === 'spikes' && layer === 'back') {
    ctx.beginPath();
    for (let i = -4; i <= 4; i++) {
      const a = -Math.PI / 2 + i * 0.3 - 0.15, a2 = a + 0.15;
      const len = R * (1.55 + (i % 2 ? 0.15 : 0.35));
      ctx.lineTo(Math.cos(a) * R * 0.9, hy + Math.sin(a) * R * 0.9);
      ctx.lineTo(Math.cos(a2) * len - 6, hy + Math.sin(a2) * len);
    }
    ctx.lineTo(R * 0.9, hy - 10); ctx.lineTo(-R * 0.9, hy - 10); ctx.closePath();
    ctx.fillStyle = '#ffcc00'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = DARK; ctx.stroke();
  }
  if (o.hair === 'spikes' && layer === 'front') {
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, hy, R, R * 1.04, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = '#ffcc00'; ctx.fillRect(-R, hy - R * 1.1, R * 2, R * 0.55);
    ctx.fillStyle = '#d62828'; ctx.fillRect(-R, hy - R * 0.55, R * 2, 13);
    ctx.restore(); ell(0, hy, R, R * 1.04, null);
  }
  if (o.hair === 'flat' && layer === 'front') rrect(-R * 0.95, hy - R * 1.25, R * 1.9, R * 0.62, 8, '#2a1a10');
  if (o.hair === 'bald' && layer === 'front') ell(-R * 0.35, hy - R * 0.6, R * 0.25, R * 0.12, 'rgba(255,255,255,.7)', null, 0, -0.4);
  if (o.hair === 'mop' && layer === 'back') for (let i = 0; i < 11; i++) { const a = Math.PI + i / 10 * Math.PI; ell(Math.cos(a) * R * 0.95, hy + Math.sin(a) * R * 0.95, 18, 18, '#3b2416', DARK, 3); }
  if (o.hair === 'combover' && layer === 'front') {
    ctx.strokeStyle = '#3b2416'; ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath(); ctx.moveTo(-R * 0.9, hy - R * 0.3 - i * 6);
      if (o.hairPull) ctx.quadraticCurveTo(-R * 0.6 + i * 10, hy - R * 2 - Math.sin(t * 25 + i) * 20, -R * 0.2 + i * 18, hy - R * 2.4 - i * 8 + Math.cos(t * 30 + i) * 12);
      else ctx.quadraticCurveTo(0, hy - R * 1.3 - i * 3, R * 0.85, hy - R * 0.45);
      ctx.stroke();
    }
  }
}
function face(o, R, hy, t) {
  const fx = R * 0.14, f = o.face || 'smug';
  const ex1 = fx - R * 0.33, ex2 = fx + R * 0.33, ey = hy - R * 0.12, er = R * 0.22;
  // mắt
  if (f === 'pain') {
    ctx.strokeStyle = DARK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (const [x, d] of [[ex1, 1], [ex2, -1]]) { ctx.beginPath(); ctx.moveTo(x - d * 12, ey - 10); ctx.lineTo(x + d * 8, ey); ctx.lineTo(x - d * 12, ey + 10); ctx.stroke(); }
  } else if (f === 'happy') {
    ctx.strokeStyle = DARK; ctx.lineWidth = 5;
    for (const x of [ex1, ex2]) { ctx.beginPath(); ctx.arc(x, ey + 6, 12, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else if (f === 'sleep') {
    ctx.strokeStyle = DARK; ctx.lineWidth = 4;
    for (const x of [ex1, ex2]) { ctx.beginPath(); ctx.arc(x, ey - 4, 11, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); }
  } else {
    const big = f === 'shock' || f === 'worried' ? 1.3 : 1;
    const look = o.look ?? [5, 0];
    for (const x of [ex1, ex2]) {
      ell(x, ey, er * big, er * big * 1.15, '#fff', DARK, 3);
      ell(x + look[0], ey + look[1], er * (f === 'shock' ? 0.25 : 0.42), er * (f === 'shock' ? 0.25 : 0.42), DARK, null);
      if (f === 'smug') { ctx.fillStyle = o.skin; ctx.beginPath(); ctx.ellipse(x, ey, er + 2, er * 1.2 + 2, 0, Math.PI, TAU); ctx.fill(); ctx.strokeStyle = DARK; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x - er, ey); ctx.lineTo(x + er, ey); ctx.stroke(); }
    }
  }
  // lông mày
  ctx.strokeStyle = DARK; ctx.lineCap = 'round'; ctx.lineWidth = o.unibrow ? 10 : 6;
  const by = ey - er * 1.6;
  ctx.beginPath();

    // bóng + lửa
    const bx = 640 + Math.sin(u * 4) * 20, by = 380;
    if (v > 0.25) { const fl = clamp((v - 0.25) * 3); const gg = ctx.createLinearGradient(0, by, 0, by + 220 * fl); gg.addColorStop(0, 'rgba(255,220,80,.95)'); gg.addColorStop(1, 'rgba(255,60,0,0)'); ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(bx - 24, by + 5); ctx.lineTo(bx + Math.sin(u * 40) * 10, by + 220 * fl); ctx.lineTo(bx + 24, by + 5); ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(bx + i * 14, by + 30); ctx.lineTo(bx + i * 14, by + 120); ctx.stroke(); } }
    ball(bx, by, 30, u * 18);
    const km = Math.floor(Math.pow(v, 2.2) * 384400);
    rrect(860, 30, 390, 60, 10, 'rgba(0,0,0,.6)', '#ffd60a', 3);
    txt(`Độ cao bóng: ${km.toLocaleString('vi-VN')} km`, 1055, 60, 26, '#fff', null);
    lower(v < 0.5 ? 'Bóng đang rời khỏi sân vận động...' : 'Bóng đang rời khỏi tầng khí quyển...', 1, '#0b3d91');
    return;
  }
  // quay quanh Trái Đất
  const k = u - 6.4;
  ctx.fillStyle = '#02030f'; ctx.fillRect(0, 0, W, H);
  const R = rng(5); ctx.fillStyle = '#fff'; for (let i = 0; i < 200; i++) ctx.fillRect(R() * W, R() * H, 2, 2);
  const ex = 640, ey = 420;
  const gl = ctx.createRadialGradient(ex, ey, 150, ex, ey, 230); gl.addColorStop(0, 'rgba(100,180,255,.5)'); gl.addColorStop(1, 'rgba(100,180,255,0)'); ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  const a = k * 3;
  const ox = ex + Math.cos(a) * 300, oy = ey + Math.sin(a) * 90;
  const behind = Math.sin(a) < 0;
  if (behind) ball(ox, oy, 14, k * 10);
  ell(ex, ey, 180, 180, '#1e66d0', DARK, 4);
  ctx.save(); ctx.beginPath(); ctx.arc(ex, ey, 178, 0, TAU); ctx.clip();
  ctx.fillStyle = '#3fae49'; for (const [x, y, rx, ry] of [[-60, -60, 70, 45], [70, 20, 50, 80], [-40, 90, 40, 30], [10, -120, 60, 25]]) { ctx.beginPath(); ctx.ellipse(ex + x + k * 20, ey + y, rx, ry, 0.4, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.setLineDash([8, 10]); ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(ex, ey, 300, 90, 0, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  if (!behind) ball(ox, oy, 14, k * 10);
  popTxt('CHÍNH THỨC: Vệ tinh nhân tạo mới!', 640, 100, 44, k / 0.4, '#ffd60a');
  lower('NASA đặt tên: "Quả Penalty 2026"', (k - 0.5) / 0.4, '#0b3d91');
}

// ---------- CẢNH 5: Ăn mừng & tổng kết (27–34s) ----------
function scene5(u) {
  ctx.save(); camera(640, 360, 1, 0, u);
  stadium(u, { cheer: 0.6 });
  const k = clamp(u / 1.5), sx = lerp(220, 640, easeOut(k));
  guy(1060, 650, COACH, { flip: true, arms: 'hair', hairPull: true, face: 'angry', shout: true, t: u, s: 1.05 });
  guy(870, 650, DEFENDER, { flip: true, arms: 'face', face: 'sleep', t: u });
  guy(sx, 650 + (k < 1 ? 8 : 0), STRIKER, { arms: 'up', face: 'happy', t: u, rot: k < 1 ? -0.25 : Math.sin(u * 6) * 0.08, pose: k < 1 ? 'spread' : 'stand' });
  if (k < 1) dust(sx - 40, 650, u, 8);
  for (let i = 0; i < 8; i++) sparkle(sx + Math.cos(u * 2 + i * 0.8) * 130, 470 + Math.sin(u * 2.5 + i) * 110, 10 + (i % 3) * 4, u * 5 + i);
  ctx.restore();
  if (u < 3.8) {
    bubble(sx, 250, 'Tôi là huyền thoại!!!', sx, 330, (u - 0.8) / 0.3, 26);
    bubble(1020, 230, 'GHI BÀN ĐI CHỨ!!!', 1040, 300, (u - 1.4) / 0.3, 24);
    lower('Ăn mừng cuồng nhiệt... dù không ghi được bàn nào', (u - 1.8) / 0.4);
    scoreBug('90+52', 1);
  }
  if (u >= 3.8) {
    const a = clamp((u - 3.8) / 0.3);
    ctx.fillStyle = `rgba(8,10,25,${0.85 * a})`; ctx.fillRect(0, 0, W, H);
    popTxt('KẾT QUẢ CHUNG CUỘC: 0 - 0', 640, 110, 56, (u - 3.9) / 0.3, '#ffd60a');
    const lines = ['Thời gian bóng lăn: 4 phút', 'Thời gian ăn vạ: 86 phút', 'Thời gian xem VAR: 1 mùa giải', 'Số vòng xoay khi ngã: 7 (kỷ lục thế giới)', 'Quả bóng: vẫn đang bay quanh Trái Đất'];
    lines.forEach((s, i) => { const kk = clamp((u - 4.2 - i * 0.3) / 0.25); if (kk > 0) { ctx.globalAlpha = kk; txt(s, 640 + (1 - kk) * 60, 200 + i * 62, 32, '#fff', null, 'center', 800); ctx.globalAlpha = 1; } });
    if (u > 5.9) popTxt('HẾT!', 640, 580, 110, (u - 5.9) / 0.25, '#ff3b3b', '#fff', -0.12);
    if (u > 6.3) txt('* Nhân vật hư cấu. Mọi sự trùng hợp đều... rất có thể.', 640, 680, 18, '#aaa', null, 'center', 600);
  }
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 800);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (t < 4) scene1(t); else if (t < 13) scene2(t - 4); else if (t < 19) scene3(t - 13); else if (t < 27) scene4(t - 19); else scene5(t - 27);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  vignette();
  for (const b of [4, 13, 19, 27]) { const a = 1 - Math.abs(t - b) / 0.12; if (a > 0) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, 0, W, H); } }
}
window.render = render; window.DURATION = DURATION;

// Xem trực tiếp khi mở file trong trình duyệt (không có ?render)
if (!location.search.includes('render')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
