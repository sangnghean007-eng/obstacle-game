<!doctype html><html><body style="margin:0"><canvas id="c" width="900" height="1400"></canvas>
<script>
// Original Sergio Ramos caricature drawn in the editorial-cartoon style of the reference Short
// (flat colour, brown ink, rosy skin, exaggerated nose/teeth/neck). Not a copy of the artist's image.
const ctx = document.getElementById('c').getContext('2d');
const C = { line: '#3a1a0e', skin: '#f2b79c', skin2: '#e09a80', red: '#e8796b', hair: '#6e4a2c', hair2: '#9a6c43', hair3: '#4d321d',
  fade: '#b99c86', fade2: '#a48670', beard: '#7a4e2f', beard2: '#8f6040', white: '#fff', teeth: '#fffdf6', gum: '#6d1a1a', lip: '#d36a5f', shirt: '#f7f7f4', shirt2: '#dcdcd8', trim: '#f08a24' };
function spline(pts, closed = true) {
  const n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) { const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); }
  if (closed) ctx.closePath();
}
function shape(pts, fill, stroke, lw = 6, closed = true) { ctx.beginPath(); spline(pts, closed); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); } }
const line = (pts, c, w) => shape(pts, null, c, w, false);
function ell(x, y, rx, ry, fill, stroke, lw = 4, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
const mir = pts => pts.map(([x, y]) => [900 - x, y]);

window.go = async () => {
  // background (soft stadium blur feel)
  const g = ctx.createLinearGradient(0, 0, 0, 1400); g.addColorStop(0, '#efe6d6'); g.addColorStop(1, '#ddd2bf'); ctx.fillStyle = g; ctx.fillRect(0, 0, 900, 1400);
  for (let i = 0; i < 9; i++) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(60 + i * 95, 0, 34, 1400); }

  // shirt (plain white, orange collar trim, no brand stripes/crest)
  shape([[300, 1080], [190, 1120], [90, 1200], [40, 1400], [860, 1400], [820, 1210], [720, 1120], [600, 1080]], C.shirt, C.line, 7);
  shape([[600, 1100], [720, 1140], [800, 1230], [840, 1400], [700, 1400], [690, 1250]], C.shirt2, null);
  shape([[300, 1076], [450, 1130], [600, 1076], [612, 1100], [450, 1160], [288, 1100]], C.trim, C.line, 5);
  line([[230, 1250], [270, 1330]], 'rgba(120,120,120,.5)', 5); line([[640, 1240], [610, 1320]], 'rgba(120,120,120,.5)', 5);

  // long neck + Adam's apple + shadow
  shape([[372, 860], [366, 980], [356, 1120], [544, 1120], [534, 980], [528, 860]], C.skin, C.line, 6);
  shape([[372, 880], [450, 960], [528, 880], [532, 960], [450, 1030], [368, 960]], C.skin2, null);
  line([[438, 1000], [446, 1016], [452, 1030]], C.line, 3.5); line([[500, 1010], [520, 1040]], 'rgba(58,26,14,.5)', 3);

  // ears
  const EAR = [[262, 470], [228, 452], [208, 480], [210, 530], [226, 570], [254, 586], [270, 560]];
  shape(EAR, C.skin, C.line, 6); shape(mir(EAR), C.skin, C.line, 6);
  line([[250, 486], [230, 500], [232, 540], [250, 560]], C.red, 6); line([[650, 486], [670, 500], [668, 540], [650, 560]], C.red, 6);

  // long face
  const FACE = [[450, 250], [560, 262], [628, 320], [650, 420], [646, 520], [628, 620], [598, 720], [556, 800], [500, 860], [450, 878], [400, 860], [344, 800], [302, 720], [272, 620], [254, 520], [250, 420], [272, 320], [340, 262]];
  shape(FACE, C.skin, null);
  ctx.save(); ctx.beginPath(); spline(FACE); ctx.clip();
  ell(330, 520, 60, 40, 'rgba(232,121,107,.45)', null); ell(570, 520, 60, 40, 'rgba(232,121,107,.45)', null);   // rosy cheeks
  ell(450, 330, 110, 34, 'rgba(232,121,107,.25)', null);                                                         // forehead flush
  shape([[272, 360], [312, 380], [300, 520], [290, 640], [262, 520]], C.skin2, null); shape(mir([[272, 360], [312, 380], [300, 520], [290, 640], [262, 520]]), C.skin2, null);
  // frown wrinkles
  line([[430, 380], [436, 420]], 'rgba(58,26,14,.5)', 3.5); line([[470, 380], [464, 420]], 'rgba(58,26,14,.5)', 3.5);
  ctx.restore();

  // full beard (solid brown mass, clean edges, inner strokes)
  const BEARD = [[256, 520], [268, 620], [300, 720], [344, 800], [400, 860], [450, 880], [500, 860], [556, 800], [600, 720], [632, 620], [644, 520], [624, 560], [596, 640], [556, 690], [520, 700], [500, 670], [450, 660], [400, 670], [380, 700], [344, 690], [304, 640], [276, 560]];
  shape(BEARD, C.beard, C.line, 5);
  ctx.save(); ctx.beginPath(); spline(BEARD); ctx.clip();
  for (let i = 0; i < 38; i++) { const x = 290 + (i * 97) % 330, y = 690 + (i * 53) % 170; line([[x, y], [x + 4, y + 22]], C.beard2, 4); }
  ctx.restore();
  // mustache
  shape([[360, 640], [400, 616], [450, 622], [500, 616], [540, 640], [520, 656], [480, 646], [450, 652], [420, 646], [380, 656]], C.beard, C.line, 4);

  // big grin with two oversized front teeth
  const M = [[372, 668], [410, 660], [450, 664], [490, 660], [528, 668], [512, 712], [450, 732], [388, 712]];
  shape(M, C.gum, null);
  ctx.save(); ctx.beginPath(); spline(M); ctx.clip();
  ctx.fillStyle = C.teeth; ctx.fillRect(360, 650, 180, 40);
  shape([[410, 658], [448, 658], [448, 724], [412, 718]], C.teeth, C.line, 3); shape([[452, 658], [490, 658], [488, 718], [452, 724]], C.teeth, C.line, 3);
  ctx.restore();
  shape(M, null, C.line, 5);
  line([[392, 722], [450, 742], [508, 722]], C.lip, 8);

  // long nose with red bulbous tip
  shape([[432, 410], [430, 500], [414, 556], [400, 586], [412, 608], [436, 612], [450, 620], [464, 612], [488, 608], [500, 586], [486, 556], [470, 500], [468, 410]], C.skin, null);
  ell(450, 590, 44, 34, C.red, null);
  line([[432, 412], [428, 500], [412, 556]], C.line, 4.5);
  line([[404, 572], [392, 590], [404, 612], [430, 614]], C.line, 5); line([[496, 572], [508, 590], [496, 612], [470, 614]], C.line, 5);
  line([[430, 614], [450, 622], [470, 614]], C.line, 4);
  ell(462, 578, 10, 7, 'rgba(255,240,230,.85)', null);

  // eyes: small whites, big black pupils (style), angry hooded lids
  for (const [cx, d] of [[372, -1], [528, 1]]) {
    shape([[cx - 34, 470], [cx - 8, 456], [cx + 22, 458], [cx + 36, 472], [cx + 10, 486], [cx - 20, 484]], C.white, C.line, 4);
    ell(cx - d * 4, 472, 15, 15, '#141010', null); ell(cx - d * 4 - 5, 466, 4, 4, '#fff', null);
    line([[cx - 36, 466 - (d < 0 ? 0 : 10)], [cx, 456], [cx + 36, 466 - (d < 0 ? 10 : 0)]], C.line, 7);   // heavy lid
  }
  // thick angry brows (V shape)
  shape([[300, 420], [350, 404], [408, 418], [436, 446], [426, 456], [394, 438], [348, 428], [306, 432]], C.hair3, C.line, 3);
  shape(mir([[300, 420], [350, 404], [408, 418], [436, 446], [426, 456], [394, 438], [348, 428], [306, 432]]), C.hair3, C.line, 3);

  // hair: undercut fade on the sides + swept-back volume on top
  shape([[262, 470], [252, 380], [268, 300], [300, 260], [330, 300], [320, 400], [288, 460]], C.fade, null);
  shape(mir([[262, 470], [252, 380], [268, 300], [300, 260], [330, 300], [320, 400], [288, 460]]), C.fade, null);
  for (const x of [270, 286, 302]) { line([[x, 300], [x - 6, 440]], C.fade2, 3); line([[900 - x, 300], [906 - x, 440]], C.fade2, 3); }
  const TOP = [[262, 300], [270, 220], [312, 160], [380, 120], [460, 104], [540, 112], [608, 146], [652, 200], [662, 262], [640, 300], [600, 280], [540, 272], [470, 280], [400, 270], [340, 282], [296, 312]];
  shape(TOP, C.hair, C.line, 7);
  ctx.save(); ctx.beginPath(); spline(TOP); ctx.clip();
  for (const [a, b, c] of [[[300, 260], [400, 160], [520, 130]], [[330, 280], [440, 190], [580, 160]], [[400, 270], [500, 210], [630, 210]], [[300, 230], [360, 150], [460, 120]]])
    { line([a, b, c], C.hair2, 9); line([[a[0] + 10, a[1] + 14], [b[0] + 10, b[1] + 14], [c[0] + 6, c[1] + 16]], C.hair3, 4); }
  ctx.restore();
  shape(TOP, null, C.line, 7);
  // face contour ink
  shape(FACE.slice(3, 16), null, C.line, 7, false);
  // signature-free caption
  ctx.font = '900 54px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#2b2b2b'; ctx.fillText('SERGIO RAMOS', 450, 70);
};
</script></body></html>
