<!doctype html><html><body style="margin:0"><canvas id="c" width="900" height="1700"></canvas>
<script>
// Original Sergio Ramos caricature in an editorial-cartoon style (flat colour, brown ink with
// varying weight, rosy skin, long face & neck, red nose tip, big front teeth). Not a copy of any artist's image.
const ctx = document.getElementById('c').getContext('2d');
const C = { line: '#3a1a0e', skin: '#f3b69b', skin2: '#e39b80', red: '#e7766a', hair: '#6c4729', hair2: '#9c6d42', hair3: '#47301b',
  fade: '#bca28c', fade2: '#a68a74', beard: '#7b4d2d', beard2: '#94623e', white: '#fff', teeth: '#fffdf6', gum: '#6d1a1a', lipU: '#c9655a', lipL: '#e0857a', shirt: '#f7f7f4', shirt2: '#dcdcd8', trim: '#f08a24' };
function spline(pts, closed = true) {
  const n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) { const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); }
  if (closed) ctx.closePath();
}
function shape(pts, fill, stroke, lw = 6, closed = true) { ctx.beginPath(); spline(pts, closed); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); } }
const line = (pts, c, w) => shape(pts, null, c, w, false);
// hand-drawn feel: ink line whose width swells in the middle and tapers at the ends
function ink(pts, w0, w1, col = C.line) {
  const n = 24; const sm = []; ctx.save(); ctx.beginPath(); spline(pts, false); ctx.restore();
  for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < n; k++) { const t = k / n, a = pts[i], b = pts[i + 1]; sm.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  sm.push(pts[pts.length - 1]);
  for (let i = 0; i < sm.length - 1; i++) { const u = i / (sm.length - 1), w = w0 + (w1 - w0) * Math.sin(Math.PI * u);
    ctx.beginPath(); ctx.moveTo(sm[i][0], sm[i][1]); ctx.lineTo(sm[i + 1][0], sm[i + 1][1]); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, stroke, lw = 4, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
const mir = pts => pts.map(([x, y]) => [900 - x, y]);

window.go = async () => {
  // Proportions measured on a CC BY 3.0 reference photo (Ramos, interview 2021): photo (x,y) -> canvas
  // via x' = 450 + (x-240)*2.6, y' = 250 + (y-90)*2.6, then exaggerated (longer beard & neck, bigger nose/teeth).
  ctx.canvas.height = 1700;
  const g = ctx.createLinearGradient(0, 0, 0, 1700); g.addColorStop(0, '#efe6d6'); g.addColorStop(1, '#ddd2bf'); ctx.fillStyle = g; ctx.fillRect(0, 0, 900, 1700);
  for (let i = 0; i < 9; i++) { ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(60 + i * 95, 0, 34, 1700); }
  const K = { skin: '#efb293', skin2: '#d9927a', hair: '#3f2717', hair2: '#6e4a30', beard: '#8b4f2b', beard2: '#a8653a', beard3: '#6c3a1f' };

  // shirt: dark open collar over white tee (as in the reference photo), no logos
  shape([[372, 1450], [240, 1490], [120, 1560], [60, 1700], [840, 1700], [780, 1560], [660, 1490], [528, 1450]], '#3a3a3e', C.line, 7);
  shape([[392, 1452], [450, 1640], [508, 1452]], '#f7f7f4', C.line, 5);
  shape([[372, 1450], [430, 1600], [392, 1452]], '#2a2a2e', C.line, 5); shape([[528, 1450], [470, 1600], [508, 1452]], '#2a2a2e', C.line, 5);

  // long neck
  shape([[404, 1100], [398, 1300], [392, 1470], [508, 1470], [502, 1300], [496, 1100]], K.skin, null);
  shape([[404, 1150], [450, 1220], [496, 1150], [500, 1240], [450, 1290], [400, 1240]], K.skin2, null);
  ink([[402, 1150], [398, 1300], [392, 1460]], 4, 8); ink([[498, 1150], [502, 1300], [508, 1460]], 4, 8);

  // ears (+ small hoop in the right ear)
  const EAR = [[196, 500], [160, 486], [140, 520], [146, 590], [166, 650], [196, 676], [212, 640]];
  shape(EAR, K.skin, C.line, 5); shape(mir(EAR), K.skin, C.line, 5);
  line([[186, 520], [164, 540], [168, 610], [188, 640]], C.red, 7); line([[714, 520], [736, 540], [732, 610], [712, 640]], C.red, 7);
  ell(728, 690, 9, 9, null, '#c9c9c9', 4);

  // head: tall forehead, wide cheekbones, long bearded jaw
  const FACE = [[450, 220], [580, 232], [668, 290], [708, 400], [716, 520], [706, 640], [680, 760], [600, 860], [450, 900], [300, 860], [220, 760], [194, 640], [184, 520], [192, 400], [232, 290], [320, 232]];
  shape(FACE, K.skin, null);
  ctx.save(); ctx.beginPath(); spline(FACE); ctx.clip();
  ell(450, 340, 160, 50, 'rgba(231,118,106,.25)', null);                                    // rosy forehead
  ell(300, 600, 64, 40, 'rgba(231,118,106,.45)', null); ell(600, 600, 64, 40, 'rgba(231,118,106,.45)', null);
  shape([[196, 420], [240, 440], [236, 600], [220, 700], [196, 600]], K.skin2, null); shape(mir([[196, 420], [240, 440], [236, 600], [220, 700], [196, 600]]), K.skin2, null);
  ink([[300, 330], [450, 316], [600, 330]], 1.5, 3, 'rgba(58,26,14,.4)'); ink([[320, 372], [450, 360], [580, 372]], 1.5, 3, 'rgba(58,26,14,.4)');  // forehead lines
  ctx.restore();

  // long full beard (dominant feature) with mustache, chin extended for caricature
  const BEARD = [[188, 560], [196, 680], [214, 800], [250, 920], [310, 1030], [380, 1110], [450, 1150], [520, 1110], [590, 1030], [650, 920], [686, 800], [704, 680], [712, 560], [690, 640], [650, 690], [600, 700], [560, 690], [500, 684], [450, 690], [400, 684], [340, 690], [300, 700], [250, 690], [210, 640]];
  shape(BEARD, K.beard, null);
  ctx.save(); ctx.beginPath(); spline(BEARD); ctx.clip();
  for (const [x0, w] of [[250, 1], [310, 1], [370, 1], [430, 1], [490, -1], [550, -1], [610, -1], [660, -1]]) ink([[x0, 760], [x0 + w * 10, 880], [x0 + w * 30, 1000]], 2, 6, K.beard2);
  for (const [x0, w] of [[280, 1], [400, 1], [520, -1], [630, -1]]) ink([[x0, 820], [x0 + w * 14, 940], [x0 + w * 36, 1060]], 2, 5, K.beard3);
  ctx.restore();
  ink([[188, 560], [196, 680], [214, 800], [250, 920], [310, 1030], [380, 1110], [450, 1150], [520, 1110], [590, 1030], [650, 920], [686, 800], [704, 680], [712, 560]], 4, 11);
  // mustache flowing into the beard
  shape([[330, 742], [380, 712], [450, 708], [520, 712], [570, 742], [590, 790], [548, 768], [500, 752], [450, 756], [400, 752], [352, 768], [310, 790]], K.beard, C.line, 4);

  // grin: thin upper lip, fuller lower lip, two oversized front teeth
  const M = [[350, 778], [400, 768], [450, 772], [500, 768], [550, 778], [530, 822], [450, 842], [370, 822]];
  shape([[340, 774], [400, 760], [450, 766], [500, 760], [560, 774], [548, 838], [450, 870], [352, 838]], '#dc8576', C.line, 4);
  shape(M, C.gum, null);
  ctx.save(); ctx.beginPath(); spline(M); ctx.clip();
  ctx.fillStyle = C.teeth; ctx.fillRect(340, 762, 220, 34);
  shape([[410, 766], [448, 766], [448, 836], [412, 830]], C.teeth, C.line, 3); shape([[452, 766], [490, 766], [488, 830], [452, 836]], C.teeth, C.line, 3);
  ctx.restore(); shape(M, null, C.line, 4);

  // nose: long straight bridge, wide base (205..285 in the photo), red tip
  shape([[430, 470], [426, 580], [404, 640], [376, 666], [388, 696], [420, 700], [450, 712], [480, 700], [512, 696], [524, 666], [496, 640], [474, 580], [470, 470]], K.skin, null);
  ell(450, 676, 52, 38, C.red, null);
  ink([[432, 474], [426, 580], [404, 642]], 2.5, 5.5);
  ink([[386, 654], [368, 680], [384, 704], [420, 706]], 3, 6.5); ink([[514, 654], [532, 680], [516, 704], [480, 706]], 3, 6.5);
  ink([[420, 706], [450, 716], [480, 706]], 2, 4);
  ell(466, 660, 11, 8, 'rgba(255,240,230,.85)', null);

  // eyes at the measured spots (341,502) and (541,502), looking sideways like the photo; black pupils
  for (const cx of [341, 541]) {
    shape([[cx - 46, 504], [cx - 14, 486], [cx + 26, 488], [cx + 48, 504], [cx + 14, 520], [cx - 22, 518]], C.white, null);
    ell(cx + 12, 504, 17, 17, '#141010', null); ell(cx + 6, 497, 5, 5, '#fff', null);
    ink([[cx - 50, 502], [cx - 10, 482], [cx + 34, 486], [cx + 52, 500]], 4, 9);
    ink([[cx - 30, 520], [cx + 20, 522]], 1, 2.5); ink([[cx - 36, 538], [cx + 30, 540]], 1, 2.5, 'rgba(58,26,14,.4)');
  }
  // brows: thick, slightly arched, measured at y~453
  const BR = [[256, 470], [300, 446], [360, 438], [412, 452], [420, 466], [362, 458], [304, 464], [262, 480]];
  shape(BR, K.hair, C.line, 3); shape(mir(BR), K.hair, C.line, 3);

  // slicked-back hair (2021 look): tight cap, comb lines running back, high hairline
  const HAIR = [[190, 410], [196, 300], [240, 200], [320, 140], [450, 116], [580, 140], [660, 200], [704, 300], [710, 410], [680, 330], [640, 290], [560, 262], [450, 252], [340, 262], [260, 290], [220, 330]];
  shape(HAIR, K.hair, null);
  ctx.save(); ctx.beginPath(); spline(HAIR); ctx.clip();
  for (const k of [-0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75]) ink([[450 + k * 260, 262], [450 + k * 220, 180], [450 + k * 120, 116]], 2, 6, K.hair2);
  ctx.restore();
  ink([[190, 410], [196, 300], [240, 200], [320, 140], [450, 116], [580, 140], [660, 200], [704, 300], [710, 410]], 4, 10);
  ink([[194, 520], [194, 560]], 3, 6); ink([[706, 520], [706, 560]], 3, 6);
  ctx.font = '900 54px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#2b2b2b'; ctx.fillText('SERGIO RAMOS', 450, 70);
};
</script></body></html>
