<!doctype html><html><body style="margin:0"><canvas id="c" width="900" height="1900"></canvas>
<script>
// Original Sergio Ramos caricature in an editorial-cartoon style (flat colour, brown ink with
// varying weight, rosy skin, long face & neck, red nose tip, big front teeth). Not a copy of any artist's image.
const ctx = document.getElementById('c').getContext('2d');
const C = { line: '#3a1a0e', skin: '#f3b69b', skin2: '#e39b80', red: '#e7766a', hair: '#6c4729', hair2: '#9c6d42', hair3: '#47301b',
  fade: '#bca28c', fade2: '#a68a74', beard: '#7b4d2d', beard2: '#94623e', white: '#fff', teeth: '#fffdf6', gum: '#6d1a1a', lipU: '#c9655a', lipL: '#e0857a', shirt: '#f7f7f4', shirt2: '#dcdcd8', trim: '#f08a24' };
function spline(pts, closed = true) {
  const n = pts.length, P = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) { const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); }
  if (closed) ctx.closePath();
}
function shape(pts, fill, stroke, lw = 6, closed = true) { ctx.beginPath(); spline(pts, closed); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); } }
const line = (pts, c, w) => shape(pts, null, c, w, false);
// hand-drawn feel: ink line whose width swells in the middle and tapers at the ends
function ink(pts, w0, w1, col = C.line) {
  const n = 24; const sm = []; ctx.save(); ctx.beginPath(); spline(pts, false); ctx.restore();
  for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < n; k++) { const t = k / n, a = pts[i], b = pts[i + 1]; sm.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  sm.push(pts[pts.length - 1]);
  for (let i = 0; i < sm.length - 1; i++) { const u = i / (sm.length - 1), w = w0 + (w1 - w0) * Math.sin(Math.PI * u);
    ctx.beginPath(); ctx.moveTo(sm[i][0], sm[i][1]); ctx.lineTo(sm[i + 1][0], sm[i + 1][1]); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, stroke, lw = 4, r = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
const mir = pts => pts.map(([x, y]) => [900 - x, y]);

window.go = async () => {
  // Playing-era look (Real Madrid ~2016). Landmarks measured on "Sergio Ramos entrenando (cropped)1.jpg"
  // (CC BY-SA 4.0, Wikimedia Commons), 3/4 view. Photo px -> canvas via F(), lower face stretched for caricature.
  const Wd = 900, Hd = 1900; ctx.canvas.height = Hd;
  const F = (x, y) => { let X = 450 + (x - 480) * 1.75, Y = 170 + (y - 130) * 1.75; if (Y > 922) Y += (Y - 922) * 0.3; return [X, Y]; };
  const P = pts => pts.map(([x, y]) => F(x, y));
  const g = ctx.createLinearGradient(0, 0, 0, Hd); g.addColorStop(0, '#efe6d6'); g.addColorStop(1, '#ddd2bf'); ctx.fillStyle = g; ctx.fillRect(0, 0, Wd, Hd);
  for (let i = 0; i < 9; i++) { ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(60 + i * 95, 0, 34, Hd); }
  const K = { skin: '#f0b496', skin2: '#d9937a', hair: '#5e3d24', hair2: '#9a7148', hair3: '#3b2616', fade: '#7d6250', fade2: '#665040', beard: '#8a5631', beard2: '#a8703f', beard3: '#6a3d20' };

  // white kit (plain, no crest/brand marks), high collar
  shape([[300, 1660], [180, 1700], [80, 1780], [40, 1900], [860, 1900], [820, 1780], [720, 1700], [560, 1660]], C.shirt, C.line, 7);
  shape([[600, 1680], [720, 1720], [800, 1800], [830, 1900], [700, 1900], [680, 1790]], C.shirt2, null);
  shape([[296, 1656], [420, 1700], [566, 1656], [580, 1684], [420, 1732], [282, 1684]], '#e9e9e4', C.line, 5);

  // long neck (3/4: slanted)
  shape([[330, 1380], [326, 1520], [318, 1680], [530, 1680], [548, 1500], [560, 1240]], K.skin, null);
  shape([[330, 1400], [420, 1480], [556, 1300], [552, 1460], [430, 1560], [326, 1480]], K.skin2, null);
  ink([[330, 1390], [326, 1520], [318, 1670]], 4, 8); ink([[560, 1250], [548, 1500], [530, 1670]], 4, 8);
  ink([[400, 1560], [414, 1578], [430, 1566]], 2, 4);

  // big ear on the far side (measured 610..705, 440..600)
  const EAR = P([[612, 452], [660, 440], [700, 480], [705, 540], [682, 590], [640, 602], [618, 560]]);
  shape(EAR, K.skin, C.line, 6);
  line(P([[630, 470], [668, 470], [684, 520], [672, 566], [648, 576]]), C.red, 8);
  ink(P([[644, 486], [664, 500], [662, 540], [648, 556]]), 2, 4);

  // head & face (near contour on the left, jaw on the right)
  const FACE = P([[300, 250], [275, 300], [268, 400], [270, 470], [285, 540], [300, 620], [320, 720], [350, 790], [400, 806], [470, 782], [530, 700], [570, 600], [600, 500], [620, 420], [640, 300], [560, 230], [430, 225]]);
  shape(FACE, K.skin, null);
  ctx.save(); ctx.beginPath(); spline(FACE); ctx.clip();
  const [cx1, cy1] = F(420, 520); ell(cx1 + 60, cy1, 70, 46, 'rgba(231,118,106,.42)', null);     // far cheek flush
  const [cx2, cy2] = F(290, 500); ell(cx2, cy2, 40, 44, 'rgba(231,118,106,.38)', null);          // near cheek
  const [fx, fy] = F(400, 340); ell(fx, fy, 140, 46, 'rgba(231,118,106,.25)', null);              // forehead
  shape(P([[520, 300], [600, 320], [620, 440], [590, 560], [540, 520], [520, 420]]), K.skin2, null);   // side plane
  ink(P([[372, 330], [378, 352]]), 2, 4); ink(P([[400, 326], [404, 350]]), 2, 4);                    // frown lines
  ctx.restore();

  // beard: jaw line, chin and mustache in one mass (measured), with inner strokes
  const BEARD = P([[285, 530], [300, 620], [320, 720], [350, 790], [400, 806], [470, 782], [530, 700], [570, 600], [585, 500], [565, 520], [540, 580], [500, 620], [460, 640], [450, 612], [420, 596], [370, 590], [330, 600], [306, 580]]);
  shape(BEARD, K.beard, null);
  ctx.save(); ctx.beginPath(); spline(BEARD); ctx.clip();
  for (let i = 0; i < 12; i++) { const [x, y] = F(320 + i * 22, 640 + (i % 3) * 30); ink([[x, y], [x + 10, y + 70], [x + 26, y + 140]], 2, 6, i % 2 ? K.beard2 : K.beard3); }
  ctx.restore();
  ink(P([[285, 530], [300, 620], [320, 720], [350, 790], [400, 806], [470, 782], [530, 700], [570, 600], [585, 500]]), 4, 11);

  // open grin (photo shows an open mouth) with two oversized front teeth
  const M = P([[328, 630], [356, 622], [390, 622], [422, 630], [414, 656], [378, 670], [342, 660]]);
  shape(P([[318, 626], [356, 612], [392, 614], [432, 626], [424, 664], [378, 684], [334, 670]]), '#dc8576', C.line, 4);
  shape(M, C.gum, null);
  ctx.save(); ctx.beginPath(); spline(M); ctx.clip();
  const [tx, ty] = F(340, 610); ctx.fillStyle = C.teeth; ctx.fillRect(tx - 40, ty, 260, 40);
  const [ax, ay] = F(356, 622); shape([[ax, ay], [ax + 34, ay], [ax + 34, ay + 58], [ax + 2, ay + 54]], C.teeth, C.line, 3);
  shape([[ax + 38, ay], [ax + 72, ay], [ax + 70, ay + 54], [ax + 38, ay + 58]], C.teeth, C.line, 3);
  ctx.restore(); shape(M, null, C.line, 4);

  // nose: long straight bridge from the brow down-left to a big round red tip (3/4 view)
  shape(P([[396, 430], [384, 480], [362, 520], [330, 540], [300, 556], [304, 580], [334, 590], [362, 586], [388, 590], [408, 572], [416, 520], [414, 460]]), K.skin, null);
  const [nx, ny] = F(322, 566); ell(nx, ny, 46, 36, C.red, null);
  ink(P([[396, 432], [386, 480], [366, 516], [334, 540], [306, 552]]), 3, 7);
  ink(P([[300, 560], [306, 584], [334, 592], [356, 584]]), 3, 6);
  ink(P([[372, 576], [394, 588], [410, 570]]), 3, 6);
  const [hx, hy] = F(316, 556); ell(hx, hy, 11, 7, 'rgba(255,240,230,.85)', null);

  // eyes (near & far), black pupils looking left like the photo, heavy lids
  for (const [ex0, ey0, w] of [[300, 456, 44], [436, 448, 56]]) {
    const [cx, cy] = F(ex0, ey0), ww = w * 0.9;
    shape([[cx - ww, cy + 2], [cx - ww * 0.3, cy - 16], [cx + ww * 0.5, cy - 14], [cx + ww, cy + 2], [cx + ww * 0.3, cy + 16], [cx - ww * 0.5, cy + 14]], C.white, null);
    ell(cx - ww * 0.35, cy, 16, 16, '#141010', null); ell(cx - ww * 0.35 - 5, cy - 6, 4.5, 4.5, '#fff', null);
    ink([[cx - ww - 4, cy], [cx - ww * 0.2, cy - 22], [cx + ww * 0.6, cy - 18], [cx + ww + 4, cy - 2]], 4, 9);
    ink([[cx - ww * 0.6, cy + 18], [cx + ww * 0.5, cy + 18]], 1, 2.5);
  }
  // thick brows (measured): near 262..332 @ 405-425, far 360..470 @ 395-410
  shape(P([[262, 412], [296, 398], [334, 404], [336, 420], [298, 418], [266, 426]]), K.hair3, C.line, 3);
  shape(P([[360, 404], [410, 388], [470, 394], [480, 410], [418, 406], [364, 420]]), K.hair3, C.line, 3);

  // hair: faded undercut on the side + big swept-back quiff (measured silhouette)
  const FADE = P([[520, 290], [600, 270], [690, 300], [700, 380], [680, 440], [620, 440], [580, 500], [560, 470], [540, 380]]);
  shape(FADE, K.fade, null);
  ctx.save(); ctx.beginPath(); spline(FADE); ctx.clip();
  for (let i = 0; i < 7; i++) { const [x, y] = F(540 + i * 22, 300); ink([[x, y], [x + 6, y + 220]], 1, 3, K.fade2); }
  ctx.restore();
  const QUIFF = P([[275, 250], [290, 180], [330, 140], [400, 120], [480, 118], [560, 138], [640, 190], [700, 262], [700, 300], [640, 286], [580, 282], [520, 290], [460, 300], [400, 300], [340, 290], [300, 276]]);
  shape(QUIFF, K.hair, null);
  ctx.save(); ctx.beginPath(); spline(QUIFF); ctx.clip();
  for (const k of [0, 1, 2, 3, 4, 5]) { const a = F(300 + k * 30, 280 - k * 4), b = F(380 + k * 40, 170 + k * 6), c = F(520 + k * 36, 160 + k * 22);
    ink([a, b, c], 2, 10, K.hair2); ink([[a[0] + 10, a[1] + 14], [b[0] + 10, b[1] + 14], [c[0] + 6, c[1] + 14]], 1, 4, K.hair3); }
  ctx.restore();
  ink(P([[275, 250], [290, 180], [330, 140], [400, 120], [480, 118], [560, 138], [640, 190], [700, 262], [700, 300]]), 4, 11);
  ink(P([[700, 300], [700, 380], [680, 440]]), 3, 6);
  // near face contour ink
  ink(P([[275, 300], [268, 400], [270, 470], [285, 540]]), 4, 9);
  ctx.font = '900 54px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#2b2b2b'; ctx.fillText('SERGIO RAMOS', 450, 70);
};
</script></body></html>
