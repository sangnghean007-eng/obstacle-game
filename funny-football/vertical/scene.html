<!doctype html>
<html><head><meta charset="utf-8"><title>The Rolling King</title>
<style>html,body{margin:0;background:#000}canvas{display:block;max-height:100vh;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="neymar-head.js"></script>
<script>
const NEY_IMG = new Image(); NEY_IMG.src = window.NEY_HEAD; window.NEY_IMG = NEY_IMG;
// "THE ROLLING KING" — vertical 9:16 satirical cartoon short, based on real reported facts
// about Neymar at the 2018 World Cup. Everything is drawn on Canvas, rendered as a function of t (seconds).
const W = 1080, H = 1920, DURATION = 42;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const F = 'Inter, "DejaVu Sans", sans-serif';
const DARK = '#151515';
const GROUND = 1540;

// ---------- utilities ----------
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = k => (k = clamp(k), k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
const TAU = Math.PI * 2;

function ell(x, y, rx, ry, fill, stroke = DARK, lw = 4, rot = 0) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function rrect(x, y, w, h, r, fill, stroke = DARK, lw = 4) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function limb(x1, y1, x2, y2, color, w = 8) {
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = DARK; ctx.lineWidth = w + 6; ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
}
function txt(s, x, y, size, fill = '#fff', stroke = DARK, align = 'center', weight = 900) {
  ctx.font = `${weight} ${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = Math.max(4, size * 0.2); ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function popTxt(s, x, y, size, k, fill = '#fff', stroke = DARK, rot = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc);
  txt(s, 0, 0, size, fill, stroke); ctx.restore();
}
function bubble(x, y, s, tx, ty, k, size = 40) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(tx, ty); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc); ctx.translate(-tx, -ty);
  ctx.font = `800 ${size}px ${F}`;
  const w = ctx.measureText(s).width + 50, h = size + 40;
  ctx.beginPath(); ctx.moveTo(x - 24, y + h / 2 - 4); ctx.lineTo(tx, ty); ctx.lineTo(x + 24, y + h / 2 - 4); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke();
  rrect(x - w / 2, y - h / 2, w, h, 26, '#fff', DARK, 5);
  ctx.beginPath(); ctx.moveTo(x - 19, y + h / 2 - 3); ctx.lineTo(x + 19, y + h / 2 - 3); ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.stroke();
  txt(s, x, y + 1, size, DARK, null, 'center', 800);
  ctx.restore();
}
function burst(x, y, r, s, k, fill = '#ffd60a', size = 70, rot = 0) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc);
  ctx.beginPath();
  for (let i = 0; i < 32; i++) { const a = i / 32 * TAU, rr = i % 2 ? r * 0.7 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.7); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#c1121f'; ctx.stroke();
  txt(s, 0, 2, size, '#c1121f', '#fff');
  ctx.restore();
}
// Shorts-style caption: big bold lines, one word/phrase highlighted
function caption(lines, y, k, size = 66, hl = '#ffd60a') {
  if (k <= 0) return;
  const sc = easeOutBack(clamp(k));
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc);
  lines.forEach((ln, i) => {
    const yy = (i - (lines.length - 1) / 2) * size * 1.18;
    const hot = ln.startsWith('*');
    txt(hot ? ln.slice(1) : ln, 0, yy, size, hot ? hl : '#fff', DARK);
  });
  ctx.restore();
}
// Real-fact card at the top: date chip + headline
function factCard(chip, lines, k, color = '#0b3d91') {
  if (k <= 0) return;
  const y = lerp(-260, 150, easeOut(k));
  ctx.save();
  const h = 70 + lines.length * 58;
  rrect(60, y, 960, h, 26, 'rgba(10,14,30,.88)', color, 6);
  ctx.font = `900 32px ${F}`; const cw = ctx.measureText(chip).width + 44;
  rrect(540 - cw / 2, y - 26, cw, 52, 26, '#ffd60a', DARK, 4);
  txt(chip, 540, y, 32, DARK, null);
  lines.forEach((ln, i) => txt(ln, 540, y + 64 + i * 58, 44, '#fff', null, 'center', 800));
  rrect(820, y + h - 22, 180, 40, 20, '#16a34a', DARK, 3); txt('REAL FACT', 910, y + h - 2, 22, '#fff', null);
  ctx.restore();
}

// ---------- stadium ----------
const crowd = []; {
  const R = rng(21);
  const cols = ['#ffdf00', '#16a34a', '#1e40af', '#ffffff', '#ffdf00', '#d62828', '#16a34a'];
  const skins = ['#f1c27d', '#e0ac69', '#c68642', '#ffdbac', '#8d5524'];
  for (let row = 0; row < 22; row++) {
    const y = 470 + row * 24;
    for (let x = -10; x < W + 10; x += 16 + R() * 5)
      crowd.push({ x: x + (row % 2) * 8, y, c: cols[Math.floor(R() * cols.length)], sk: skins[Math.floor(R() * skins.length)], ph: R() * TAU, r: 6 + row * 0.2 });
  }
}
function sky() {
  const g = ctx.createLinearGradient(0, 0, 0, 470);
  g.addColorStop(0, '#081230'); g.addColorStop(1, '#25447a');
  ctx.fillStyle = g; ctx.fillRect(-300, -300, W + 600, 800);
  const R = rng(3); ctx.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 70; i++) ctx.fillRect(R() * W, R() * 400, 2, 2);
}
function lights() {
  for (const x of [110, 970]) {
    ctx.fillStyle = '#555'; ctx.fillRect(x - 6, 120, 12, 330);
    rrect(x - 55, 70, 110, 60, 5, '#ddd', DARK, 3);
    const g = ctx.createRadialGradient(x, 100, 5, x, 100, 230);
    g.addColorStop(0, 'rgba(255,255,220,.85)'); g.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 230, -130, 460, 460);
  }
}
function stands(t, cheer = 0.6) {
  ctx.fillStyle = '#2b2f3a'; ctx.fillRect(-300, 440, W + 600, 560);
  for (let r = 0; r < 22; r++) { ctx.fillStyle = r % 2 ? '#323745' : '#2d313d'; ctx.fillRect(-300, 470 + r * 24 - 8, W + 600, 24); }
  for (const p of crowd) {
    const bob = -Math.abs(Math.sin(t * 9 + p.ph)) * 7 * cheer;
    ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r, p.y + bob, p.r * 2, p.r * 2 + 4);
    ctx.beginPath(); ctx.arc(p.x, p.y - 2 + bob, p.r * 0.8, 0, TAU); ctx.fillStyle = p.sk; ctx.fill();
  }
  const banners = [['GET UP!!', 230, 560, '#ffd60a'], ['NEYMAR CHALLENGE ✓', 640, 700, '#ffffff'], ['10/10 ACTING', 300, 860, '#ffd60a']];
  for (const [s, x, y, c] of banners) {
    ctx.save(); ctx.translate(x, y + Math.sin(t * 4 + x) * 4); ctx.rotate(Math.sin(x) * 0.05);
    ctx.font = `900 30px ${F}`; const w = ctx.measureText(s).width + 34;
    rrect(-w / 2, -24, w, 48, 4, c, DARK, 3); txt(s, 0, 0, 30, '#c1121f', null); ctx.restore();
  }
  const ads = ['INSTANT NOODLES', 'ROLL INSURANCE', 'VAR PLEASE', 'ANKLE SPRAY'];
  for (let i = 0; i < 5; i++) {
    const x = -100 + i * 300;
    ctx.fillStyle = i % 2 ? '#0b3d91' : '#c1121f'; ctx.fillRect(x, 995, 300, 50);
    txt(ads[i % ads.length], x + 150, 1020, 24, '#fff', null, 'center', 900);
  }
  ctx.fillStyle = '#111'; ctx.fillRect(-300, 1043, W + 600, 5);
}
function pitch() {
  ctx.fillStyle = '#2f8f3c'; ctx.fillRect(-300, 1048, W + 600, H);
  for (let i = -8; i <= 8; i += 2) {
    const b0 = W / 2 + i * 170, b1 = b0 + 170, k = 0.5;
    ctx.beginPath(); ctx.moveTo(W / 2 + (b0 - W / 2) * k, 1048); ctx.lineTo(W / 2 + (b1 - W / 2) * k, 1048);
    ctx.lineTo(b1 + (b1 - W / 2) * 0.5, H + 300); ctx.lineTo(b0 + (b0 - W / 2) * 0.5, H + 300); ctx.closePath();
    ctx.fillStyle = '#38a346'; ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-300, 1070); ctx.lineTo(W + 300, 1070); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(W / 2, 1420, 360, 120, 0, 0, TAU); ctx.stroke();
}
function stadium(t, cheer) { sky(); lights(); stands(t, cheer); pitch(); }
function dim(a) { ctx.fillStyle = `rgba(5,8,20,${a})`; ctx.fillRect(-300, -300, W + 600, H + 600); }

// ---------- props ----------
function ball(x, y, r, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ell(0, 0, r, r, '#fff', DARK, Math.max(2, r * 0.15));
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, TAU); ctx.clip();
  const pent = (cx, cy, s) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - Math.PI / 2; ctx.lineTo(cx + Math.cos(q) * s, cy + Math.sin(q) * s); } ctx.fillStyle = '#1b1b1b'; ctx.fill(); };
  pent(0, 0, r * 0.36);
  for (let i = 0; i < 5; i++) { const q = i / 5 * TAU - Math.PI / 2; pent(Math.cos(q) * r * 0.95, Math.sin(q) * r * 0.95, r * 0.3); }
  ctx.restore(); ctx.restore();
}
function sparkle(x, y, r, a, c = '#fff59d') { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.beginPath(); for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.3 : r; ctx.lineTo(Math.cos(i / 8 * TAU) * rr, Math.sin(i / 8 * TAU) * rr); } ctx.closePath(); ctx.fillStyle = c; ctx.fill(); ctx.restore(); }
function dust(x, y, t, n = 8, spread = 120) { const R = rng(Math.floor(t * 30) + 5); for (let i = 0; i < n; i++) ell(x + (R() - 0.5) * spread, y - R() * 40, 8 + R() * 14, 6 + R() * 8, 'rgba(160,120,70,.55)', null); }
function butterfly(x, y, t, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const f = Math.abs(Math.sin(t * 18));
  for (const d of [-1, 1]) { ell(d * 22 * f, -10, 24 * f + 3, 20, '#ff7ac6', DARK, 3); ell(d * 16 * f, 14, 16 * f + 2, 13, '#ffb3e0', DARK, 3); }
  ell(0, 0, 5, 20, DARK, null); ctx.restore();
}
function fork(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  rrect(-12, -420, 24, 300, 10, '#cfd4dc', DARK, 4);
  rrect(-55, -130, 110, 40, 12, '#cfd4dc', DARK, 4);
  for (let i = 0; i < 4; i++) rrect(-50 + i * 30, -100, 16, 110, 6, '#cfd4dc', DARK, 4);
  ctx.restore();
}
function noodleBowl(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (let i = -1; i <= 1; i++) { ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 5; ctx.beginPath(); for (let j = 0; j < 12; j++) ctx.lineTo(i * 26 + Math.sin(j * 0.8 + t * 6 + i) * 8, -60 - j * 7); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-70, -30); ctx.quadraticCurveTo(0, 90, 70, -30); ctx.closePath(); ctx.fillStyle = '#e63946'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke();
  ell(0, -30, 70, 16, '#ffe27a', DARK, 4);
  ctx.strokeStyle = '#e8b931'; ctx.lineWidth = 3; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(-40 + i * 20, -30, 10, 0, Math.PI); ctx.stroke(); }
  ctx.restore();
}
function boot(x, y, a, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-40, -40); ctx.lineTo(-10, -40); ctx.lineTo(-6, -8); ctx.quadraticCurveTo(50, -6, 52, 12); ctx.lineTo(-44, 14); ctx.closePath();
  ctx.fillStyle = '#ff5a1f'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke();
  for (let i = 0; i < 4; i++) ctx.fillRect(-36 + i * 24, 14, 8, 8);
  ctx.restore();
}
function stopwatch(x, y, r, a, label) {
  rrect(x - 30, y - r - 60, 60, 50, 8, '#cfd4dc', DARK, 5);
  ell(x, y, r + 22, r + 22, '#cfd4dc', DARK, 6);
  ell(x, y, r, r, '#fffdf5', DARK, 5);
  for (let i = 0; i < 60; i++) { const q = i / 60 * TAU; const l = i % 5 ? 12 : 26; ctx.strokeStyle = DARK; ctx.lineWidth = i % 5 ? 3 : 6; ctx.beginPath(); ctx.moveTo(x + Math.sin(q) * (r - 10), y - Math.cos(q) * (r - 10)); ctx.lineTo(x + Math.sin(q) * (r - 10 - l), y - Math.cos(q) * (r - 10 - l)); ctx.stroke(); }
  limb(x, y, x + Math.sin(a) * (r - 40), y - Math.cos(a) * (r - 40), '#c1121f', 6);
  ell(x, y, 12, 12, '#c1121f', DARK, 4);
  rrect(x - 150, y + r * 0.3, 300, 84, 14, '#111', DARK, 4);
  txt(label, x, y + r * 0.3 + 44, 62, '#7CFC7C', null, 'center', 900);
}
function drumstick(x, y, a, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  rrect(30, -10, 70, 20, 10, '#f5f0e1', DARK, 4); ell(105, -12, 13, 13, '#f5f0e1', DARK, 4); ell(105, 12, 13, 13, '#f5f0e1', DARK, 4);
  ell(0, 0, 60, 46, '#c8741c', DARK, 5); ell(-15, -15, 18, 10, 'rgba(255,220,150,.6)', null);
  ctx.restore();
}
function dog(x, y, t, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ell(0, 0, 70, 40, '#c68642'); ell(70, -30, 38, 34, '#c68642'); ell(58, -60, 12, 24, '#7a4a1a', DARK, 4, -0.4);
  ell(80, -36, 6, 6, DARK, null); ell(104, -24, 9, 7, DARK, null);
  for (const lx of [-40, -15, 20, 45]) limb(lx, 30, lx + Math.sin(t * 20 + lx) * 10, 60, '#c68642', 10);
  limb(-68, -10, -100, -40 + Math.sin(t * 25) * 15, '#c68642', 8);
  ctx.restore();
}

// ---------- caricature characters ----------
// Neymar Jr. caricature: long face + pointy chin, bleached "spaghetti" hair with shaved sides,
// stubble + thin mustache, diamond stud, neck tattoo, yellow #10 with green trim, blue shorts.
const NEYMAR = { col: '#ffdf00', col2: '#0a8f3c', num: '10', hair: 'noodle', R: 64, bw: 54, skin: '#d9a47a', shorts: '#1e40af', sock: '#ffffff', longFace: 1.22, stubble: true, thinStache: true, earring: true, tattoo: true, collar: '#0a8f3c', bigTeeth: true, name: 'NEYMAR JR', photo: true, R: 70 };
const LAYUN = { col: '#0b7a3e', col2: '#ffffff', num: '', hair: 'slick', R: 52, bw: 52, skin: '#c99064', shorts: '#ffffff', sock: '#c1121f', fullBeard: true, collar: '#c1121f' };
const KID = { col: '#e63946', col2: '#fff', num: '', hair: 'mop', R: 52, bw: 40, skin: '#ffdbac', shorts: '#1e3a8a', sock: '#fff' };
const GRANNY = { col: '#a855f7', col2: '#fff', num: '', hair: 'bun', R: 50, bw: 54, skin: '#f1c27d', shorts: '#a855f7', pants: '#6b21a8', glasses: true };
const SUIT = { col: '#2b2b33', col2: '#fff', num: '', hair: 'slick', R: 50, bw: 54, skin: '#8d5524', shorts: '#2b2b33', pants: '#2b2b33', tie: true };

function guy(x, y, base, o = {}) {
  o = Object.assign({}, base, o);
  const s = o.s || 1, R = o.R, bw = o.bw, P = o.p || 0, t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
  ctx.translate(0, -80); ctx.rotate(o.rot || 0); ctx.translate(0, 80);
  ctx.lineJoin = 'round';
  const pose = o.pose || 'stand';
  let L = [[-12, 0], [12, 0]];
  if (pose === 'run') L = [[Math.sin(P) * 24, -Math.max(0, Math.cos(P)) * 16], [-Math.sin(P) * 24, -Math.max(0, -Math.cos(P)) * 16]];
  else if (pose === 'kick') L = [[-16, 0], [50, -36]];
  else if (pose === 'splay') L = [[-42, -18 + Math.sin(P) * 12], [42, -18 - Math.sin(P) * 12]];
  else if (pose === 'spread') L = [[-30, 0], [30, 0]];
  else if (pose === 'jump') L = [[-22, -20], [22, -20]];
  const hipY = -48;
  L.forEach(([fx, fy], i) => {
    const hx = i ? 9 : -9;
    limb(hx, hipY, fx, fy - 6, o.pants || o.skin, 9);
    if (!o.pants) limb(lerp(hx, fx, 0.55), lerp(hipY, fy - 6, 0.55), fx, fy - 6, o.sock || '#fff', 10);
    ell(fx + 7, fy - 3, 15, 8, o.pants ? '#3b2416' : (o.bootCol || '#111'), DARK, 3);
  });
  const top = hipY - 60;
  rrect(-bw / 2, top, bw, 64, 16, o.col);
  if (o.collar) { ctx.beginPath(); ctx.moveTo(-14, top + 1); ctx.lineTo(0, top + 14); ctx.lineTo(14, top + 1); ctx.lineWidth = 6; ctx.strokeStyle = o.collar; ctx.stroke(); }
  if (o.tie) { ctx.beginPath(); ctx.moveTo(-7, top + 2); ctx.lineTo(7, top + 2); ctx.lineTo(4, top + 44); ctx.lineTo(0, top + 52); ctx.lineTo(-4, top + 44); ctx.closePath(); ctx.fillStyle = '#d62828'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = DARK; ctx.stroke(); }
  rrect(-bw / 2 - 1, hipY - 8, bw + 2, 16, 5, o.shorts);
  if (o.num) txt(o.num, 0, top + 34, 22, o.col2, null);
  const shY = top + 10, sw = bw / 2 - 4;
  const hand = (side) => {
    const sx = side * sw, A = o.arms || 'swing';
    switch (A) {
      case 'up': return [side * (R + 22) + Math.sin(t * 14 + side) * 8, top - 40];
      case 'flail': return [sx + Math.cos(P * 1.7 + side * 2) * 46, shY + Math.sin(P * 2.3 + side) * 46];
      case 'hips': return [side * (bw / 2 + 6), top + 44];
      case 'shrug': return [side * (bw / 2 + 34), top - 16];
      case 'clutch': return [12 + side * 6, -26];
      case 'mic': return side > 0 ? [bw / 2 + 24, top - 10] : [-bw / 2 - 6, top + 44];
      case 'point': return side > 0 ? [bw / 2 + 30, top - 70] : [-bw / 2 - 8, top + 44];
      default: return [sx + side * 6 + Math.sin(P) * side * 18, top + 52];
    }
  };
  const drawArm = (side) => {
    const [hx, hy] = hand(side); const sx = side * sw;
    if (o.arms === 'hips' || o.arms === 'shrug') { const ex = side * (bw / 2 + 26), ey = top + 26; limb(sx, shY, ex, ey, o.skin, 8); limb(ex, ey, hx, hy, o.skin, 8); }
    else limb(sx, shY, hx, hy, o.tie ? o.col : o.skin, 8);
    limb(sx, shY, lerp(sx, hx, 0.3), lerp(shY, hy, 0.3), o.col, 12);
    if (o.tattoo && side > 0) { ctx.strokeStyle = 'rgba(30,30,60,.55)'; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(lerp(sx, hx, 0.6 + i * 0.1), lerp(shY, hy, 0.6 + i * 0.1), 3, 0, TAU); ctx.stroke(); } }
    ell(hx, hy, 8, 8, o.skin, DARK, 3);
    if (o.arms === 'mic' && side > 0) { limb(hx, hy, hx + 26, hy - 30, '#333', 6); ell(hx + 32, hy - 38, 14, 14, '#888', DARK, 4); }
  };
  drawArm(-1);
  if (o.photo) {
    const k = R * 2.4 / 585;
    limb(0, top + 4, 0, top - 30, o.skin, 26);
    ctx.save(); ctx.translate(0, top + 14); ctx.scale(k, k); ctx.rotate(o.headTilt || Math.sin(t * 2.3) * 0.03);
    ctx.drawImage(NEY_IMG, -322, -824); photoFace(o, t);
    ctx.restore();
  } else if (o.detailed) {
    const sc = R / 100, hy = top - 150 * sc;

  if (o.glasses) { ctx.strokeStyle = DARK; ctx.lineWidth = 4; ell(ex1, ey, er * 1.5, er * 1.4, null, DARK, 4); ell(ex2, ey, er * 1.5, er * 1.4, null, DARK, 4); }
  ctx.strokeStyle = DARK; ctx.lineCap = 'round'; ctx.lineWidth = 6;
  const by = ey - er * 1.7;
  ctx.beginPath();
  if (f === 'angry') { ctx.moveTo(ex1 - 14, by - 8); ctx.lineTo(ex1 + 12, by + 6); ctx.moveTo(ex2 + 14, by - 8); ctx.lineTo(ex2 - 12, by + 6); }
  else if (f === 'pain' || f === 'worried') { ctx.moveTo(ex1 - 14, by + 6); ctx.lineTo(ex1 + 12, by - 8); ctx.moveTo(ex2 + 14, by + 6); ctx.lineTo(ex2 - 12, by - 8); }
  else if (f === 'smug' || f === 'peek') { ctx.moveTo(ex1 - 14, by + 2); ctx.lineTo(ex1 + 12, by + 2); ctx.moveTo(ex2 - 12, by - 6); ctx.quadraticCurveTo(ex2, by - 16, ex2 + 14, by - 6); }
  else { ctx.moveTo(ex1 - 12, by - 4); ctx.lineTo(ex1 + 12, by - 6); ctx.moveTo(ex2 - 12, by - 6); ctx.lineTo(ex2 + 12, by - 4); }
  ctx.stroke();
  if (f === 'pain' || f === 'happy') { ell(ex1 - 6, hy + R * 0.25, 12, 7, 'rgba(255,90,90,.45)', null); ell(ex2 + 8, hy + R * 0.25, 12, 7, 'rgba(255,90,90,.45)', null); }
  // stubble along the jaw
  if (o.stubble) { ctx.save(); ctx.beginPath(); ctx.ellipse(0, hy, R - 2, R * LF - 2, 0, 0, TAU); ctx.clip(); ctx.fillStyle = 'rgba(70,45,30,.28)'; ctx.beginPath(); ctx.ellipse(fx * 0.4, hy + R * LF * 0.95, R * 0.95, R * 0.55, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  if (o.fullBeard) { ctx.save(); ctx.beginPath(); ctx.ellipse(0, hy, R, R * LF, 0, 0, TAU); ctx.clip(); ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.ellipse(fx * 0.5, hy + R * 0.75, R * 0.95, R * 0.55, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  const my = hy + R * 0.55;
  if (f === 'pain') { ell(fx + 4, my, R * 0.36, R * 0.3 + Math.sin(t * 30) * 3, '#7a0a0a'); ell(fx + 4, my + R * 0.16, R * 0.2, R * 0.1, '#ff6b6b', null); }
  else if (f === 'happy' || (f === 'smug' && o.bigTeeth)) {
    const w = f === 'happy' ? 0.45 : 0.36;
    ctx.beginPath(); ctx.moveTo(fx - R * w, my - 8); ctx.quadraticCurveTo(fx, my + R * (f === 'happy' ? 0.5 : 0.3), fx + R * w, my - 8); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = DARK; ctx.stroke();
    ctx.lineWidth = 2; for (let i = 1; i < 6; i++) { const xx = fx - R * w + i * R * w * 2 / 6; ctx.beginPath(); ctx.moveTo(xx, my - 7); ctx.lineTo(xx, my + 4); ctx.stroke(); }
  }
  else if (f === 'angry') { rrect(fx - R * 0.35, my - 10, R * 0.7, 22, 6, '#fff'); }
  else if (f === 'shock') ell(fx + 2, my + 4, 10, 14, '#7a0a0a');
  else if (f === 'worried') { ctx.beginPath(); ctx.moveTo(fx - 22, my); for (let i = 0; i <= 8; i++) ctx.lineTo(fx - 22 + i * 5.5, my + (i % 2 ? -5 : 5)); ctx.lineWidth = 4; ctx.stroke(); }
  else if (f === 'peek') { ell(fx + 4, my, R * 0.2, R * 0.12, '#7a0a0a'); }
  else { ctx.beginPath(); ctx.moveTo(fx - R * 0.2, my + 4); ctx.quadraticCurveTo(fx + R * 0.15, my + 10, fx + R * 0.38, my - 8); ctx.lineWidth = 5; ctx.stroke(); }
  // nose
  ell(fx + R * 0.12, hy + R * 0.2, R * 0.15, R * 0.2, o.skin, DARK, 4);
  if (o.thinStache) { ctx.strokeStyle = 'rgba(50,30,20,.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx - R * 0.22, my - 14); ctx.quadraticCurveTo(fx + R * 0.1, my - 22, fx + R * 0.4, my - 14); ctx.stroke(); }
  if (o.tears) {
    for (const [x, d] of [[ex1, -1], [ex2, 1]]) for (let i = 0; i < 9; i++) {
      const k = ((t * 3 + i / 9) % 1);
      ell(x + d * k * 120, ey - k * 70 + k * k * 170, 6, 8, '#5ec8ff', '#1e6fb3', 2);
    }
  }
}
function nameTag(x, y, s, k) { if (k <= 0) return; ctx.save(); ctx.translate(x, y); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc); ctx.font = `900 34px ${F}`; const w = ctx.measureText(s).width + 40; rrect(-w / 2, -28, w, 56, 10, '#ffdf00', DARK, 4); txt(s, 0, 0, 34, '#0a5c2a', null); ctx.restore(); }
function camera(cx, cy, z, shake = 0, t = 0) { ctx.translate(W / 2 + Math.sin(t * 90) * shake, H / 2 + Math.cos(t * 77) * shake); ctx.scale(z, z); ctx.translate(-cx, -cy); }

// ================= SCENES =================
// S1 HOOK (0–3.5): a butterfly lands on him -> he collapses
function scene1(u) {
  ctx.save(); camera(540, 1100, lerp(1.1, 1, ease(u / 3.5)), u > 2.1 && u < 2.4 ? 12 : 0, u);
  stadium(u, 0.8);
  const fall = clamp((u - 2.0) / 0.35);
  const bx = lerp(-80, 590, easeOut(clamp(u / 1.8))), by = lerp(900, 1180, easeOut(clamp(u / 1.8))) + Math.sin(u * 6) * 20;
  guy(540, fall > 0 ? lerp(GROUND, GROUND + 110, fall) : GROUND, NEYMAR, { s: 1.9, t: u, face: fall > 0 ? 'pain' : (u > 1.6 ? 'shock' : 'smug'), arms: fall > 0 ? 'flail' : 'hips', rot: -ease(fall) * Math.PI / 2, pose: fall > 0 ? 'splay' : 'stand', p: u * 20, tears: u > 2.5, look: [6, -6] });
  if (fall <= 0) butterfly(bx, by, u, 1.2); else butterfly(590 + (u - 2) * 300, 1180 - (u - 2) * 500, u, 1.2);
  if (u > 2.3) dust(540, GROUND + 60, u, 10, 300);
  ctx.restore();
  popTxt('THE ROLLING', 540, 200, 120, (u - 0.1) / 0.4, '#ffd60a', '#7a0000', Math.sin(u * 3) * 0.03);
  popTxt('KING', 540, 330, 150, (u - 0.35) / 0.4, '#ffd60a', '#7a0000', -Math.sin(u * 3) * 0.03);
  popTxt('Neymar Jr. · World Cup 2018', 540, 440, 46, (u - 0.8) / 0.4, '#fff');
  if (u > 1.0 && u < 2.0) nameTag(540, 850, 'NEYMAR JR · #10', (u - 1.0) / 0.3);
  if (u > 2.2) burst(540, 860, 200, 'AAAAAH!!', (u - 2.2) / 0.25, '#ffd60a', 66, -0.06);
  caption(['A true story*'], 1640, (u - 1.2) / 0.3, 48);
  txt('*with cartoon exaggeration', 540, 1700, 28, '#ddd', DARK, 'center', 700);
}

// S2 HAIR (3.5–8): the "spaghetti" haircut
function scene2(u) {
  const z = lerp(1.6, 2.1, ease(u / 4.5));

  if (u > 1.4) { const k = clamp((u - 1.4) / 0.5); fork(560 + Math.sin(u * 8) * 10, lerp(500, 935, easeOut(k)), Math.sin(u * 10) * 0.25 * k); }
  if (u > 2.4) { const R = rng(Math.floor(u * 20)); for (let i = 0; i < 30; i++) ell(440 + R() * 200, 860 + ((u - 2.4) * 400 + R() * 400) % 300, 4, 4, '#fff7cc', '#c9a227', 1.5); }
  ctx.restore();
  factCard('JUNE 17, 2018 · vs SWITZERLAND', ['He debuts a bleached', "“spaghetti” haircut."], u / 0.4);

  cm.forEach(([s, x, at, r], i) => {

    rrect(-w / 2, -44, w, 88, 44, '#fff', DARK, 4); ell(-w / 2 + 44, 0, 24, 24, ['#f97316', '#3b82f6', '#a855f7'][i], DARK, 3);

// S3 MEXICO (8–17): Layún steps on his ankle -> the legendary roll
function scene3(u) {
  let nx = 420, rot = -Math.PI / 2, face = 'calm', arms = 'swing', tears = false, rolls = 0;
  if (u > 2.0 && u < 6.6) {
    const k = (u - 2.0) / 4.6;
    nx = 420 + Math.sin(k * Math.PI * 2.2) * 250 + k * 120;
    const dist = Math.abs(Math.cos(k * Math.PI * 2.2)) * 0 + k * 47 * TAU;
    rot = -Math.PI / 2 - dist; rolls = Math.floor(k * 47); face = 'pain'; arms = 'clutch'; tears = true;
  } else if (u >= 6.6) { nx = 420 + Math.sin(Math.PI * 2.2) * 250 + 120; rot = -Math.PI / 2; face = u > 7.2 && u < 8.2 ? 'peek' : 'pain'; arms = 'clutch'; tears = !(u > 7.2 && u < 8.2); rolls = 47; }
  const shake = u > 1.8 && u < 2.1 ? 14 : 0;
  ctx.save(); camera(540, 1100, 1, shake, u);
  stadium(u, u > 2 ? 1 : 0.4);
  // Layún walks over to pick up the ball and steps on the ankle
  const lk = clamp(u / 1.8);
  const lx = u < 2.6 ? lerp(1000, 560, easeOut(lk)) : lerp(560, 880, ease((u - 2.6) / 1.2));
  const lift = u > 1.5 && u < 1.8 ? 1 : 0;
  guy(nx, GROUND + 95, NEYMAR, { s: 1.6, t: u, face, arms, rot, pose: 'splay', p: u * 12, tears, look: [10, -6] });
  guy(lx, GROUND - lift * 10, LAYUN, { s: 1.6, t: u, flip: true, pose: u < 1.8 ? 'run' : 'stand', p: u * 10, arms: u > 2.6 ? 'shrug' : 'swing', face: u > 2.2 ? 'shock' : 'calm', look: [-6, 6] });
  ball(u < 2.6 ? 470 : 470 + (u - 2.6) * 30, GROUND - 25, 26, 0);
  if (u > 2.0 && u < 6.6) dust(nx, GROUND + 70, u, 9, 260);
  ctx.restore();
  factCard('JULY 2, 2018 · ROUND OF 16 vs MEXICO', ['Miguel Layún steps', 'on his ankle.'], u / 0.4);
  burst(470, 1330, 90, 'step', (u - 1.8) / 0.15 * (u < 2.5 ? 1 : 0), '#fff59d', 40);
  if (u > 2.2 && u < 6.6) {
    rrect(300, 620, 480, 120, 20, 'rgba(0,0,0,.75)', '#ffd60a', 5);
    txt('ROLLS: ' + rolls, 540, 680, 72, '#ffd60a', null);
  }
  if (u > 2.4 && u < 6.6) txt('A'.repeat(Math.floor(lerp(3, 12, (u - 2.4) / 4))) + 'H!!!', 540, 830 + Math.sin(u * 22) * 6, 74, '#fff', '#c1121f');
  if (u > 7.2 && u < 8.2) bubble(nx + 120, 1120, '*checks if ref is looking*', nx + 40, 1290, (u - 7.2) / 0.2, 34);
  if (u > 6.6) caption(['Real stat: 5 min 29 sec', '*on the ground in this', '*match alone'], 760, (u - 6.6) / 0.3, 58);
  if (u < 6.6 && u > 3.2) caption(['Cartoon version:', '*47 rolls'], 1670, (u - 3.2) / 0.3, 56);
}

// S4 STOPWATCH (17–26): Swiss TV RTS timed it
function scene4(u) {
  ctx.save(); camera(540, 960, 1, 0, u);
  stadium(u, 0.3); dim(0.55);
  guy(540 + Math.sin(u * 2) * 20, GROUND + 100, NEYMAR, { s: 1.5, t: u, face: 'pain', arms: 'clutch', rot: -Math.PI / 2 + Math.sin(u * 4) * 0.15, pose: 'splay', p: u * 3, tears: true });
  ctx.restore();
  popTxt('SWISS TV (RTS) TIMED IT', 540, 180, 58, (u - 0.1) / 0.3, '#ffd60a');
  const rows = [['vs Switzerland', 220], ['vs Costa Rica', 165], ['vs Serbia', 116], ['vs Mexico', 329]];
  let total = 0;
  rows.forEach(([n, sec], i) => {
    const at = 0.8 + i * 0.8, k = clamp((u - at) / 0.6);
    total += sec * ease(k);
    if (u > at) { const y = 830 + i * 92; ctx.globalAlpha = clamp((u - at) / 0.2); rrect(150, y - 38, 780, 76, 16, 'rgba(255,255,255,.95)', DARK, 4); txt(n, 190, y, 44, DARK, null, 'left', 800); txt(`${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`, 890, y, 46, '#c1121f', null, 'right', 900); ctx.globalAlpha = 1; }
  });
  if (u < 5.6) {
    const ts = Math.round(total);
    stopwatch(540, 480, 200, ts / 60 * TAU, `${Math.floor(ts / 60)}:${String(ts % 60).padStart(2, '0')}`);
    if (u > 4.4) burst(540, 1250, 230, 'TOTAL 13:50', (u - 4.4) / 0.3, '#ffd60a', 64, -0.05);
    if (u > 4.6) caption(['on the ground', '*in just 4 games'], 1460, (u - 4.6) / 0.3, 56);
  } else {
    caption(["That's enough time to", '*cook instant noodles', '*4 times'], 520, (u - 5.6) / 0.3, 64);
    for (let i = 0; i < 4; i++) { const k = (u - 6.2 - i * 0.35) / 0.3; if (k > 0) { ctx.save(); ctx.translate(180 + i * 240, 1260); const sc = easeOutBack(clamp(k)); ctx.scale(sc, sc); noodleBowl(0, 0, 1.1, u); ctx.restore(); } }
  }
  txt('Source: RTS, reported by CBS Sports & NESN (July 2018)', 540, 1660, 26, '#ccc', DARK, 'center', 700);
}

// S5 TO BE FAIR (26–31): fouled 23 times
function scene5(u) {
  const fouls = Math.min(23, Math.floor(clamp((u - 0.6) / 3) * 23));
  ctx.save(); camera(540, 1000, 1, 0, u);
  stadium(u, 0.7);
  const jump = Math.abs(Math.sin(u * 7)) * 120;
  guy(540 + Math.sin(u * 5) * 60, GROUND - jump, NEYMAR, { s: 1.8, t: u, pose: jump > 40 ? 'jump' : 'stand', arms: 'flail', p: u * 9, face: 'shock', look: [Math.sin(u * 9) * 8, 0] });
  for (let i = 0; i < 9; i++) {
    const ph = ((u * 0.9 + i / 9) % 1), side = i % 2 ? 1 : -1;
    const x = 540 + side * lerp(700, -700, ph), y = 1150 + (i * 97) % 380;

  }

  popTxt('TO BE FAIR...', 540, 200, 90, (u - 0.1) / 0.3, '#ffd60a', '#7a0000');
  rrect(220, 300, 640, 150, 26, 'rgba(0,0,0,.8)', '#ffd60a', 6);
  txt('FOULED: ' + fouls, 540, 375, 84, '#fff', null);
  caption(['23 fouls in 4 games:', '*the most at the', '*World Cup'], 640, (u - 3.4) / 0.3, 60, '#7CFC7C');
}

// S6 THE MEME (31–36.5): #NeymarChallenge
function scene6(u) {
  ctx.save(); camera(540, 960, 1, 0, u);
  stadium(u, 1);
  const rollers = [
    [KID, 1150, 1.2, 0.0], [GRANNY, 1330, 1.25, 0.6], ['dog', 1480, 1, 1.1], [SUIT, 1600, 1.3, 1.6], [NEYMAR, 1250, 1.4, 2.4],
  ];
  rollers.forEach(([who, y, s, at], i) => {
    const k = (u - at) / 2.6; if (k <= 0 || k > 1.2) return;
    const dir = i % 2 ? -1 : 1, x = dir > 0 ? lerp(-200, 1280, k) : lerp(1280, -200, k);
    if (who === 'dog') dog(x, y, u, dir * k * 14);

  });
  if (u > 3.0) { const k = (u - 3.0) / 2.0; drumstick(lerp(-150, 1250, k), 980, k * 18, 1.1); }
  ctx.restore();
  popTxt('THEN THE WORLD', 540, 190, 76, (u - 0.1) / 0.3, '#fff');
  popTxt('STARTED ROLLING', 540, 285, 76, (u - 0.3) / 0.3, '#ffd60a', '#7a0000');
  popTxt('#NeymarChallenge', 540, 400, 60, (u - 0.7) / 0.3, '#7CFC7C');
  if (u > 3.0) caption(['Even a fried-chicken ad', '*rolled with it', '(South Africa, 2018)'], 1700, (u - 3.0) / 0.3, 46);
}

// S7 ENDING (36.5–42): the ad quote, then... he falls again
function scene7(u) {
  const fall = clamp((u - 3.2) / 0.35);
  ctx.save(); camera(540, 1000, 1, u > 3.4 && u < 3.7 ? 12 : 0, u);
  stadium(u, 0.5); dim(0.35);
  // spotlight
  const g = ctx.createRadialGradient(540, 1300, 50, 540, 1300, 520); g.addColorStop(0, 'rgba(255,255,220,.35)'); g.addColorStop(1, 'rgba(255,255,220,0)'); ctx.fillStyle = g; ctx.fillRect(0, 700, W, 1200);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(640, 1300); ctx.quadraticCurveTo(800, GROUND + 20, 1100, GROUND + 10); ctx.stroke();
  guy(540, fall > 0 ? lerp(GROUND, GROUND + 100, fall) : GROUND, NEYMAR, { s: 1.9, t: u, arms: fall > 0 ? 'flail' : 'mic', face: fall > 0 ? 'pain' : (u > 1.6 ? 'happy' : 'calm'), rot: -ease(fall) * Math.PI / 2, pose: fall > 0 ? 'splay' : 'stand', p: u * 20, tears: u > 3.6 });
  ctx.restore();
  factCard('JULY 2018 · HIS RAZOR-BRAND AD', ['Neymar responds', 'to the criticism:'], u / 0.4, '#16a34a');
  if (u < 3.4) {
    bubble(540, 520, '"You may think I exaggerate...', 560, 840, (u - 0.5) / 0.3, 40);
    if (u > 1.6) caption(['*"...and sometimes I do."'], 670, (u - 1.6) / 0.3, 56);
  }
  if (u > 3.4 && u < 4.4) burst(540, 860, 200, 'HERE WE GO', (u - 3.4) / 0.25, '#ffd60a', 54, 0.05);
  if (u >= 4.4) {
    const a = clamp((u - 4.4) / 0.3);
    ctx.fillStyle = `rgba(8,10,25,${0.85 * a})`; ctx.fillRect(0, 0, W, H);
    popTxt('FOLLOW', 540, 700, 130, (u - 4.5) / 0.3, '#ffd60a', '#7a0000');
    popTxt('for more football roasts', 540, 840, 54, (u - 4.7) / 0.3, '#fff');
    if (u > 5.0) { ctx.globalAlpha = clamp((u - 5.0) / 0.3); ['Sources: RTS via CBS Sports & NESN; ESPN;', 'SI; The Drum; Sky Sports (2018).', 'Neymar photo: Granada, Wikimedia Commons, CC BY-SA 4.0.', 'Caricature/parody. Exaggerated scenes are fiction.'].forEach((s, i) => txt(s, 540, 1050 + i * 46, 30, '#bbb', null, 'center', 700)); ctx.globalAlpha = 1; }
  }
  if (u > 1.6 && u < 3.4) txt('(quote as translated in 2018 media reports)', 540, 750, 28, '#ddd', DARK, 'center', 700);
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1150);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.4)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const CUTS = [3.5, 8, 17, 26, 31, 36.5];
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (t < 3.5) scene1(t); else if (t < 8) scene2(t - 3.5); else if (t < 17) scene3(t - 8); else if (t < 26) scene4(t - 17); else if (t < 31) scene5(t - 26); else if (t < 36.5) scene6(t - 31); else scene7(t - 36.5);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  vignette();
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, 0, W, 10); ctx.fillStyle = '#ffd60a'; ctx.fillRect(0, 0, W * t / DURATION, 10);
  for (const b of CUTS) { const a = 1 - Math.abs(t - b) / 0.12; if (a > 0) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, 0, W, H); } }
}
window.sheet = () => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#e9eef5'; ctx.fillRect(0, 0, W, H);
  const ex = ['happy', 'smug', 'calm', 'shock', 'pain', 'peek'];
  ex.forEach((f, i) => { const x = 270 + (i % 2) * 540, y = 400 + Math.floor(i / 2) * 560; guy(x, y + 170, NEYMAR, { s: 1.05, face: f, tears: f === 'pain', t: 0.3, arms: 'hips' }); txt(f.toUpperCase(), x, y + 210, 34, '#333', null); });
  guy(540, 1890, NEYMAR, { s: 1.1, face: 'happy', arms: 'hips', t: 0.3 });
};
window.render = render; window.DURATION = DURATION;
if (!location.search.includes('render')) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
